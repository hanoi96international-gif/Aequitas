name: Wache (alle 10 Minuten)
# DER WAECHTER, DEN ES NIE GAB.
#
# 12.09.2026: der Proof-Server war auf C2 seit fuenf Tagen tot und auf C1 seit
# 34 Stunden in einer Neustart-Schleife. Niemand konnte sich registrieren.
# Niemand hat es gemerkt -- die Kette lief ja. Und C1 und C2 hatten seit Tagen
# verschiedene Kontostaende, ohne dass es irgendwo rot wurde.
#
# Diese Wache prueft alle zehn Minuten, was ein Launch braucht, und faellt
# ROT um, wenn etwas fehlt. GitHub schickt bei einem fehlgeschlagenen
# Zeitplan-Lauf eine E-Mail an den, der die Datei zuletzt geaendert hat --
# das ist der ganze Alarmweg, und er kostet nichts. Ein gruener Lauf ist
# still.
#
# Was geprueft wird, je Box:
#   - Hoehe waechst (zwei Messungen im Abstand von 25 s)
#   - beide Boxen gleichauf (Abstand <= 20)
#   - Proof-Server erreichbar (sonst keine Registrierung)
#   - keine Divergenz im Kontostand (divergenz.abweichend)
#   - keine Ueberweisung beim Nachspielen uebersprungen (zustands_ablehnung)
#   - Platte nicht kritisch, Knoten nicht degraded
#   - Vergleichsdienst (/matching/health) antwortet
#   - produzenten_geschlossen ist true (Blocker 18)
# Und: der Name proof2.aequitas.digital zeigt auf keinen fremden Rechner.
# Und einmal: der Coordinator antwortet mit Quorum >= 2 (oder Quorum 1 im
# Einzelbetrieb mit aktiver Tagesgrenze), und das letzte
# Backup ist juenger als 36 Stunden.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  wache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pruefen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Alarm nur beim UMSCHLAGEN auf rot und danach alle 6 Stunden -- nicht
          # alle 10 Minuten. Massstab ist der letzte ROTE Lauf dieser Wache:
          # liegt er weniger als 6 h zurueck, bleibt dieser Lauf still (gruen).
          letzterAlarm() {
            v=$(gh api "repos/$REPO/actions/workflows/wache.yml/runs?status=failure&per_page=1" --jq '.workflow_runs[0].updated_at' 2>/dev/null) || v=""
            [ "$v" = "null" ] && v=""
            echo "$v"
          }
          set -u
          ROT=0
          rot() { echo "✗ $1"; ROT=1; }
          ok()  { echo "✓ $1"; }
          h() { curl -s --max-time 15 "http://$1:8080/api/health/combined"; }
          st() { curl -s --max-time 10 "http://$1:8080/api/status" | grep -oE '"height":[0-9]+' | cut -d: -f2; }
          # DIE AKTIVEN KNOTEN: IP=Proof-Host. Contabo1 (173.249.37.118, proof1)
          # ist seit dem 24.09.2026 abgeschaltet -- Abo nicht verlaengert, die
          # Kette startet vor dem Launch ohnehin bei null. Ein neuer zweiter
          # Server kommt HIER dazu (und in pruefstand-live.yml); bis dahin
          # meldete die Wache alle 6 h ROT fuer eine Box, die es nicht mehr gibt,
          # und uebertoente damit alles, was auf C2 wirklich schiefgeht.
          # Seit 26.09.2026 ist der neue C1 (netcup) Primary und proof1.
          # Seit 03.10.2026 ist C2 (proof2) abgeschaltet -- Box und Dienste.
          # Ein neuer zweiter Server kommt HIER wieder dazu.
          KNOTEN="188.172.229.121=proof1"
          declare -A H1 H2 PHOST
          for K in $KNOTEN; do PHOST[${K%%=*}]=${K#*=}; done
          for B in "${!PHOST[@]}"; do H1[$B]=$(st $B); done
          sleep 25
          for B in "${!PHOST[@]}"; do H2[$B]=$(st $B); done
          AKTIV=""
          for B in "${!PHOST[@]}"; do
            echo "===== $B ====="
            AKTIV="$AKTIV $B"
            if [ -z "${H2[$B]}" ]; then
              rot "$B antwortet nicht auf /api/status"
            else
              if [ "${H2[$B]}" -gt "${H1[$B]:-0}" ]; then ok "Hoehe waechst (${H1[$B]} -> ${H2[$B]})"; else rot "Hoehe steht (${H1[$B]} -> ${H2[$B]})"; fi
              # Validator-Register (Stichtag 18.10.2026): jeder Erzeuger bindet sich
              # einmal ueber /node-binding. Hinweis, kein Rot -- die Leser schlafen
              # noch; ohne Bindung schloesse erzeugerSchnitt ihn spaeter aus
              # (docs/VALIDATOR_REGISTER_KONSENS.md).
              EOB=$(curl -s --max-time 10 "http://$B:8080/api/status" | python3 -c "import sys,json; v=json.load(sys.stdin).get('erzeuger_ohne_bindung'); print(','.join(v) if isinstance(v,list) else '?')" 2>/dev/null || echo "?")
              if [ -z "$EOB" ]; then ok "jeder Erzeuger im Validator-Register gebunden"
              elif [ "$EOB" = "?" ]; then echo "ℹ $B: erzeuger_ohne_bindung nicht lesbar"
              else echo "ℹ $B: Erzeuger OHNE Bindung im Validator-Register: $EOB -- einmal ueber http://$B:8080/node-binding mit der Betreiber-Wallet binden"; fi
              # Blocker 18 (Audit K-1): nur AUTHORIZED_VALIDATORS erzeugen Bloecke.
              # Fehlt das Feld, ist es nicht true oder ist die Antwort kaputt: rot.
              PG=$(curl -s --max-time 10 "http://$B:8080/api/status" | python3 -c "import sys,json; v=json.load(sys.stdin).get('produzenten_geschlossen'); print('ja' if v is True else repr(v))" 2>/dev/null || echo "unlesbar")
              if [ "$PG" = ja ]; then ok "produzenten_geschlossen=true"; else rot "$B: produzenten_geschlossen=$PG -- jeder Schluessel koennte Bloecke erzeugen (produzenten-festlegen.yml)"; fi
              J=$(h $B)
              if [ -z "$J" ]; then rot "$B antwortet nicht auf /api/health/combined"; else echo "$J" | python3 .github/wache_pruefung.py || ROT=1; fi
            fi
            M=$(curl -s --max-time 15 "https://${PHOST[$B]}.aequitas.digital/matching/health" | grep -o '"status":"ok"')
            if [ -n "$M" ]; then ok "Vergleichsdienst antwortet"; else rot "Vergleichsdienst (/matching/health) antwortet nicht"; fi
            # Der Coordinator auf derselben Box (seit 13.09. der, auf den die App ab v1.7.0 zeigt).
            PH=${PHOST[$B]}
            CB=$(curl -s --max-time 15 "https://$PH.aequitas.digital/coordinator/health")
            QB=$(echo "$CB" | grep -oE '"quorum_size":[0-9]+' | cut -d: -f2)
            # Quorum 1 ist nur im EINZELBETRIEB in Ordnung (Entscheidung des
            # Betreibers vom 04.10.2026, coordinator/app/einzelbetrieb.py):
            # dann muss die Tagesgrenze aktiv sein. Quorum 1 ohne sie ist rot.
            EB=$(echo "$CB" | python3 -c "import sys,json
          try:
              e=json.load(sys.stdin).get('einzelbetrieb') or {}
              print('aktiv' if e.get('aktiv') and e.get('tagesgrenze') else '', e.get('tagesgrenze') or '', e.get('heute') if e.get('heute') is not None else '?')
          except Exception:
              print('')" 2>/dev/null)
            if ! echo "$CB" | grep -q '"status":"ok"'; then rot "Coordinator $PH: ${CB:-keine Antwort}"
            elif [ "${QB:-0}" -ge 2 ]; then ok "Coordinator $PH ok, Quorum $QB"
            elif [ "${QB:-0}" = 1 ] && [ "${EB%% *}" = aktiv ]; then
              set -- $EB
              ok "Coordinator $PH ok, EINZELBETRIEB: Quorum 1, Tagesgrenze $2, heute $3"
              [ "$3" != "?" ] && [ "$3" -ge "$2" ] && echo "ℹ $PH: Tagesgrenze heute erreicht -- weitere Registrierungen erst morgen (UTC)"
            else rot "Coordinator $PH: Quorum ${QB:-?} OHNE Einzelbetrieb-Tagesgrenze"; fi
            # QUORUM ERREICHBAR? quorum_size ist eine Zahl aus der Konfiguration,
            # kein Beleg. Am 24.09.2026 meldete die Wache "Quorum 2 ok", waehrend
            # einer der beiden Vergleichsdienste mit C1 verschwunden war -- keine
            # Registrierung konnte das Quorum erreichen. Gezaehlt wird, wer auf
            # /health antwortet; interne Adressen (Docker-Namen) liegen auf
            # derselben Box wie der Coordinator und gelten mit ihm als erreichbar.
            ERR=0
            for VU in $(echo "$CB" | grep -oE '"validator_urls":\[[^]]*\]' | grep -oE '[a-z]+://[^"]+'); do
              case "$VU" in
                https://*) curl -s --max-time 10 "${VU%/}/health" | grep -q '"status":"ok"' && ERR=$((ERR+1)) ;;
                *) ERR=$((ERR+1)) ;;
              esac
            done
            if [ "$ERR" -ge "${QB:-99}" ]; then ok "$PH: $ERR Vergleichsdienst(e) erreichbar, Quorum $QB erreichbar"; else rot "$PH: nur $ERR Vergleichsdienst(e) erreichbar, Quorum $QB -- KEINE Registrierung moeglich"; fi
            # Offene Widersprueche (Art. 22 Abs. 3): ein Mensch wartet auf einen
            # anderen Menschen. Das ist ROT, nicht Hinweis -- ein gruener Lauf
            # ist still, und dann erfaehrt es niemand. Nur Zahlen; welche und
            # warum zeigt widersprueche-pruefen.yml. Fehlt das Feld (Coordinator
            # aelter als 23.09.2026), gilt 0.
            WO=$(echo "$CB" | grep -oE '"widersprueche_offen":[0-9]+' | cut -d: -f2)
            if [ "${WO:-0}" -gt 0 ]; then rot "$PH: ${WO} offene(r) Widerspruch/Widersprueche -- ein Mensch muss entscheiden (widersprueche-pruefen.yml, Frist ein Monat)"; fi
            if echo "$CB" | grep -q 'widerspruch_ueber_einen_monat_offen'; then rot "$PH: ein Widerspruch liegt LAENGER ALS EINEN MONAT (Art. 12 Abs. 3)"; fi
          done
          echo "===== Netz ====="
          set -- $AKTIV
          if [ "$#" -lt 2 ]; then
            # Bekannt und entschieden (24.09.2026): bis der neue zweite Server
            # steht, gibt es einen Validator. Hinweis, kein Rot -- sonst waere
            # die Wache dauerhaft rot und damit wertlos. Launch-Blocker in
            # docs/LAUNCH_CHECKLISTE.md.
            echo "ℹ nur EIN Validator aktiv -- der zweite Server fehlt (Launch-Blocker)"
          else
            MIN=""; MAX=0
            for B in $AKTIV; do V=${H2[$B]:-0}; [ -z "$MIN" ] || [ "$V" -lt "$MIN" ] && MIN=$V; [ "$V" -gt "$MAX" ] && MAX=$V; done
            D=$(( MAX - MIN ))
            if [ "$D" -le 20 ]; then ok "Boxen gleichauf (Abstand $D)"; else rot "Boxen nicht gleichauf (Abstand $D)"; fi
          fi
          # Namen abgeschalteter Server: die APK v1.12.3 weicht auf proof2 aus
          # (Coordinator mit Gesichtsaufnahmen, API, RPC). Zeigt der Name auf
          # einen fremden Rechner, holt der sich ein Zertifikat und bekommt das.
          # Erlaubt: loest nicht auf, oder nur auf einen eigenen Knoten.
          for N in proof2.aequitas.digital; do
            ZIEL=$( { dig +short A "$N"; dig +short AAAA "$N"; } 2>/dev/null | sed 's/\.$//' | sort -u | tr '\n' ' ' | sed 's/ $//')
            FREMD=""
            for Z in $ZIEL; do case " ${!PHOST[*]} " in *" $Z "*) ;; *) FREMD="$FREMD $Z" ;; esac; done
            if [ -z "$ZIEL" ]; then ok "$N loest nicht auf"
            elif [ -z "$FREMD" ]; then ok "$N zeigt nur auf eigene Knoten ($ZIEL)"
            else rot "$N zeigt auf$FREMD -- nicht unser Server; alte Apps weichen dorthin aus (auch mit Gesichtsaufnahmen). DNS-Eintrag loeschen"; fi
          done
          LAST=$(gh api "repos/$REPO/actions/workflows/backup-ledger.yml/runs?per_page=5&status=success" --jq '.workflow_runs[0].updated_at' 2>/dev/null)
          if [ -n "$LAST" ] && [ "$LAST" != "null" ]; then
            AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 3600 ))
            if [ "$AGE" -le 36 ]; then ok "letztes erfolgreiches Backup vor ${AGE} h"; else rot "letztes erfolgreiches Backup vor ${AGE} h (> 36)"; fi
          else
            rot "kein erfolgreiches Backup gefunden"
          fi
          echo "====="
          if [ "$ROT" = 1 ]; then
            LA=$(letzterAlarm)
            if [ -n "$LA" ] && [ $(( $(date +%s) - $(date -d "$LA" +%s) )) -lt 21600 ]; then
              echo "ROT -- schon gemeldet ($LA), naechste Erinnerung nach 6 h"; exit 0
            fi
            echo "ROT -- Alarm"; exit 1
          fi
          echo "GRUEN"
