name: Set the APK download fallback on both boxes (manual)

# /download/app.apk serves the APK bind-mounted at downloads/aequitas-app.apk
# and only redirects to a URL when that file is absent. AEQUITAS_APK_URL is
# that fallback, and it decouples shipping a new app from redeploying the
# chain (api.go's handleAppDownload).
#
# WHY THIS EXISTS. It was left at app-v1.4.1 while the shipped release was
# already app-v1.5.2 -- three releases back, and the older builds are exactly
# the ones whose personhood check was not yet enforced. Nobody noticed because
# the mount was present on both boxes, so the fallback never fired: measured
# live on 2026-08-24, /download/app.apk returned 215,114,899 bytes,
# byte-for-byte app-v1.5.2. A latent wrong answer, not a visible one -- which
# is why it needed a tool rather than a one-off fix.
#
# The compiled-in default (defaultAPKReleaseURL) points at releases/latest,
# so a box with NO variable set always serves the newest release. Setting it
# here pins a specific release.
#
# Run this right after publishing a new app release -- or not at all: without
# AEQUITAS_APK_URL the node redirects to releases/latest, which is always the
# newest release (api.go, defaultAPKReleaseURL).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag im App-Repo, z. B. app-v1.8.2"
        required: true
        default: "app-v1.8.2"

jobs:
  set:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - name: Pruefen, dass es das Release ueberhaupt gibt
        # Zuerst, und als eigener Schritt: eine Fallback-URL auf ein nicht
        # existierendes Release ist schlimmer als eine veraltete -- die
        # veraltete liefert wenigstens eine App aus.
        run: |
          set -euo pipefail
          URL="https://github.com/hanoi96international-gif/Aequitas-App/releases/download/${{ inputs.tag }}/app-release.apk"
          echo "Pruefe: $URL"
          CODE="$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")"
          SIZE="$(curl -sIL -o /dev/null -w '%{size_download}' "$URL")"
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "FEHLER: ${{ inputs.tag }} liefert kein abrufbares app-release.apk."; exit 1; }
          echo "APK_URL=$URL" >> "$GITHUB_ENV"

      - name: C1 (netcup, 188.172.229.121)
        # Seit dem 26.09.2026 der neue C1; die alte Contabo1-IP 173.249.37.118
        # ist abgeschaltet. Der Knoten liest deploy/validator/.env (Compose,
        # deploy/deploy-c1.sh). C2 ist seit dem Neustart bei null ohne Knoten
        # (C2_AKTIV in deploy-c1-dann-c2.yml) und wird hier nicht angefasst.
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/kh
          ssh-keygen -lf ~/.ssh/kh | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA' || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cat ~/.ssh/kh >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/k -o BatchMode=yes root@188.172.229.121 "APK_URL='$APK_URL' bash -s" <<'SKRIPT'
          set -euo pipefail
          ENV_FILE=/root/Aequitas/deploy/validator/.env
          [ -f "$ENV_FILE" ] || { echo "FEHLER: $ENV_FILE fehlt"; exit 1; }
          cp -a "$ENV_FILE" "${ENV_FILE}.bak.$(date +%s)"
          # Ersetzen falls vorhanden, sonst anhaengen -- eine zweite Zeile
          # waere eine Frage der Lesereihenfolge.
          if grep -q '^AEQUITAS_APK_URL=' "$ENV_FILE"; then
            sed -i "s#^AEQUITAS_APK_URL=.*#AEQUITAS_APK_URL=${APK_URL}#" "$ENV_FILE"
          else
            echo "AEQUITAS_APK_URL=${APK_URL}" >> "$ENV_FILE"
          fi
          grep '^AEQUITAS_APK_URL=' "$ENV_FILE"
          echo "Hinweis: wirksam beim naechsten Neustart des Knotens (naechster Deploy)."
          SKRIPT
