name: Standorte der Server (fuer die Datenschutzerklaerung)
# Die Datenschutzerklaerung (datenschutz.html, Abschnitt 8) nennt, wo die
# Daten verarbeitet werden. Seit dem Umzug auf netcup (26.09.2026) und der
# Abschaltung von C2 (03.10.2026) stand dort noch "zwei Server bei Contabo".
# Dieser Lauf liest den Standort der aktiven Server aus oeffentlichen
# Registern (RIPE RDAP, ipinfo) -- nur lesend, keine Box wird angefasst.
on:
  workflow_dispatch:
  push:
    branches: [claude/pr-265-app-build-status-t0wxru]
    paths: [.github/workflows/standorte.yml]
permissions:
  contents: read
jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register abfragen
        run: |
          set -u
          for ip in 188.172.229.121; do
            echo "=== $ip ==="
            curl -s -m 20 "https://rdap.db.ripe.net/ip/$ip" \
              | jq -r '"Netz: \(.name // "?")  Land: \(.country // "?")", (.entities[]? | select(.roles[]? == "registrant" or .roles[]? == "administrative") | (.vcardArray[1][]? | select(.[0]=="fn" or .[0]=="adr") | "  \(.[0]): \(.[1].label // .[3])"))' 2>/dev/null | head -12
            curl -s -m 20 "https://ipinfo.io/$ip/json" | jq -r '"ipinfo: \(.city // "?"), \(.region // "?"), \(.country // "?") -- \(.org // "?")"'
          done
