name: Heap C1 -- wo liegt der Speicher? (nur lesen)
# Holt das Heap-Profil von C1 (pprof, nur im Container auf 127.0.0.1:6061)
# und zeigt die groessten Posten nach belegtem Speicher. Nur Funktionsnamen
# und Groessen -- keine Adressen, keine Kontostaende.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  heap:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.24'}
      - name: Schluessel und Host-Pruefung
        env:
          K1: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$K1" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); $_ = $d if $d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/; } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/c1 && chmod 600 ~/.ssh/c1
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/k1
          ssh-keygen -lf ~/.ssh/k1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA'
          cp ~/.ssh/k1 ~/.ssh/known_hosts
      - name: Profil holen
        run: |
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 'bash -s' > /tmp/heap.pb.gz <<'SKRIPT'
          docker exec aequitas-node sh -c 'wget -q -O - http://127.0.0.1:6061/debug/pprof/heap 2>/dev/null || curl -s http://127.0.0.1:6061/debug/pprof/heap'
          SKRIPT
          ls -la /tmp/heap.pb.gz
      - name: Groesste Posten (belegt)
        run: |
          go tool pprof -sample_index=inuse_space -top -nodecount=35 /tmp/heap.pb.gz 2>&1 | head -50
          echo "--- kumulativ ---"
          go tool pprof -sample_index=inuse_space -top -cum -nodecount=35 /tmp/heap.pb.gz 2>&1 | head -50
