name: Deploy to Contabo2 VPS

on:
  push:
    # main only — see deploy-contabo.yml for why master was removed.
    branches: [main]
    # See deploy-contabo.yml: a workflow- or docs-only push must not restart
    # the node.
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  # Mirrors deploy-contabo.yml's test gate (Monster Audit 2026-07-12, P1) —
  # a failing build/test blocks the SSH deploy step entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # FIX (2026-07-25 night): see deploy-contabo.yml's matching comment —
      # simultaneous restarts of all three nodes forked the network twice in
      # one evening. This workflow restarts LAST: wait for the primary to
      # serve traffic again (Railway redeploys it on this same push), then
      # wait for Contabo1's deploy of this same commit to complete, so at
      # every moment during a rollout at least two already-converged nodes
      # are up. Both waits fail open after their timeout so nothing can
      # permanently block deploying a fix.
      # FIX (2026-08-14): removed a poll of https://aequitas.digital/api/status
      # that waited for Railway to finish redeploying the primary. Railway is
      # decommissioned and that URL answers 404 forever, so this loop spent its
      # full 15 minutes doing nothing on every deploy. The staggering it was
      # part of is preserved by the step below, which waits for Contabo1's
      # deploy of this same commit — with only two boxes left, that is the
      # whole ordering constraint.
      - name: Wait for Contabo1's deploy of this same commit to finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 40 minutes, not 20. Contabo1's job now runs its "alive and
          # advancing" check until the height actually moves (up to ~10 min on
          # top of a ~5 min wait for the node to answer at all), on top of the
          # build itself and its own fail-open wait for THIS box. If this loop
          # can expire before that job can finish, it falls open and deploys
          # Contabo2 while Contabo1 is still mid-rollout - which is exactly the
          # simultaneous restart the staggering exists to prevent, arriving
          # silently through a timeout rather than a decision.
          for i in $(seq 1 120); do
            run=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name=="Deploy to Contabo VPS")][0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "unknown unknown")
            status=${run%% *}
            conclusion=${run##* }
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              # The whole point of this wait is that two converged nodes stay up
              # during a rollout. "completed" alone includes failure, cancelled
              # and timed_out: if Contabo1's deploy just broke the primary,
              # proceeding here would stop and rebuild the ONLY remaining
              # validator, taking the entire network down at once. Refuse, and
              # fail loudly so someone looks. Contabo2 keeps serving the old
              # image, which is the safe state. Re-run this workflow by hand
              # once Contabo1 is healthy.
              echo "Contabo1's deploy finished with conclusion='$conclusion', not success."
              echo "NOT restarting Contabo2 - it is currently the healthy validator."
              exit 1
            fi
            if [ "$status" = "completed" ]; then
              echo "Contabo1's deploy completed — proceeding with the Contabo2 deploy"
              exit 0
            fi
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              echo "no Contabo1 deploy run found for this commit (docs-only path filter difference?) — proceeding"
              exit 0
            fi
            echo "Contabo1 deploy status: $status — waiting ($i/120)"
            sleep 20
          done
          echo "gave up waiting for Contabo1's deploy after 40 min — proceeding anyway (fail-open)"
      - name: Deploy to Contabo2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          # SHA256 fingerprint of Contabo2's negotiated host key (ECDSA —
          # same type Contabo1 ended up negotiating, see deploy-contabo.yml's
          # own comment on how that was determined). Verified live:
          # `ssh-keyscan -t ecdsa 194.163.188.71 | ssh-keygen -lf -`.
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          # IMPORTANT: intentionally NOT /root/deploy.sh (Contabo1's script)
          # — that recreates the container with --env-file /root/.aequitas.env
          # directly, and this box's .aequitas.env permanently contains
          # RESYNC_FROM_SNAPSHOT=true, which would wipe the DB on every
          # single deploy. deploy_safe_c2.sh rebuilds the image, then
          # preserves the currently-running container's own env (stripping
          # PATH/HOSTNAME/HOME/RESYNC_FROM_SNAPSHOT) — same pattern as the
          # existing redeploy_normal_c2.sh, plus an actual image rebuild.
          script: |
            set -uo pipefail
            # Prune BEFORE the build, not only after it.
            #
            # The post-build prune below bounds how much cache a finished deploy
            # leaves behind, but it cannot help a deploy that has no room to build
            # in the first place -- and that is the failure that actually occurred:
            # Contabo2 reached 100% (474MB free of 96GB) and the image build died
            # with "no space left on device" at the go build step, long before
            # anything downstream could reclaim a byte. Ordering the reclaim first
            # makes the deploy self-healing instead of self-blocking.
            #
            # Costs nothing when the cache is already under the cap, and the node
            # keeps running throughout either way: build cache is never a dependency
            # of a running container.
            echo "=== disk before deploy ==="
            df -h / | tail -1
            docker builder prune -af --max-used-space 10GB >/dev/null 2>&1 || docker builder prune -af >/dev/null 2>&1 || true
            # Record which commit this image is built from. The Dockerfile reads
            # this file when no --build-arg GIT_COMMIT is passed, which is the
            # case here because the build happens inside the box-side script and
            # that script is not version-controlled in this repository. Without
            # it every node reports git_commit "unknown" and the explorer cannot
            # tell whether the fleet is on one build. Best-effort: a checkout
            # that cannot answer leaves the file absent and the build falls back
            # to "unknown", exactly as before.
            ( cd /root/Aequitas 2>/dev/null && git rev-parse --short HEAD > .git-commit-stamp ) || true
            /root/deploy_safe_c2.sh

            # FIX (2026-07-25): cap the build cache after every deploy.
            #
            # deploy_safe_c2.sh rebuilds the image from scratch on each dispatch, and
            # each rebuild leaves its layers in the builder cache. Nothing ever
            # removed them. Measured on Contabo2 after one night of frequent
            # deploys:
            #
            #     /dev/sda1  96G  96G  136K  100% /
            #     Build Cache  209 entries  96.07GB
            #
            # The build cache alone was the entire disk. The next deploy then
            # failed outright ("no space left on device" while copying the
            # source), and a node whose filesystem is full cannot commit to
            # Postgres or write its WAL either -- so this silently degrades the
            # very throughput path being measured, long before it announces
            # itself as a failed build.
            #
            # Safe to prune: an image's finished layers live in the image store
            # (docker images), which is untouched. The build cache is purely an
            # accelerator for the NEXT build, never a dependency of a running
            # container.
            #
            # --max-used-space, NOT --keep-storage. This step has existed since
            # 2026-07-25 and the cache still reached 91.21GB on a 96GB disk,
            # filling it to 474MB free with Postgres writing to it. The reason
            # is that modern Docker maps --keep-storage onto --reserved-space,
            # which its own help text defines as "amount of disk space ALWAYS
            # ALLOWED" -- a floor guaranteeing the cache survives, not a cap
            # bounding it. The flag that actually bounds it is --max-used-space
            # ("maximum amount of disk space allowed"). The old form ran
            # successfully on every deploy and reported a plausible-looking
            # "Total: ...", which is why it read as working for three days.
            # Single line, no backslash continuations: this file is committed
            # with CRLF, and a backslash followed by CR escapes the CR instead
            # of continuing the line -- a trap already documented in
            # diagnose-tps-ceiling-contabo2.yml after it silently mangled a
            # command there.
            if docker builder prune -af --max-used-space 10GB >/tmp/prune.out 2>/dev/null; then tail -2 /tmp/prune.out; else docker builder prune -af 2>/dev/null | tail -2 || echo "(builder prune unavailable - watch disk usage manually)"; fi
            echo "=== disk after deploy ==="
            df -h / | tail -1
          script_stop: true
          timeout: 1800s
          command_timeout: 1800s
      # Contabo1's own deploy gained this check first; without the same one
      # here, half the rollout still reports success on evidence that does not
      # include the node running. deploy_safe_c2.sh exiting 0 means `docker run`
      # returned a container ID, nothing more.
      #
      # Nothing downstream gates on this run, which is exactly why a silent
      # failure here is easy to miss: Contabo1 is already redeployed and
      # healthy by this point, so the chain keeps producing and looks fine
      # while quietly running on ONE validator — the precise state the whole
      # staggered rollout exists to prevent. Measured on the 2026-08-15 deploy,
      # this box needs about 90 seconds before its first answer, so the poll
      # below allows five minutes.
      - name: Verify Contabo2 is alive and advancing after the deploy
        run: |
          set -uo pipefail
          BASE=http://194.163.188.71:8080
          up=""
          for i in $(seq 1 30); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$BASE/api/health/combined" || echo 000)
            if [ "$code" = "200" ]; then
              up=yes
              echo "node is answering (after $i attempt(s))"
              break
            fi
            echo "waiting for the node to answer - attempt $i/30, last HTTP $code"
            sleep 10
          done
          if [ -z "$up" ]; then
            echo "FAILED: no 200 from /api/health/combined within 5 minutes."
            echo "The container may have exited, or the build produced a binary that cannot start."
            echo "The network is now running on Contabo1 alone."
            exit 1
          fi
          # A restarted node answers /api/health/combined BEFORE it is following
          # the chain: it has to rebuild the DAG from chain_blocks and finish
          # replay first, and on the box that stores its payloads gzipped that
          # means gunzipping millions of rows. Sampling height exactly twice, 60
          # seconds apart, therefore measures whichever moment the deploy
          # happens to land in.
          #
          # THE INCIDENT THIS PINS (2026-08-19, the second one that day). The
          # hotfix that got Contabo2 off height 0 deployed cleanly and the node
          # came back correctly - and this step failed it anyway, on
          # "height 4166335 -> 4166335 over 60s", because it read the two
          # samples during the window between "answers HTTP" and "starts
          # merging". Half an hour later the box was at 4168501 and in sync with
          # Contabo1 the whole time. A red deploy on a healthy validator is not
          # a harmless false alarm: it is the same signal as a real stall, so
          # the next real one gets read as noise, and it fires the
          # non-success branch of Contabo2's wait step, which by design refuses
          # to deploy at all.
          #
          # So: keep sampling until the height MOVES, and fail only when it has
          # not moved for the whole budget. A healthy node still passes on the
          # first sample; a genuinely stuck one still fails, just later. The
          # budget is bounded by Contabo2's "wait for Contabo1's deploy" step -
          # if this can outlast that wait, Contabo2 stops being staggered behind
          # Contabo1. Change one, check the other.
          #
          # read_height echoes a non-negative integer, or nothing at all. Every
          # non-numeric answer - empty body, null, an HTML error page from a
          # proxy, a JSON error object - has to land in the same bucket as "no
          # answer". The previous version let one through: `[ "$h2" -le "$h1" ]`
          # on a non-numeric value is a bash *error*, and an erroring `if`
          # condition is simply false, so the step fell through to "OK: node is
          # alive and advancing" and reported a PASS for a node whose height it
          # had never actually read.
          read_height() {
            local h
            h=$(curl -s -m 25 "$BASE/api/status" | jq -r '.height // empty' 2>/dev/null || true)
            case "$h" in
              ''|*[!0-9]*) return 1 ;;
            esac
            echo "$h"
          }
          h0=""
          advanced=""
          for i in $(seq 1 21); do
            h=$(read_height) || h=""
            if [ -z "$h" ]; then
              echo "sample $i/21: /api/status returned no numeric .height"
            elif [ -z "$h0" ]; then
              h0=$h
              echo "sample $i/21: baseline height $h0"
            elif [ "$h" -gt "$h0" ]; then
              echo "sample $i/21: height $h0 -> $h"
              advanced=yes
              break
            else
              echo "sample $i/21: height still $h (baseline $h0)"
            fi
            sleep 30
          done
          if [ -z "$advanced" ]; then
            if [ -z "$h0" ]; then
              echo "FAILED: /api/status never returned a numeric .height in 10 minutes,"
              echo "even though /api/health/combined answers 200."
            else
              echo "FAILED: the node answers but its height never moved in 10 minutes"
              echo "(baseline $h0). It is up without following the chain - merging or"
              echo "replay is stuck."
            fi
            echo "Contabo1 is already redeployed by this point, so the chain keeps"
            echo "producing on ONE validator - the state the staggered rollout exists"
            echo "to prevent."
            exit 1
          fi
          echo "OK: node is alive and advancing."
