name: Deploy to Contabo2 VPS

on:
  push:
    branches: [master, main]
    # See deploy-contabo.yml: a workflow- or docs-only push must not restart
    # the node.
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  # Mirrors deploy-contabo.yml's test gate (Monster Audit 2026-07-12, P1) —
  # a failing build/test blocks the SSH deploy step entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # FIX (2026-07-25 night): see deploy-contabo.yml's matching comment —
      # simultaneous restarts of all three nodes forked the network twice in
      # one evening. This workflow restarts LAST: wait for the primary to
      # serve traffic again (Railway redeploys it on this same push), then
      # wait for Contabo1's deploy of this same commit to complete, so at
      # every moment during a rollout at least two already-converged nodes
      # are up. Both waits fail open after their timeout so nothing can
      # permanently block deploying a fix.
      - name: Wait for the primary to be healthy again (Railway redeploys on this same push)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://aequitas.digital/api/status || true)
            if [ "$code" = "200" ]; then
              echo "primary healthy again (HTTP 200)"
              exit 0
            fi
            echo "primary not ready yet (HTTP $code) — waiting ($i/60)"
            sleep 15
          done
          echo "primary still unreachable after 15 min — proceeding anyway (fail-open)"
      - name: Wait for Contabo1's deploy of this same commit to finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            status=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name=="Deploy to Contabo VPS")][0].status' 2>/dev/null || echo unknown)
            if [ "$status" = "completed" ]; then
              echo "Contabo1's deploy completed — proceeding with the Contabo2 deploy"
              exit 0
            fi
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              echo "no Contabo1 deploy run found for this commit (docs-only path filter difference?) — proceeding"
              exit 0
            fi
            echo "Contabo1 deploy status: $status — waiting ($i/60)"
            sleep 20
          done
          echo "gave up waiting for Contabo1's deploy after 20 min — proceeding anyway (fail-open)"
      - name: Deploy to Contabo2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          # SHA256 fingerprint of Contabo2's negotiated host key (ECDSA —
          # same type Contabo1 ended up negotiating, see deploy-contabo.yml's
          # own comment on how that was determined). Verified live:
          # `ssh-keyscan -t ecdsa 194.163.188.71 | ssh-keygen -lf -`.
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          # IMPORTANT: intentionally NOT /root/deploy.sh (Contabo1's script)
          # — that recreates the container with --env-file /root/.aequitas.env
          # directly, and this box's .aequitas.env permanently contains
          # RESYNC_FROM_SNAPSHOT=true, which would wipe the DB on every
          # single deploy. deploy_safe_c2.sh rebuilds the image, then
          # preserves the currently-running container's own env (stripping
          # PATH/HOSTNAME/HOME/RESYNC_FROM_SNAPSHOT) — same pattern as the
          # existing redeploy_normal_c2.sh, plus an actual image rebuild.
          script: |
            set -uo pipefail
            /root/deploy_safe_c2.sh

            # FIX (2026-07-25): cap the build cache after every deploy.
            #
            # deploy_safe_c2.sh rebuilds the image from scratch on each dispatch, and
            # each rebuild leaves its layers in the builder cache. Nothing ever
            # removed them. Measured on Contabo2 after one night of frequent
            # deploys:
            #
            #     /dev/sda1  96G  96G  136K  100% /
            #     Build Cache  209 entries  96.07GB
            #
            # The build cache alone was the entire disk. The next deploy then
            # failed outright ("no space left on device" while copying the
            # source), and a node whose filesystem is full cannot commit to
            # Postgres or write its WAL either -- so this silently degrades the
            # very throughput path being measured, long before it announces
            # itself as a failed build.
            #
            # Safe to prune: an image's finished layers live in the image store
            # (docker images), which is untouched. The build cache is purely an
            # accelerator for the NEXT build, never a dependency of a running
            # container.
            #
            # Bounded rather than emptied, so the next build still reuses most
            # layers and deploys stay fast. --keep-storage is not present on
            # every Docker version, hence the fallback to a full prune -- both
            # are safe, the bounded form is merely kinder to build times.
            docker builder prune -af --keep-storage 10GB 2>/dev/null | tail -2 \
              || docker builder prune -af 2>/dev/null | tail -2 \
              || echo "(builder prune unavailable — watch disk usage manually)"
            echo "=== disk after deploy ==="
            df -h / | tail -1
          script_stop: true
          timeout: 600s
          command_timeout: 600s
