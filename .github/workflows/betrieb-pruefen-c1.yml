name: Betrieb pruefen -- C1 (nur lesen)

# Ein Blick auf C1, ohne etwas zu veraendern:
#   - laeuft der Knoten, steigt die Hoehe
#   - sind die noetigen Einstellungen GESETZT (nur "gesetzt"/"fehlt", nie der
#     Wert -- das Repository ist oeffentlich, jeder Lauf ist lesbar)
#   - oeffentliche Gesundheitswerte von Knoten, Coordinator und Vergleichsdienst
#     (dieselben Felder, die ohnehin ueber HTTPS erreichbar sind)
#   - Fehlerzeilen im Knoten-Log seit einem Zeitpunkt (Nachspielen,
#     Wirtschaft, panic), Hex-Folgen unkenntlich gemacht
on:
  workflow_dispatch:
    inputs:
      seit:
        description: "Log seit (RFC3339 oder z. B. 30m)"
        required: true
        default: "60m"

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    env:
      C1: 188.172.229.121
    steps:
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA' || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cat ~/.ssh/kh1 >> ~/.ssh/known_hosts
      - name: Lesen
        env:
          SEIT: ${{ inputs.seit }}
        run: |
          case "$SEIT" in *[!0-9A-Za-z:+.-]*) echo "::error::ungueltiger Zeitpunkt"; exit 1;; esac
          ssh -o BatchMode=yes root@$C1 "SEIT='$SEIT' bash -s" <<'SKRIPT'
          set -u
          echo "=== Container ==="
          docker ps --format '{{.Names}} | {{.Status}} | {{.Image}}' | sort
          echo
          echo "=== Einstellungen (nur gesetzt/fehlt) ==="
          zeige() {
            c=$1; shift
            env=$(docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null) || { echo "$c: nicht vorhanden"; return; }
            for n in "$@"; do
              if echo "$env" | grep -qE "^$n=.+"; then echo "$c: $n gesetzt"; else echo "$c: $n FEHLT"; fi
            done
          }
          zeige aequitas-node PROOF_SERVER_URLS CHAIN_SERVICE_TOKEN AUTHORIZED_VALIDATORS
          zeige aequitas-coordinator CHAIN_BASE_URL VALIDATOR_URLS QUORUM_SIZE SERVICE_MODE ALTERSPRUEFUNG
          zeige aequitas-matching CHAIN_BASE_URL SERVICE_MODE ALTERSPRUEFUNG ALTER_MODELL_PFAD ALTER_MODELL_SHA256
          echo
          echo "=== Knoten: Hoehe ==="
          h1=$(curl -s --max-time 5 http://127.0.0.1:8080/api/status | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("height") or d.get("block_height") or d.get("latest_height") or "?")' 2>/dev/null || echo "?")
          sleep 20
          h2=$(curl -s --max-time 5 http://127.0.0.1:8080/api/status | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("height") or d.get("block_height") or d.get("latest_height") or "?")' 2>/dev/null || echo "?")
          echo "Hoehe: $h1 -> $h2 (20 s)"
          echo
          echo "=== Knoten: /api/health/combined (oeffentlich) ==="
          curl -s --max-time 10 http://127.0.0.1:8080/api/health/combined | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          def flach(x, p=""):
              if isinstance(x, dict):
                  for k, v in x.items():
                      yield from flach(v, f"{p}{k}.")
              else:
                  yield p[:-1], x
          for k, v in flach(d):
              if any(s in k for s in ("proof", "sync", "healthy", "human", "height", "status")):
                  print(f"{k} = {str(v)[:80]}")
          ' 2>/dev/null || echo "(nicht lesbar)"
          echo
          echo "=== Vergleichsdienst: /health (Auszug) ==="
          docker exec aequitas-matching python -c "import json,urllib.request,os; p=os.environ.get('PORT','8098'); d=json.load(urllib.request.urlopen('http://127.0.0.1:'+p+'/health', timeout=10)); print(json.dumps({k:d.get(k) for k in ('gallery_real','gallery_test','real_data_unlocked','consent_version_current','consents_outdated')}, sort_keys=True)); print('alter:', json.dumps({k:(d.get('alter') or {}).get(k) for k in ('modus','pruefgrenze','modell_bereit')}))" 2>/dev/null || echo "(nicht lesbar)"
          echo
          echo "=== Knoten-Log seit $SEIT: Fehler ==="
          docker logs --since "$SEIT" aequitas-node 2>&1 \
            | grep -E 'panic|FATAL|✗|REPLAY.*(abgelehnt|rolling back)|[Ww]irtschaft.*(Fehler|error)|StateRoot.*(mismatch|Abweichung)' \
            | sed -E 's/0x[0-9a-fA-F]{8,}/0x…/g; s/[0-9a-fA-F]{32,}/#/g' | cut -c1-220 | tail -40
          echo "(Ende der Fehlerzeilen)"
          echo "Zeilen gesamt seit $SEIT: $(docker logs --since "$SEIT" aequitas-node 2>&1 | wc -l)"
          SKRIPT
