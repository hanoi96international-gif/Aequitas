name: Which loadtest accounts still hold AEQ? (read-only)

# The loadtest takes the FIRST N rows of accounts.csv as its seeds
# (main.go: seeds := accs[:*numSeeds]), and those five hold nothing. But 1,201
# accounts were generated and /api/snapshot shows 946 non-human accounts still
# holding 15.5 AEQ between them -- far more than the ~1.2 AEQ a full run needs.
#
# If those are loadtest accounts, nothing has to be sent anywhere: which
# account is a seed is a question of which ROW it occupies, not of funding it.
#
# WHY THIS JOINS A SNAPSHOT INSTEAD OF QUERYING PER ACCOUNT
#
# The first version of this workflow asked /api/balance once per account and
# reported all 1,201 as empty -- including accounts a snapshot proved held
# 0.971 AEQ. The endpoint's parameter is `wallet`, not `address`, and
# handleBalance answers a missing one with {"balance":0,...} rather than an
# error, so every request looked like a funded-account-with-nothing-in-it. One
# snapshot read on the box and a local join cannot fail that way, and does not
# risk a rate limit either.
#
# Addresses only. accounts.csv holds private keys and main.go's docstring is
# explicit that it must never be printed, copied off the box, or uploaded.
on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Contabo2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 600s
          command_timeout: 600s
          script: |
            CSV=/root/contabo-loadtest/accounts.csv
            BAK=/root/contabo-loadtest/accounts.csv.funded-seeds.bak
            [ -f "$CSV" ] || { echo "no accounts.csv"; exit 1; }

            curl -s --max-time 60 http://127.0.0.1:8080/api/snapshot -o /tmp/snap.json
            echo "snapshot bytes: $(wc -c < /tmp/snap.json)"

            # address<TAB>balance for every account carrying anything
            python3 - <<'PY'
            import json
            d=json.load(open("/tmp/snap.json"))
            with open("/tmp/funded.tsv","w") as f:
                n=0
                for a in d.get("accounts",[]):
                    b=float(a.get("balance") or 0)
                    if b>0:
                        f.write("%s\t%.6f\n"%(a["address"].lower(),b)); n+=1
            print("accounts holding AEQ on chain:",n)
            PY

            for FILE in "$CSV" "$BAK"; do
              [ -f "$FILE" ] || continue
              echo ""
              echo "=== $(basename "$FILE") -- rows: $(wc -l < "$FILE") ==="
              awk -F, 'NF>=2 && $2 ~ /^0x/ {print tolower($2)"\t"NR}' "$FILE" | sort > /tmp/csvaddr.tsv
              sort /tmp/funded.tsv > /tmp/f.tsv
              join -t "$(printf '\t')" /tmp/csvaddr.tsv /tmp/f.tsv > /tmp/hit.tsv 2>/dev/null || true
              echo "rows in this file that hold AEQ: $(wc -l < /tmp/hit.tsv)"
              echo "combined: $(awk -F'\t' '{s+=$3} END{printf "%.6f", s+0}' /tmp/hit.tsv) AEQ"
              echo "--- the 10 richest, as row,address,balance ---"
              sort -t "$(printf '\t')" -k3 -gr /tmp/hit.tsv | head -10 | awk -F'\t' '{print "  row "$2"  "$1"  "$3}'
            done

            echo ""
            echo "=== writing accounts-funded.csv (funded rows only, richest first) ==="
            # Rows whose address still holds AEQ, ordered by balance descending
            # so the first rows -- the ones the tool would treat as seeds -- are
            # the richest. Nothing is sent anywhere: which account is a seed is
            # a matter of which row it sits in.
            #
            # Stays on the box, exactly like accounts.csv: it carries the same
            # private keys and must never be printed, copied off, or uploaded.
            OUT=/root/contabo-loadtest/accounts-funded.csv
            awk -F, 'NF>=2 && $2 ~ /^0x/ {print tolower($2)"	"$0}' "$CSV" | sort > /tmp/csvfull.tsv
            join -t "$(printf '	')" /tmp/csvfull.tsv /tmp/f.tsv 2>/dev/null | sort -t "$(printf '	')" -k3 -gr | cut -f2 > "$OUT"
            chmod 600 "$OUT"
            echo "rows written: $(wc -l < "$OUT")"
            echo "combined balance in it: $(join -t "$(printf '	')" /tmp/csvfull.tsv /tmp/f.tsv 2>/dev/null | awk -F'	' '{s+=$3} END{printf "%.6f", s+0}') AEQ"
            echo "(addresses of the first 3 rows, no keys)"
            head -3 "$OUT" | cut -d, -f2 | sed 's/^/  /'
            echo ""
            echo "Run with accounts_csv=accounts-funded.csv and phase=warmup,run:"
            echo "the accounts already hold AEQ, so no fund phase and no transfer"
            echo "from any real account is needed. A load-test transfer moves"
            echo "0.00001 AEQ by default, so ~0.006 AEQ per account covers roughly"
            echo "600 sends each."
