name: Deploy to Contabo VPS

on:
  push:
    branches: [master, main]

jobs:
  # FIX (Monster Audit 2026-07-12, P1): deploy used to run straight off a
  # push with zero test/build gate — a red `go test`/`go vet` or a broken
  # Solidity/Hardhat build could still reach production. `deploy` now
  # `needs: test`, so a failing build blocks the SSH deploy step entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          # FIX (fresh Monster Audit 2026-07-12): appleboy/ssh-action's
          # `fingerprint` input expects the SSH SHA256 fingerprint string
          # (ssh-keygen -lf output, "SHA256:...") to check the presented
          # host key against — NOT the raw base64 public-key blob. The
          # previous value here was a raw key blob (and didn't even match
          # Contabo1's actual current host key on top of that), so this
          # field was apparently never correctly configured. Verified live:
          # `ssh-keyscan -t rsa 173.249.37.118 | ssh-keygen -lf -`.
          fingerprint: "SHA256:E10yHMjBj6zJOO9TmYMsrFmA07RfgaMtVvofuppcJV4"
          script: /root/deploy.sh
          script_stop: true
          timeout: 600s
          command_timeout: 600s
