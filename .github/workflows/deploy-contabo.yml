name: Deploy to Contabo VPS

on:
  push:
    branches: [master, main]
    # A deploy rebuilds the image and restarts the node. Nothing under
    # .github/ or in a Markdown file can change the binary, so a push that
    # touches only those must not take the chain down for a rebuild — which
    # it did, every time a diagnostic workflow was added during an incident.
    paths-ignore:
      - '.github/**'
      - '**.md'

jobs:
  # FIX (Monster Audit 2026-07-12, P1): deploy used to run straight off a
  # push with zero test/build gate — a red `go test`/`go vet` or a broken
  # Solidity/Hardhat build could still reach production. `deploy` now
  # `needs: test`, so a failing build blocks the SSH deploy step entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # FIX (2026-07-25 night — the second network-wide fork in one evening):
      # a push to main restarts ALL THREE nodes at once (Railway redeploys the
      # primary on the same push this workflow and deploy-contabo2.yml react
      # to). At 1s block time, three simultaneous restarts are a network-wide
      # partition: each node boots into dead/booting peers, the stall escape
      # valves open, each produces its own branch, and the network forks —
      # observed live twice today (18:37 and 20:00 UTC), each time requiring
      # an authoritative resync of both secondaries to recover. Staggering the
      # restarts keeps a quorum of already-converged nodes up at every moment:
      # Railway restarts the primary first; Contabo1 deploys only after the
      # primary serves traffic again; Contabo2 (its own workflow) additionally
      # waits for this workflow to finish. Fail-open after the timeout so a
      # down primary can never permanently block deploying a fix to the
      # secondaries.
      - name: Wait for the primary to be healthy again (Railway redeploys on this same push)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 https://aequitas.digital/api/status || true)
            if [ "$code" = "200" ]; then
              echo "primary healthy again (HTTP 200) — proceeding with the Contabo1 deploy"
              exit 0
            fi
            echo "primary not ready yet (HTTP $code) — waiting ($i/60)"
            sleep 15
          done
          echo "primary still unreachable after 15 min — proceeding anyway (fail-open: a broken primary must not block fixing the secondaries)"
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          # FIX (fresh Monster Audit 2026-07-12): appleboy/ssh-action's
          # `fingerprint` input expects the SSH SHA256 fingerprint string
          # (ssh-keygen -lf output, "SHA256:...") of whichever host key type
          # the SSH client actually negotiates — not the raw base64
          # public-key blob (what this used to hold). Contabo1 offers
          # ecdsa/rsa/ed25519; RSA and ed25519 were each tried and failed
          # handshake ("fingerprint mismatch"), so this is the remaining
          # ECDSA host key. Verified live:
          # `ssh-keyscan -t ecdsa 173.249.37.118 | ssh-keygen -lf -`.
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script: |
            set -uo pipefail
            # Prune BEFORE the build, not only after it.
            #
            # The post-build prune below bounds how much cache a finished deploy
            # leaves behind, but it cannot help a deploy that has no room to build
            # in the first place -- and that is the failure that actually occurred:
            # Contabo2 reached 100% (474MB free of 96GB) and the image build died
            # with "no space left on device" at the go build step, long before
            # anything downstream could reclaim a byte. Ordering the reclaim first
            # makes the deploy self-healing instead of self-blocking.
            #
            # Costs nothing when the cache is already under the cap, and the node
            # keeps running throughout either way: build cache is never a dependency
            # of a running container.
            echo "=== disk before deploy ==="
            df -h / | tail -1
            docker builder prune -af --max-used-space 10GB >/dev/null 2>&1 || docker builder prune -af >/dev/null 2>&1 || true
            /root/deploy.sh

            # FIX (2026-07-25): cap the build cache after every deploy.
            #
            # deploy.sh rebuilds the image from scratch on each dispatch, and
            # each rebuild leaves its layers in the builder cache. Nothing ever
            # removed them. Measured on Contabo2 after one night of frequent
            # deploys:
            #
            #     /dev/sda1  96G  96G  136K  100% /
            #     Build Cache  209 entries  96.07GB
            #
            # The build cache alone was the entire disk. The next deploy then
            # failed outright ("no space left on device" while copying the
            # source), and a node whose filesystem is full cannot commit to
            # Postgres or write its WAL either -- so this silently degrades the
            # very throughput path being measured, long before it announces
            # itself as a failed build.
            #
            # Safe to prune: an image's finished layers live in the image store
            # (docker images), which is untouched. The build cache is purely an
            # accelerator for the NEXT build, never a dependency of a running
            # container.
            #
            # --max-used-space, NOT --keep-storage. This step has existed since
            # 2026-07-25 and the cache still reached 91.21GB on a 96GB disk,
            # filling it to 474MB free with Postgres writing to it. The reason
            # is that modern Docker maps --keep-storage onto --reserved-space,
            # which its own help text defines as "amount of disk space ALWAYS
            # ALLOWED" -- a floor guaranteeing the cache survives, not a cap
            # bounding it. The flag that actually bounds it is --max-used-space
            # ("maximum amount of disk space allowed"). The old form ran
            # successfully on every deploy and reported a plausible-looking
            # "Total: ...", which is why it read as working for three days.
            # Single line, no backslash continuations: this file is committed
            # with CRLF, and a backslash followed by CR escapes the CR instead
            # of continuing the line -- a trap already documented in
            # diagnose-tps-ceiling-contabo2.yml after it silently mangled a
            # command there.
            if docker builder prune -af --max-used-space 10GB >/tmp/prune.out 2>/dev/null; then tail -2 /tmp/prune.out; else docker builder prune -af 2>/dev/null | tail -2 || echo "(builder prune unavailable - watch disk usage manually)"; fi
            echo "=== disk after deploy ==="
            df -h / | tail -1
          script_stop: true
          timeout: 600s
          command_timeout: 600s
