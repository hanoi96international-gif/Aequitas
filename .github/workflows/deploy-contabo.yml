name: Deploy to Contabo VPS

on:
  push:
    branches: [master, main]

jobs:
  # FIX (Monster Audit 2026-07-12, P1): deploy used to run straight off a
  # push with zero test/build gate — a red `go test`/`go vet` or a broken
  # Solidity/Hardhat build could still reach production. `deploy` now
  # `needs: test`, so a failing build blocks the SSH deploy step entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          # FIX (fresh Monster Audit 2026-07-12): this fingerprint didn't
          # match Contabo1's actual SSH host key at all (confirmed via a
          # live ssh-keyscan -t rsa 173.249.37.118 — different from the
          # first byte after the ssh-rsa prefix onward). Every single
          # "Deploy to Contabo VPS" run in this repo's history had failed
          # before reaching this check, on a missing CONTABO_SSH_KEY secret
          # (fixed alongside this), so this second, independent break was
          # never actually exercised/caught until now.
          fingerprint: ""
          script: /root/deploy.sh
          script_stop: true
          timeout: 600s
          command_timeout: 600s
