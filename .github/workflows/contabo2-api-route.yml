name: Contabo2 -- Knoten-API als Ausweichadresse der App (proof2.aequitas.digital)

# Installiert deploy/Caddyfile.proof2 im proof-caddy von Contabo2: die
# bestehenden Routen (Proof-Server, Vergleichsdienst, Coordinator) bleiben
# wortgleich, dazu kommen /api/* und /rpc auf den Knoten.
#
# Sicherung, Pruefung, Reload, Nachmessen -- und bei einem Fehler zurueck auf
# die Sicherung. Der Lauf bricht ab, bevor er etwas aendert, wenn Caddy den
# Knoten im Docker-Netz nicht erreicht.

on:
  workflow_dispatch:

# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Caddyfile auf die Box kopieren
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: alter-c2-abgeschaltet.invalid
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          source: deploy/Caddyfile.proof2
          target: /root/caddy-neu
          strip_components: 1

      - name: Pruefen, einsetzen, nachmessen
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: alter-c2-abgeschaltet.invalid
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          timeout: 600s
          command_timeout: 600s
          script: |
            set -euo pipefail
            NEU=/root/caddy-neu/Caddyfile.proof2
            ALT=/root/caddy/Caddyfile
            [ -f "$NEU" ] || { echo "FEHLER: $NEU fehlt"; exit 1; }
            docker inspect proof-caddy >/dev/null 2>&1 || { echo "FEHLER: kein proof-caddy"; exit 1; }

            echo "=== erreicht Caddy den Knoten im Docker-Netz? ==="
            docker exec proof-caddy wget -qO- --timeout=5 http://aequitas-node:8080/api/status >/dev/null 2>&1 \
              && echo "  ja: aequitas-node:8080" \
              || { echo "FEHLER: proof-caddy erreicht aequitas-node:8080 nicht -- keine Aenderung"; exit 1; }

            echo "=== Sicherung ==="
            SICHERUNG="$ALT.bak-$(date +%s)"
            cp -a "$ALT" "$SICHERUNG"
            echo "  $SICHERUNG"

            echo "=== Pruefung der neuen Datei ==="
            docker cp "$NEU" proof-caddy:/tmp/Caddyfile.neu
            docker exec proof-caddy caddy validate --config /tmp/Caddyfile.neu --adapter caddyfile 2>&1 | tail -3

            echo "=== Einsetzen + Reload ==="
            cp "$NEU" "$ALT"
            if ! docker exec proof-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -3; then
              echo "Reload fehlgeschlagen -- Sicherung zurueck"
              cp "$SICHERUNG" "$ALT"
              docker exec proof-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
              exit 1
            fi
            sleep 3

            echo "=== Nachmessen (von aussen, ueber TLS) ==="
            fehl=0
            pruef() { # url erwartet
              c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "$1" || echo 000)
              if [ "$c" = "$2" ]; then echo "  ok   $1 -> $c"; else echo "  FEHL $1 -> $c (erwartet $2)"; fehl=1; fi
            }
            pruef https://proof2.aequitas.digital/health 200
            pruef https://proof2.aequitas.digital/matching/health 200
            pruef https://proof2.aequitas.digital/coordinator/health 200
            pruef https://proof2.aequitas.digital/api/status 200
            pruef https://proof2.aequitas.digital/api/wache 200
            # Chain-ID-Wechsel (docs/CHAIN_ID_WECHSEL.md): eth_chainId muss zu
            # chain_evm_id desselben Knotens passen -- 1926 (0x786) oder, mit
            # gesetztem Stichtag chain_id_wechsel_ab, 19260930 (0x125e602).
            st=$(curl -s --max-time 20 https://proof2.aequitas.digital/api/status || true)
            evmid=$(echo "$st" | grep -o '"chain_evm_id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$' || true)
            wab=$(echo "$st" | grep -o '"chain_id_wechsel_ab"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | grep -o '[0-9]*$' || true)
            # Gegen die Uhr (Toleranz 300 s): 1926 nur ohne Stichtag oder vor
            # Stichtag + 300 s, 19260930 nur ab Stichtag - 300 s.
            jetzt=$(date +%s); tol=300; wabn=${wab:-0}
            cidhex=""
            if [ "$evmid" = "1926" ] && [ "$wabn" -eq 0 ]; then cidhex=0x786; fi
            if [ "$evmid" = "1926" ] && [ "$wabn" -gt 0 ] && [ "$jetzt" -lt $((wabn + tol)) ]; then cidhex=0x786; fi
            if [ "$evmid" = "19260930" ] && [ "$wabn" -gt 0 ] && [ "$jetzt" -ge $((wabn - tol)) ]; then cidhex=0x125e602; fi
            rc=$(curl -s --max-time 20 -X POST https://proof2.aequitas.digital/rpc -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' || true)
            if [ -n "$cidhex" ] && echo "$rc" | grep -q "\"result\":\"$cidhex\""; then echo "  ok   /rpc eth_chainId -> $cidhex (chain_evm_id $evmid)"; else echo "  FEHL /rpc -> $rc (chain_evm_id '${evmid}', chain_id_wechsel_ab '${wab}')"; fehl=1; fi
            if [ "$fehl" = 1 ]; then
              echo "Etwas antwortet nicht wie erwartet -- Sicherung zurueck"
              cp "$SICHERUNG" "$ALT"
              docker exec proof-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
              exit 1
            fi
            echo "=== fertig: proof2.aequitas.digital/api und /rpc fuehren zum Knoten ==="
