name: Patch deploy_safe_c2.sh on Contabo2 (manual, script-only, no redeploy)

# One-off fix for the root cause documented in STAGING_RUNBOOK.md's
# "Update -- Contabo2-Live-Versuch" section and SCALING_ARCHITECTURE.md's
# matching Phase-7 update: /root/deploy_safe_c2.sh (lives only on the
# server, outside this repo's version control) sources the new container's
# env exclusively from `docker inspect` of the OLD container, never from
# /root/.aequitas.env -- so enable-wal-contabo2.yml's env-file edit (and
# rollback-wal-contabo2.yml's removal of the same lines) has never had any
# effect on Contabo2, confirmed by reading the script's actual content via
# verify-wal-contabo2.yml and cross-checking against the live container's
# real process env.
#
# This workflow ONLY patches the script on disk. It does NOT call it, does
# NOT restart the container, and does NOT itself change what env the
# running node has. That happens separately, the next time
# enable-wal-contabo2.yml (or the regular deploy-contabo2.yml push-trigger)
# invokes the patched script.
#
# The new script content is delivered as a single base64 line (echo then
# base64 -d), NOT a heredoc. A first attempt used a heredoc and failed:
# appleboy/ssh-action (drone-ssh under the hood) appends its own
# `DRONE_SSH_PREV_COMMAND_EXIT_CODE=$? ; if [ ... ]; then exit ...; fi;`
# exit-status check after each line it sends over SSH, with no awareness
# that a heredoc body is one continuous quoted block -- it spliced that
# check text INSIDE the heredoc, corrupting the staged file. Caught
# harmlessly by this workflow's own bash -n gate before anything was
# installed (see run 30043789998), but heredocs are not safe to use in
# this action's `script:` field for that reason. A single base64 line has
# no embedded newlines for the injection to land in.
#
# Safety, in order:
#   1. Back up the current script with a timestamp suffix first.
#   2. Decode the new version into a *.new staging file, not directly over
#      the live script.
#   3. `bash -n` syntax-check the staging file. `set -euo pipefail` means
#      any failure here aborts before the next step -- the original,
#      untouched script stays in place (this is exactly what caught the
#      heredoc-corruption problem above without ever touching the live
#      script).
#   4. Only after that check passes: chmod +x and mv the staging file over
#      the original (atomic rename, no half-written script ever visible).
#   5. Print a diff and the final installed file so the change is visible
#      directly in this workflow's own log, no separate SSH session needed
#      to review it.
#
# The patch itself: merge /root/.aequitas.env on top of the env inherited
# from the previous container (explicit file values win on key collision),
# instead of ignoring the file entirely. Same PATH/HOSTNAME/HOME/
# RESYNC_FROM_SNAPSHOT exclusions the original script already applied to
# the inherited env now apply to the file too, for the same reason
# (RESYNC_FROM_SNAPSHOT=true is permanently present in that file on this
# box and must never reach a `docker run`, regardless of source).
#
# v2 (2026-07-23, same day): the first cut of this patch only merged the
# file ON TOP of the inherited env -- fine for enable (adds a line), but
# rollback-wal-contabo2.yml REMOVES lines from the file, and a removed
# line doesn't un-inherit anything. Confirmed live: ran the v1-patched
# enable, then rollback, and WAL was still reported active in the next
# boot log -- the OLD container (about to be replaced) still had the
# flags, so the new one silently re-inherited them regardless of the file.
# v2 excludes AEQUITAS_WAL_ENABLED/AEQUITAS_WAL_PATH/ENABLE_MULTI_BLOCK_TICK
# from the inherited-env pass entirely, same as PATH/HOSTNAME/HOME/
# RESYNC_FROM_SNAPSHOT already were -- these three now come ONLY from
# .aequitas.env on every deploy, present means on, absent means off, no
# carry-over from whatever the previous container happened to be running.
#
# v3 (2026-07-23, same day): with v2 live-verified working, WAL was
# briefly genuinely active -- and that surfaced the real remaining risk:
# the `docker run` had no volume mount, so AEQUITAS_WAL_PATH pointed
# inside the container's own writable layer, destroyed by the `docker rm`
# every deploy already does (including automatic ones on every push to
# main). Any WAL-durable-but-not-yet-Postgres-flushed transfer would be
# silently lost on the next redeploy. v3 bind-mounts a dedicated host
# directory (/root/aequitas-wal-data -> /data/wal in the container) that
# survives docker rm the same way the image does. AEQUITAS_WAL_PATH must
# point inside that mount (/data/wal/...) for this to actually help --
# enable-wal-contabo2.yml sets the default there now.
on:
  workflow_dispatch: {}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch deploy_safe_c2.sh (write + syntax-check only, no execution)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: true
          timeout: 120s
          command_timeout: 120s
          script: |
            set -euo pipefail
            TS="$(date +%s)"
            echo "=== Backing up current deploy_safe_c2.sh ==="
            cp /root/deploy_safe_c2.sh "/root/deploy_safe_c2.sh.bak.$TS"
            echo "Backup: /root/deploy_safe_c2.sh.bak.$TS"
            echo "=== Decoding patched deploy_safe_c2.sh to a staging file (not installed yet) ==="
            echo '' | base64 -d > /root/deploy_safe_c2.sh.new
            echo "=== Syntax-checking the new script BEFORE installing it ==="
            bash -n /root/deploy_safe_c2.sh.new
            echo "=== Diff vs the previous version (context only, this is expected to differ) ==="
            diff -u "/root/deploy_safe_c2.sh.bak.$TS" /root/deploy_safe_c2.sh.new || true
            echo "=== Syntax check passed -- installing ==="
            chmod +x /root/deploy_safe_c2.sh.new
            mv /root/deploy_safe_c2.sh.new /root/deploy_safe_c2.sh
            echo "=== Final installed file ==="
            cat /root/deploy_safe_c2.sh
            echo "=== Done. This step ONLY patched the script -- it did NOT call it. No redeploy or restart happened here. ==="
