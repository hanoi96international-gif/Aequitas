name: Warum loest unter Last ein Resync aus
on: {workflow_dispatch: {}}
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  schauen:
    strategy:
      max-parallel: 2
      matrix:
        box: [{name: "C1", host: "alter-c1-abgeschaltet.invalid", secret: "C1"}, {name: "C2", host: "194.163.188.71", secret: "C2"}]
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ matrix.box.host }}
          username: root
          key: ${{ matrix.box.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 300s
          command_timeout: 300s
          script: |
            set +e
            echo "##### ${{ matrix.box.name }} #####"
            echo "=== Resync-Ausloeser der letzten Stunde ==="
            docker logs --since 60m aequitas-node 2>&1 \
              | grep -iE 'RESYNC|AUTO-HEAL|divergen|self-heal|rollback|reorg' | tail -25
            echo "=== und was direkt davor stand ==="
            docker logs --since 60m aequitas-node 2>&1 \
              | grep -B 4 -iE 'starting resync|RESYNC_FROM|auto-heal.*trigger|resyncInProgress' | tail -20
            echo "=== Stillstandsmeldungen ==="
            docker logs --since 60m aequitas-node 2>&1 \
              | grep -iE 'has not produced|stalled|Hoehe steht|TOTMANN' | tail -8
