name: Konten-Vergleich C1 gegen C2 (nur lesen)
# Wenn der Divergenz-Waechter "Kontenstand weicht vom Partner ab" meldet:
# welche Konten, um wieviel, und in welche Richtung. Liest auf beiden Knoten
# chain_accounts (deploy/konten-auszug.sh) und vergleicht auf dem Runner.
# Das Log ist oeffentlich: ausgegeben wird nur eine Zusammenfassung (Zahl
# der Konten, Summen, Spannweite), keine Adressen und keine Einzelsalden.
# Die Auszuege selbst bleiben auf dem Runner und werden nicht hochgeladen.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/server-changes-quorum-nfksc7]
    paths: [.github/workflows/konten-vergleich.yml, deploy/konten-auszug.sh]
permissions:
  contents: read
concurrency:
  group: c1-knoten
  cancel-in-progress: false
jobs:
  vergleichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: deploy}
      - name: Schluessel und Host-Pruefung
        env:
          K1: ${{ secrets.CONTABO_SSH_KEY }}
          K2: ${{ secrets.CONTABO2_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K1" > ~/.ssh/c1 && printf '%s\n' "$K2" > ~/.ssh/c2 && chmod 600 ~/.ssh/c1 ~/.ssh/c2
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/k1
          ssh-keygen -lf ~/.ssh/k1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA'
          ssh-keyscan 194.163.188.71 2>/dev/null > ~/.ssh/k2
          ssh-keygen -lf ~/.ssh/k2 | awk '{print $2}' | grep -qx 'SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto'
          cat ~/.ssh/k1 ~/.ssh/k2 > ~/.ssh/known_hosts
      - name: Auszuege
        run: |
          set -eu
          for i in 1 2; do
            echo "=== Hoehen vorher ==="
            for ip in 188.172.229.121 194.163.188.71; do
              curl -s -m 10 "http://$ip:8080/api/status" | jq -c '{height}' || true
            done
            ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 'bash -s' < deploy/konten-auszug.sh > c1.txt &
            ssh -i ~/.ssh/c2 -o BatchMode=yes root@194.163.188.71 'bash -s' < deploy/konten-auszug.sh > c2.txt &
            wait
            echo "C1 $(wc -l < c1.txt) Konten, C2 $(wc -l < c2.txt) Konten"
            [ -s c1.txt ] && [ -s c2.txt ] && break
            sleep 5
          done
      - name: Vergleich
        run: |
          python3 - <<'PY'
          def lade(p):
              d = {}
              for z in open(p):
                  z = z.strip()
                  if not z:
                      continue
                  a, s, t, l, h = z.split('|')
                  d[a] = (int(s), int(t), int(l), h)
              return d
          c1, c2 = lade('c1.txt'), lade('c2.txt')
          null = (0, 0, 0, 'f')
          diff = []
          for a in sorted(set(c1) | set(c2)):
              x, y = c1.get(a, null), c2.get(a, null)
              if x != y:
                  diff.append((a, x, y))
          print(f"Konten C1 {len(c1)}, C2 {len(c2)}, verschieden {len(diff)}")
          s1 = sum(v[0] for v in c1.values()); s2 = sum(v[0] for v in c2.values())
          print(f"Geldmenge C1 {s1/1e6:.6f} AEQ, C2 {s2/1e6:.6f} AEQ, Differenz C1-C2 {(s1-s2)/1e6:.6f}")
          nur1 = sum(1 for a, x, y in diff if a not in c2); nur2 = sum(1 for a, x, y in diff if a not in c1)
          print(f"nur auf C1 {nur1}, nur auf C2 {nur2}")
          # Nur Zusammenfassung: das Log ist oeffentlich, keine Adressen oder
          # einzelnen Salden (Entscheidung des Betreibers, 26.09.2026).
          saldo = [x[0] - y[0] for a, x, y in diff if x[0] != y[0]]
          print(f"Saldo verschieden: {len(saldo)} Konten, Summe C1-C2 {sum(saldo)/1e6:.6f} AEQ, "
                f"C1 hoeher {sum(1 for d in saldo if d > 0)}, C2 hoeher {sum(1 for d in saldo if d < 0)}")
          if saldo:
              b = sorted(abs(d) for d in saldo)
              print(f"Betrag der Abweichung je Konto: min {b[0]/1e6:.6f}, median {b[len(b)//2]/1e6:.6f}, max {b[-1]/1e6:.6f} AEQ")
          for name, i in (("tusd", 1), ("lp", 2), ("mensch", 3)):
              print(f"{name} verschieden: {sum(1 for a, x, y in diff if x[i] != y[i])} Konten")
          print("Geldmenge gleich" if s1 == s2 else "GELDMENGE VERSCHIEDEN")
          PY
