name: Oeffentlichen Teil von CONTABO_SSH_KEY ausgeben
# Fuer einen neuen Server: den oeffentlichen Schluessel beim Anbieter
# hinterlegen, dann erreichen ihn die Workflows wie C1. Der oeffentliche Teil
# ist nicht geheim; der private verlaesst den Runner nicht.
on:
  workflow_dispatch:
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  ausgeben:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - name: Oeffentlichen Schluessel ableiten
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); $_ = $d if $d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/; } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > k
          echo "----- OEFFENTLICHER SCHLUESSEL (fuer netcup) -----"
          ssh-keygen -y -f k
          echo "----- ENDE -----"
          rm -f k
