name: Postgres tunen (eine Box, mit Rueckweg)

# GEMESSEN am 07.09.2026 unter Last auf C2:
#
#   aequitas-postgres   127-234 % CPU (1,3-2,3 von 6 Kernen)
#   aequitas-node       223-304 %
#   vmstat r            8-22 laufbereite Threads auf 6 Kernen
#   wa                  1-6 %  -> CPU-gebunden, NICHT I/O-gebunden
#
#   shared_buffers      128 MB bei 12 GB RAM
#   wal_compression     pglz
#   synchronous_commit  off (bereits richtig)
#
# 128 MB zwingt Postgres, Seiten staendig nachzuladen; die uebliche Groesse
# ist ein Viertel des RAM. wal_compression tauscht CPU gegen Platte -- ein
# schlechter Tausch auf einer CPU-gesaettigten Box mit 30 GB freiem Platz.
#
# Aendert NUR Laufzeitparameter, keine Daten. Der alte Wert steht im Log,
# und zurueck geht es mit demselben Workflow.

on:
  workflow_dispatch:
    inputs:
      box:
        required: true
        default: contabo2
        type: choice
        options: [contabo1, contabo2]
      shared_buffers:
        description: "z.B. 2GB. Leer = nicht anfassen."
        default: "2GB"
      wal_compression:
        description: "off spart CPU und kostet Platte. Leer = nicht anfassen."
        default: "off"
      effective_io_concurrency:
        description: "Fuer SSDs ueblich 200. Leer = nicht anfassen."
        default: "200"

jobs:
  tunen:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.box == 'contabo1' && '173.249.37.118' || '194.163.188.71' }}
          username: root
          key: ${{ inputs.box == 'contabo1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 400s
          command_timeout: 400s
          script: |
            set +e
            echo "===== VORHER ====="
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT name || ' = ' || setting FROM pg_settings
              WHERE name IN ('shared_buffers','wal_compression','effective_io_concurrency');" | sed 's/^ *//' | grep -v '^$'

            SB="${{ inputs.shared_buffers }}"
            WC="${{ inputs.wal_compression }}"
            EIO="${{ inputs.effective_io_concurrency }}"
            [ -n "$SB" ]  && docker exec aequitas-postgres psql -U postgres -c "ALTER SYSTEM SET shared_buffers = '$SB';"
            [ -n "$WC" ]  && docker exec aequitas-postgres psql -U postgres -c "ALTER SYSTEM SET wal_compression = '$WC';"
            [ -n "$EIO" ] && docker exec aequitas-postgres psql -U postgres -c "ALTER SYSTEM SET effective_io_concurrency = $EIO;"

            # wal_compression und effective_io_concurrency greifen per reload,
            # shared_buffers braucht einen Neustart der Datenbank.
            docker exec aequitas-postgres psql -U postgres -c "SELECT pg_reload_conf();" >/dev/null
            if [ -n "$SB" ]; then
              echo "-- shared_buffers braucht einen Datenbankneustart --"
              docker restart aequitas-postgres >/dev/null
              for i in $(seq 1 40); do
                docker exec aequitas-postgres pg_isready -U postgres >/dev/null 2>&1 && { echo "   Datenbank ist nach $((i*3))s wieder da"; break; }
                sleep 3
              done
            fi
            # DEN KNOTEN MIT NEU STARTEN. Ein Postgres-Neustart trifft laufende
            # Schreibvorgaenge; schlaegt einer fehl, waehrend der Speicher der
            # Platte voraus ist, geht der Knoten in den degraded-Zustand und
            # haelt die Produktion an, bis er neu startet -- ein Schutz, kein
            # Fehler, aber er endet nicht von selbst. Am 07.09.2026 passierte
            # genau das: C1 verwarf danach 13.051 Bloecke in zwoelf Minuten,
            # fiel 420 zurueck und produzierte eine Viertelstunde nichts.
            if [ -n "$SB" ]; then
              echo "-- Knoten mit neu starten (sonst bleibt er im degraded-Zustand) --"
              docker restart aequitas-node >/dev/null
              for i in $(seq 1 60); do
                ST=$(curl -s --max-time 8 http://127.0.0.1:8080/api/health/combined 2>/dev/null | grep -oE '"stalled_seconds":[0-9]+' | head -1 | cut -d: -f2)
                if [ -n "$ST" ] && [ "$ST" -le 20 ] 2>/dev/null; then echo "   Knoten wieder im Takt nach $((i*5))s"; break; fi
                sleep 5
              done
              echo "   degraded-Meldungen der letzten 2 Minuten:"
              docker logs --since 2m aequitas-node 2>&1 | grep -ac "degraded" || echo 0
            fi
            echo "===== NACHHER ====="
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT name || ' = ' || setting || COALESCE(' ' || unit,'') FROM pg_settings
              WHERE name IN ('shared_buffers','wal_compression','effective_io_concurrency');" | sed 's/^ *//' | grep -v '^$'
            echo "===== faengt sich der Knoten wieder? ====="
            for i in $(seq 1 30); do
              ST=$(curl -s --max-time 8 http://127.0.0.1:8080/api/health/combined 2>/dev/null | grep -oE '"stalled_seconds":[0-9]+' | head -1 | cut -d: -f2)
              H=$(curl -s --max-time 8 http://127.0.0.1:8080/api/status 2>/dev/null | grep -oE '"height":[0-9]+' | cut -d: -f2)
              if [ -n "$ST" ] && [ "$ST" -le 15 ] 2>/dev/null; then echo "   ok nach $((i*4))s: Hoehe $H, stalled ${ST}s"; break; fi
              [ $((i % 5)) -eq 0 ] && echo "   ... stalled=${ST:-?}s Hoehe=${H:-?}"
              sleep 4
            done
