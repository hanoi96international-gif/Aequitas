name: Neuer Server (netcup) -- vorbereiten
# Der neue Server 188.172.229.121 (netcup RS 2000) soll C1 uebernehmen.
# Anmeldung mit CONTABO_SSH_KEY: den oeffentlichen Teil hat der Betreiber bei
# netcup hinterlegt (oeffentlicher-schluessel.yml gibt ihn aus). Kein Passwort.
#
#   1. Zugang pruefen.
#   2. Box vorbereiten (deploy/server-vorbereiten.sh): Docker, Firewall,
#      Repos, Images. Es wird KEIN Knoten gestartet.
# C1 ist nicht mehr erreichbar (Wache 26.09.2026: nur ein Validator aktiv);
# die neue Box ersetzt C1 mit eigener, frischer Identitaet.
on:
  workflow_dispatch:
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 60
    env:
      NEU: 188.172.229.121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Schluessel bereitstellen
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); $_ = $d if $d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/; } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Host-Schluessel von C1 gepinnt (wie backup-ledger.yml): genau eine
          # ed25519-Zeile, und ihr Fingerabdruck muss stimmen.
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh1
          [ "$(grep -c . ~/.ssh/kh1)" = 1 ] || { echo "::error::Host-Schluessel von C1: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}')" = "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA" ] || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts

      - name: Zugang zum neuen Server pruefen
        run: |
          set -eu
          if ! ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 root@$NEU 'echo "angemeldet auf $(hostname)"'; then
            echo "::error::Anmeldung per Schluessel scheitert. Bei netcup den Schluessel 'Aequitas' hinterlegen und das Image mit diesem Schluessel neu installieren."
            exit 1
          fi

      - name: Box vorbereiten (kein Knoten wird gestartet)
        run: |
          set -eu
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@$NEU 'bash -s' < deploy/server-vorbereiten.sh
