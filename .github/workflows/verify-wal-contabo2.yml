name: Verify WAL + Multi-Block-Tick status on Contabo2 (manual, read-only)

# Read-only companion to enable-wal-contabo2.yml. Does NOT restart anything
# -- just inspects current state so a status check never itself risks a
# second unnecessary restart. Checks:
#   1. Which flags are actually in .aequitas.env right now.
#   2. A much larger log tail (2000 lines, not 200) for the [WAL]/
#      MULTI_BLOCK_TICK startup lines -- the enable run's 200-line/10s-wait
#      check may simply have run before a real, populous production DB
#      finished its slower boot sequence.
#   3. Two /api/status samples 5s apart, to confirm height is actually
#      advancing (not stalled) and to compare latest_hash-at-height against
#      what Contabo1 would report for the same height, if reachable.
#   4. A scan for the exact failure signatures found during this session's
#      local 2-node drill: state-inconsistency, block rejected, repeated
#      "queued as orphan" -- see STAGING_RUNBOOK.md's 2-node section for
#      why these specifically matter here.
#
# Finding from the previous two runs (2026-07-23, both zero [WAL] lines):
# deploy-contabo2.yml auto-redeploys on EVERY push to main (test gate, then
# the same deploy_safe_c2.sh this workflow's sibling calls), and the
# observed container StartedAt timestamps line up almost to the second with
# unrelated deploy-contabo2.yml runs completing -- NOT with anything this
# workflow or enable-wal-contabo2.yml did. deploy_safe_c2.sh's own
# documented behaviour (see deploy-contabo2.yml's comment) is to "preserve
# the currently-running container's own env" -- if that means copying env
# from the OLD container's `docker inspect` output rather than re-reading
# /root/.aequitas.env from disk, then editing the env file (what
# enable-wal-contabo2.yml does) would be silently ineffective on Contabo2
# regardless of timing, AND every unrelated push during active development
# would keep recreating the container from whatever env it last happened to
# carry. This run reads deploy_safe_c2.sh itself (read-only, no execution)
# plus restart-policy/scheduler state to confirm or rule this out with the
# actual script content instead of inference from timing alone.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Contabo2 WAL/multi-block-tick status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: true
          timeout: 120s
          command_timeout: 120s
          script: |
            set -uo pipefail
            CONTAINER="$(docker ps --format '{{.Names}}' | grep -i aequitas | head -1)"

            echo "=== .aequitas.env flags ==="
            grep -E '^(AEQUITAS_WAL_ENABLED|AEQUITAS_WAL_PATH|ENABLE_MULTI_BLOCK_TICK)=' /root/.aequitas.env || echo "(keine der drei Flags gesetzt)"

            echo "=== Container Start/Restart-Diagnose ==="
            docker inspect -f 'StartedAt={{.State.StartedAt}} RestartCount={{.RestartCount}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Status={{.State.Status}} Error={{.State.Error}}' "$CONTAINER"
            echo "--- Docker-Events der letzten 10 Minuten fuer diesen Container (Crash/Restart-Ursache) ---"
            # --until must be a concrete timestamp, not the literal "now" (that's what broke
            # this check last run) -- and it must be set at all, otherwise `docker events`
            # streams live forever and blocks this script until command_timeout kills it.
            docker events --since 10m --until "$(date -u +%s)" --filter "container=$CONTAINER" 2>&1 | tail -30 || echo "(keine Events oder docker events nicht verfuegbar)"

            echo "=== Tatsaechliche laufende Env-Variablen des Containers (WAL/TICK-relevant) ==="
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER" 2>&1 | grep -iE '^(AEQUITAS_WAL|ENABLE_MULTI_BLOCK_TICK)=' || echo "(keine der drei Flags im laufenden Container-Prozess-Env -- selbst wenn .aequitas.env sie enthaelt)"

            echo "=== deploy_safe_c2.sh selbst -- liest es .aequitas.env neu ein oder kopiert es nur den alten Container-Env? (read-only, keine Ausfuehrung) ==="
            cat /root/deploy_safe_c2.sh 2>&1 || echo "(Datei nicht lesbar oder nicht vorhanden)"

            echo "=== Restart-Policy des Containers (koennte Docker selbst zu Neustarts veranlassen) ==="
            docker inspect -f 'RestartPolicy={{.HostConfig.RestartPolicy.Name}} MaxRetries={{.HostConfig.RestartPolicy.MaximumRetryCount}}' "$CONTAINER" 2>&1

            echo "=== Cron/Systemd-Timer, die deploy_safe_c2.sh oder einen Container-Restart ausloesen koennten ==="
            crontab -l 2>&1 || echo "(keine crontab fuer root)"
            systemctl list-timers --all 2>&1 | grep -iE 'aequitas|deploy' || echo "(keine passenden systemd-Timer)"

            echo "=== WAL-Verzeichnis + Datei ==="
            ls -la /root/aequitas_transfers.wal 2>&1 || echo "(WAL-Datei existiert nicht -- falls WAL wirklich aktiv waere, muesste sie existieren)"

            echo "=== Gesamtzahl Log-Zeilen seit Container-Start ==="
            docker logs "$CONTAINER" 2>&1 | wc -l

            FULL_LOG="$(docker logs "$CONTAINER" 2>&1)"

            echo "=== ERSTE 100 Log-Zeilen seit Start (Boot-Sequenz, wo [WAL] eigentlich stehen sollte) ==="
            echo "$FULL_LOG" | head -100 || true

            echo "=== [WAL]/MULTI_BLOCK_TICK Zeilen -- KOMPLETTES Log, nicht nur tail ==="
            echo "$FULL_LOG" | grep -iE '\[WAL\]|MULTI_BLOCK_TICK' || echo "(im GESAMTEN Log seit Start keine gefunden)"

            echo "=== Warnsignale aus dem lokalen 2-Node-Drill dieser Session ==="
            echo "$FULL_LOG" | tail -2000 | grep -iE 'state-inconsistency|block rejected|queued as orphan|panic|fatal' | tail -30 || echo "(keine gefunden -- gut)"

            echo "=== /api/status, Sample 1 ==="
            curl -s http://localhost:8080/api/status
            echo ""
            sleep 5
            echo "=== /api/status, Sample 2 (5s spaeter -- height sollte um ~5 gestiegen sein) ==="
            curl -s http://localhost:8080/api/status
            echo ""

            echo "=== Letzte 40 Log-Zeilen roh, zur Einordnung ==="
            echo "$FULL_LOG" | tail -40
