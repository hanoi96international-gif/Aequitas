# Die erste echte Ausgabe eines S-Tokens (Quantengeld Variante S) auf dem
# Hauptnetz, mit IBM als Geraet der Inhaberin.
#
#   1. messen (Umgebung quantenhardware, Freigabe): hardware_ibm.py
#      --s-messen -- 1680 Qubits in BB84-Zustaenden, sofort gemessen.
#      Modus rauschen: dasselbe mit dem Rauschmodell, NUR die Messung, keine
#      Ausgabe (Probe, kostet nichts).
#   2. ausgeben (Umgebung produktion, Freigabe): deploy/quanten-s-ausgabe.sh
#      auf C1 -- `aequitasd quanten-s-ausgabe` im Knoten-Container mit dem
#      Schluessel von C1: Ausgabe (C1 ist Ausgeber und einziger Validator),
#      Bindung und Wahl der Inhaberin, Doppelvorlage an der falschen Stelle
#      (muss abgewiesen werden), ehrliche Vorlage an C1 (Wert kommt zurueck).
#
# Weg abschnitte-v2 (DEZENTRAL.md 16 Schritt 7): Stichprobe erst nach der
# Bindung (Ausweg aus Befund 5i). C1 ist einziger Validator (t = v = 1) und
# praepariert seinen einen Abschnitt aus einer Messung in seinem
# Messverzeichnis (deploy/quanten-c1-messverzeichnis.sh, beim Deploy):
#   1. messen: Basen der Inhaberin ziehen (n = 2 k, k aus der Tabelle der
#      Kette fuer t = v = 1 und die Toleranz; Zufall os.urandom ueber
#      random.SystemRandom), hardware_ibm.py --s-abschnitt
#      in genau diesen Basen, je Stelle 5 Schuesse mit Mehrheit.
#   2. ausgeben: Messung ins Messverzeichnis von C1
#      (deploy/quanten-s-ausgabe-abschnitt.sh), dann `aequitasd
#      quanten-s-ausgabe --stichprobe-v2`: Ausgabe, Bindung und Wahl,
#      Stichproben und Salze erst danach, Doppelvorlage (muss abgewiesen
#      werden), ehrliche Vorlage (Wert kommt zurueck).
# Zusaetzlich verlangt: Stichtag der Stichprobe v2 erreicht
# (quanten_w.probe_v2_ab in /api/status).
#
# Voraussetzungen: Stichtag von W/S erreicht (quanten_w.ab in /api/status),
# C1 im Validator-Register an einen Menschen gebunden, auf der Signieradresse
# von C1 mindestens die Deckung (Standard 1 AEQ).
#
# Die Messung geht als Job-Ausgabe von 1 nach 2. Sie ist in diesem Lauf kein
# Schutz des Werts: anmelden duerfen nur die zwei bei der Ausgabe
# festgelegten Stellen (C1 und ein Wegwerfschluessel, der nur im Speicher
# des Werkzeugs lebt), und der Token wird im selben Lauf eingeloest.
name: Quantengeld S -- erste Ausgabe auf dem Hauptnetz

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "ibm = echter Chip und Ausgabe auf C1; rauschen = nur Messung mit dem Rauschmodell (Probe)"
        type: choice
        options: [rauschen, ibm]
        default: rauschen
      deckung:
        description: "Deckung des Tokens in Mikro-AEQ (1000000 = 1 AEQ, hoechstens 10000000)"
        default: "1000000"
      weg:
        description: "auftrag = wie am 17.11. (ein Auftrag, Stichprobe bei der Ausgabe); abschnitte-v2 = Abschnitt des Validators, Stichprobe erst nach der Bindung (DEZENTRAL.md 16)"
        type: choice
        options: [auftrag, abschnitte-v2]
        default: auftrag
      toleranz:
        description: "nur abschnitte-v2: Toleranz in Prozent (2 -> k = 552, 3 -> 672, 4 -> 840 bei einem Validator)"
        type: choice
        options: ["2", "3", "4"]
        default: "2"

permissions:
  contents: read

concurrency:
  group: quanten-s-ausgabe
  cancel-in-progress: false

env:
  WEG: ${{ inputs.weg }}
  TOL: ${{ inputs.toleranz }}
  C1: 188.172.229.121
  C1_HOSTKEY: SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA
  NETZ: https://aequitas.digital

jobs:
  rauschen:
    if: inputs.modus == 'rauschen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Messung im Rauschmodell (Probe, keine Ausgabe)
        run: |
          set -euo pipefail
          case "$WEG" in
            auftrag) python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-messen "$RUNNER_TEMP/messung.json" ;;
            abschnitte-v2)
              case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; *) echo "::error::toleranz $TOL"; exit 1 ;; esac
              Y=$(python3 -I -c 'import random,sys; r = random.SystemRandom(); print("".join(str(r.getrandbits(1)) for _ in range(int(sys.argv[1]))))' "$((2 * K))")
              mkdir -m 700 "$RUNNER_TEMP/qs"
              python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-abschnitt "$RUNNER_TEMP/qs" --basen "$Y"
              NAME=$(printf '%s' "$Y" | sha256sum | cut -d' ' -f1)
              [ "$(ls -A "$RUNNER_TEMP/qs")" = "$NAME.json" ] || { echo "::error::Messverzeichnis: erwartet genau $NAME.json"; exit 1; }
              jq -e --arg y "$Y" '(keys | sort) == ["job","t","u","wo","x","y"] and .y == $y and (.u | length) == ($y | length) and (.t | length) == ($y | length) and (.x | length) == ($y | length)' "$RUNNER_TEMP/qs/$NAME.json" >/dev/null \
                || { echo "::error::Messung passt nicht zu den Basen"; exit 1; } ;;
            *) echo "::error::weg $WEG"; exit 1 ;;
          esac

  messen:
    if: inputs.modus == 'ibm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: quantenhardware
    outputs:
      messung: ${{ steps.lauf.outputs.messung }}
    steps:
      - name: Eingabe pruefen
        env:
          DECKUNG: ${{ inputs.deckung }}
        run: |
          set -euo pipefail
          [[ "$DECKUNG" =~ ^[1-9][0-9]{6,7}$ ]] && [ "$DECKUNG" -le 10000000 ] || { echo "::error::Deckung $DECKUNG (1000000 bis 10000000)"; exit 1; }
          [[ "$WEG" =~ ^(auftrag|abschnitte-v2)$ ]] || { echo "::error::weg $WEG"; exit 1; }
          [[ "$TOL" =~ ^[234]$ ]] || { echo "::error::toleranz $TOL"; exit 1; }
      - name: Stichtag erreicht?
        run: |
          set -euo pipefail
          AB=$(curl -fsS -m 15 "$NETZ/api/status" | jq -r '.quanten_w.ab // empty')
          [[ "$AB" =~ ^[0-9]{10}$ ]] || { echo "::error::quanten_w.ab nicht lesbar -- laeuft #568 auf C1?"; exit 1; }
          [ "$(date +%s)" -ge "$AB" ] || { echo "::error::W/S erst ab $(date -u -d @"$AB") aktiv"; exit 1; }
          # Stichprobe v2: vor jeder Messung, sonst verbraucht eine Ausgabe,
          # die die Kette abweist, den Auftrag beim Quantenrechner.
          if [ "$WEG" = abschnitte-v2 ]; then
            V2=$(curl -fsS -m 15 "$NETZ/api/status" | jq -r '.quanten_w.probe_v2_ab // empty')
            [[ "$V2" =~ ^[0-9]{10}$ ]] || { echo "::error::quanten_w.probe_v2_ab nicht lesbar -- Stichprobe v2 schlaeft auf C1"; exit 1; }
            [ "$(date +%s)" -ge "$V2" ] || { echo "::error::Stichprobe v2 erst ab $(date -u -d @"$V2") aktiv"; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Messung auf dem IBM-Chip
        id: lauf
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ vars.IBM_QUANTUM_INSTANCE }}
          IBM_QUANTUM_BACKEND: ${{ vars.IBM_QUANTUM_BACKEND }}
        run: |
          set -euo pipefail
          if [ "$WEG" = abschnitte-v2 ]; then
            # Basen der Inhaberin: n = 2 k (Tabelle der Kette, t = v = 1).
            case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; *) echo "::error::toleranz $TOL"; exit 1 ;; esac
            Y=$(python3 -I -c 'import random,sys; r = random.SystemRandom(); print("".join(str(r.getrandbits(1)) for _ in range(int(sys.argv[1]))))' "$((2 * K))")
            mkdir -m 700 "$RUNNER_TEMP/qs"
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-abschnitt "$RUNNER_TEMP/qs" --basen "$Y"
            NAME=$(printf '%s' "$Y" | sha256sum | cut -d' ' -f1)
            [ "$(ls -A "$RUNNER_TEMP/qs")" = "$NAME.json" ] || { echo "::error::Messverzeichnis: erwartet genau $NAME.json"; exit 1; }
            echo "messung=$(gzip -9c "$RUNNER_TEMP/qs/$NAME.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/qs"
          else
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-messen "$RUNNER_TEMP/messung.json"
            echo "messung=$(gzip -9c "$RUNNER_TEMP/messung.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/messung.json"
          fi

  ausgeben:
    needs: messen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: produktion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx "$C1_HOSTKEY" || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Ausgabe auf C1
        env:
          MESSUNG: ${{ needs.messen.outputs.messung }}
          DECKUNG: ${{ inputs.deckung }}
        run: |
          set -euo pipefail
          [[ "$DECKUNG" =~ ^[1-9][0-9]{6,7}$ ]] && [ "$DECKUNG" -le 10000000 ] || { echo "::error::Deckung $DECKUNG"; exit 1; }
          [[ "$WEG" =~ ^(auftrag|abschnitte-v2)$ ]] && [[ "$TOL" =~ ^[234]$ ]] || { echo "::error::weg $WEG / toleranz $TOL"; exit 1; }
          umask 077
          printf '%s' "$MESSUNG" | base64 -d | gunzip -c > "$RUNNER_TEMP/m.json"
          if [ "$WEG" = abschnitte-v2 ]; then
            case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; esac
            N=$((2 * K))
            # Genau die Felder, die der Dienst liest; Basen nur 0/1 in der Laenge n.
            jq -e --argjson n "$N" '(keys | sort) == ["job","t","u","wo","x","y"] and (.y | test("^[01]+$")) and (.y | length) == $n and (.u | length) == $n and (.t | length) == $n and (.x | length) == $n' "$RUNNER_TEMP/m.json" >/dev/null \
              || { echo "::error::Messung unvollstaendig"; exit 1; }
            NAME=$(jq -j .y "$RUNNER_TEMP/m.json" | sha256sum | cut -d' ' -f1)
            [[ "$NAME" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Name"; exit 1; }
            jq -c --argjson n "$N" '{n: $n, basen: [.y], wo: .wo, job: .job}' "$RUNNER_TEMP/m.json" > "$RUNNER_TEMP/b.json"
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-abschnitt.json' < "$RUNNER_TEMP/m.json"
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-basen.json' < "$RUNNER_TEMP/b.json"
            rm -f "$RUNNER_TEMP/m.json" "$RUNNER_TEMP/b.json"
            scp -q -o BatchMode=yes deploy/quanten-s-ausgabe-abschnitt.sh root@$C1:/root/quanten-s-ausgabe-abschnitt.sh
            set +e
            ssh -o BatchMode=yes root@$C1 "DECKUNG=$DECKUNG TOLERANZ=$TOL QS_NAME=$NAME bash /root/quanten-s-ausgabe-abschnitt.sh" > ergebnis.json
            RC=$?
            set -e
          else
            jq -e '.n == 1680 and (.x | length) == 1680' "$RUNNER_TEMP/m.json" >/dev/null || { echo "::error::Messung unvollstaendig"; exit 1; }
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-messung.json' < "$RUNNER_TEMP/m.json"
            rm -f "$RUNNER_TEMP/m.json"
            scp -q -o BatchMode=yes deploy/quanten-s-ausgabe.sh root@$C1:/root/quanten-s-ausgabe.sh
            set +e
            ssh -o BatchMode=yes root@$C1 "DECKUNG=$DECKUNG bash /root/quanten-s-ausgabe.sh" > ergebnis.json
            RC=$?
            set -e
          fi
          cat ergebnis.json
          {
            echo "## Quantengeld S: Ausgabe auf dem Hauptnetz (Weg $WEG, Toleranz $TOL %)"
            echo
            if [ "$RC" = 0 ]; then echo "**Erfolg:** Doppelvorlage abgewiesen, ehrliche Vorlage eingeloest."; else echo "**Gescheitert (Exit $RC)** -- Verlauf im Protokoll."; fi
            echo
            echo '```json'
            cat ergebnis.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
