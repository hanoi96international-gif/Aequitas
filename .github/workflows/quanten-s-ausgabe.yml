# Die erste echte Ausgabe eines S-Tokens (Quantengeld Variante S) auf dem
# Hauptnetz, mit IBM als Geraet der Inhaberin.
#
#   1. messen (Umgebung quantenhardware, Freigabe): hardware_ibm.py
#      --s-messen -- 1680 Qubits in BB84-Zustaenden, sofort gemessen.
#      Modus rauschen: dasselbe mit dem Rauschmodell, NUR die Messung, keine
#      Ausgabe (Probe, kostet nichts).
#   2. ausgeben (Umgebung produktion, Freigabe): deploy/quanten-s-ausgabe.sh
#      auf C1 -- `aequitasd quanten-s-ausgabe` im Knoten-Container mit dem
#      Schluessel von C1: Ausgabe (C1 ist Ausgeber und einziger Validator),
#      Bindung und Wahl der Inhaberin, Doppelvorlage an der falschen Stelle
#      (muss abgewiesen werden), ehrliche Vorlage an C1 (Wert kommt zurueck).
#
# Weg abschnitte-v2 (DEZENTRAL.md 16 Schritt 7): Stichprobe erst nach der
# Bindung (Ausweg aus Befund 5i). C1 ist einziger Validator (t = v = 1) und
# praepariert seinen einen Abschnitt aus einer Messung in seinem
# Messverzeichnis (deploy/quanten-c1-messverzeichnis.sh, beim Deploy):
#   1. messen: Basen der Inhaberin ziehen (n = 2 k, k aus der Tabelle der
#      Kette fuer t = v = 1 und die Toleranz; Zufall os.urandom ueber
#      random.SystemRandom), hardware_ibm.py --s-abschnitt
#      in genau diesen Basen, je Stelle 5 Schuesse mit Mehrheit.
#   2. ausgeben: Messung ins Messverzeichnis von C1
#      (deploy/quanten-s-ausgabe-abschnitt.sh), dann `aequitasd
#      quanten-s-ausgabe --stichprobe-v2`: Ausgabe, Bindung und Wahl,
#      Stichproben und Salze erst danach, Doppelvorlage (muss abgewiesen
#      werden), ehrliche Vorlage (Wert kommt zurueck).
# Zusaetzlich verlangt: Stichtag der Stichprobe v2 erreicht
# (quanten_w.probe_v2_ab in /api/status).
#
# Weg rollen (DEZENTRAL.md 17, getrennte Rollen im Hauptnetz): Die Inhaberin
# ist NICHT dieser Lauf, sondern z. B. die App (Quanten-Token, bestellen). Ihre
# Bestellung (oeffentlich: n, ihre Basen y, ihre Adresse und ihr oeffentlicher
# Schluessel, die zwei Annahmestellen) kommt als Eingabe `bestellung`.
#   1. messen: in genau ihren Basen y.
#   2. ausgeben: `aequitasd quanten-s-ausgabe --fuer-inhaberin` auf C1. Der
#      Ausgeber sieht x nie; das Ergebnis nennt K und die Validatoren-Zeile,
#      mit der die Inhaberin ihren Token abholt (nur mit K). Binden, waehlen
#      und vorlegen tut sie selbst; einloesen laesst eine Annahmestelle
#      (fuer C1: quanten-s-annahme.yml).
#
# Messung versiegelt (Wege abschnitte-v2 und rollen): Die Messung ist die
# Praeparation des Tokens. Der Mess-Job versiegelt sie mit
# forschung/quantengeld/s_versiegeln.py auf den Schluessel von C1 (aus
# /api/quanten-w/validator/schluessel, gegen die hier festgelegte Adresse
# geprueft). Durch GitHub geht nur das Chiffrat; erst der Knoten von C1
# oeffnet es (aequitasd quanten-s-messung-oeffnen) direkt ins Messverzeichnis.
#
# Voraussetzungen: Stichtag von W/S erreicht (quanten_w.ab in /api/status),
# C1 im Validator-Register an einen Menschen gebunden, auf der Signieradresse
# von C1 mindestens die Deckung (Standard 1 AEQ).
#
# Die Messung geht als Job-Ausgabe von 1 nach 2. Sie ist in diesem Lauf kein
# Schutz des Werts: anmelden duerfen nur die zwei bei der Ausgabe
# festgelegten Stellen (C1 und ein Wegwerfschluessel, der nur im Speicher
# des Werkzeugs lebt), und der Token wird im selben Lauf eingeloest.
name: Quantengeld S -- erste Ausgabe auf dem Hauptnetz

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "ibm = echter Chip und Ausgabe auf C1; rauschen = nur Messung mit dem Rauschmodell (Probe)"
        type: choice
        options: [rauschen, ibm]
        default: rauschen
      deckung:
        description: "Deckung des Tokens in Mikro-AEQ (1000000 = 1 AEQ, hoechstens 10000000)"
        default: "1000000"
      weg:
        description: "auftrag = wie am 17.11. (ein Auftrag, Stichprobe bei der Ausgabe); abschnitte-v2 = Abschnitt des Validators, Stichprobe erst nach der Bindung (DEZENTRAL.md 16); rollen = fuer eine Inhaberin mit eigener Bestellung, z. B. die App (DEZENTRAL.md 17)"
        type: choice
        options: [auftrag, abschnitte-v2, rollen]
        default: auftrag
      toleranz:
        description: "nur abschnitte-v2: Toleranz in Prozent (2 -> k = 552, 3 -> 672, 4 -> 840 bei einem Validator)"
        type: choice
        options: ["2", "3", "4"]
        default: "2"
      bestellung:
        description: "nur rollen: die Bestellung der Inhaberin als JSON (App: Quanten-Token, Bestellung kopieren). Nichts Geheimes. n muss zur Toleranz passen (2 -> 1104, 3 -> 1344, 4 -> 1680)."
        default: ""

permissions:
  contents: read

concurrency:
  group: quanten-s-ausgabe
  cancel-in-progress: false

env:
  WEG: ${{ inputs.weg }}
  TOL: ${{ inputs.toleranz }}
  BESTELLUNG: ${{ inputs.bestellung }}
  # Signier- und Validatoradresse von C1: der Schluessel, auf den die Messung
  # versiegelt wird, muss zu ihr gehoeren.
  C1_VALIDATOR: "0x3066639af1653325100c1074a9696612dbdc42dc"
  C1: 188.172.229.121
  C1_HOSTKEY: SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA
  NETZ: https://aequitas.digital

jobs:
  rauschen:
    if: inputs.modus == 'rauschen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - run: python3 -I forschung/quantengeld/s_versiegeln.py --selbsttest
      - name: Messung im Rauschmodell (Probe, keine Ausgabe)
        run: |
          set -euo pipefail
          case "$WEG" in
            auftrag) python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-messen "$RUNNER_TEMP/messung.json" ;;
            abschnitte-v2|rollen)
              case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; *) echo "::error::toleranz $TOL"; exit 1 ;; esac
              if [ "$WEG" = rollen ]; then
                # Bestellung der Inhaberin: genau diese Felder, ein Abschnitt (t = v = 1),
                # n = 2 k zur Toleranz; Adressen und Schluessel prueft das Werkzeug
                # streng (Form, Schluessel passt zur Adresse, Stellen verschieden).
                [ "${#BESTELLUNG}" -le 16384 ] || { echo "::error::Bestellung zu gross"; exit 1; }
                printf '%s' "$BESTELLUNG" > "$RUNNER_TEMP/bestellung.json"
                jq -e --argjson n "$((2 * K))" '(keys | sort) == ["basen","inhaberin","inhaberin_schluessel","n","stellen"] and .n == $n
                  and (.basen | type) == "array" and (.basen | length) == 1 and (.basen[0] | test("^[01]+$")) and (.basen[0] | length) == $n
                  and (.inhaberin | test("^0x[0-9a-fA-F]{40}$")) and (.inhaberin_schluessel | test("^(0x)?04[0-9a-fA-F]{128}$"))
                  and (.stellen | type) == "array" and (.stellen | length) == 2
                  and all(.stellen[]; (keys | sort) == ["adresse","schluessel"] and (.adresse | test("^0x[0-9a-fA-F]{40}$")) and (.schluessel | test("^(0x)?04[0-9a-fA-F]{128}$")))' \
                  "$RUNNER_TEMP/bestellung.json" >/dev/null \
                  || { echo "::error::Bestellung: Form (n = $((2 * K)) zur Toleranz $TOL %, ein Abschnitt, Adressen, Schluessel)"; exit 1; }
                Y=$(jq -r '.basen[0]' "$RUNNER_TEMP/bestellung.json")
              else
                Y=$(python3 -I -c 'import random,sys; r = random.SystemRandom(); print("".join(str(r.getrandbits(1)) for _ in range(int(sys.argv[1]))))' "$((2 * K))")
              fi
              mkdir -m 700 "$RUNNER_TEMP/qs"
              python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-abschnitt "$RUNNER_TEMP/qs" --basen "$Y"
              NAME=$(printf '%s' "$Y" | sha256sum | cut -d' ' -f1)
              [ "$(ls -A "$RUNNER_TEMP/qs")" = "$NAME.json" ] || { echo "::error::Messverzeichnis: erwartet genau $NAME.json"; exit 1; }
              jq -e --arg y "$Y" '(keys | sort) == ["job","t","u","wo","x","y"] and .y == $y and (.u | length) == ($y | length) and (.t | length) == ($y | length) and (.x | length) == ($y | length)' "$RUNNER_TEMP/qs/$NAME.json" >/dev/null \
                || { echo "::error::Messung passt nicht zu den Basen"; exit 1; }
              # Auch die Versiegelung auf C1 probieren (oeffnen kann sie nur C1).
              curl -fsS -m 15 "$NETZ/api/quanten-w/validator/schluessel" > "$RUNNER_TEMP/c1.json"
              [ "$(jq -r .validator "$RUNNER_TEMP/c1.json")" = "$C1_VALIDATOR" ] || { echo "::error::Validator-Dienst meldet eine andere Adresse als C1"; exit 1; }
              PUB=$(jq -r .schluessel "$RUNNER_TEMP/c1.json")
              python3 -I forschung/quantengeld/s_versiegeln.py --fuer "$PUB" --adresse "$C1_VALIDATOR" < "$RUNNER_TEMP/qs/$NAME.json" > "$RUNNER_TEMP/versiegelt.hex"
              grep -qxE '[0-9a-f]+' "$RUNNER_TEMP/versiegelt.hex" || { echo "::error::Versiegelung: Form"; exit 1; }
              echo "Versiegelt fuer C1: $(stat -c %s "$RUNNER_TEMP/versiegelt.hex") Hex-Zeichen (Klartext $(stat -c %s "$RUNNER_TEMP/qs/$NAME.json") Byte)" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::weg $WEG"; exit 1 ;;
          esac

  messen:
    if: inputs.modus == 'ibm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: quantenhardware
    outputs:
      messung: ${{ steps.lauf.outputs.messung }}
      wo: ${{ steps.lauf.outputs.wo }}
      job: ${{ steps.lauf.outputs.job }}
      basen: ${{ steps.lauf.outputs.basen }}
    steps:
      - name: Eingabe pruefen
        env:
          DECKUNG: ${{ inputs.deckung }}
        run: |
          set -euo pipefail
          [[ "$DECKUNG" =~ ^[1-9][0-9]{6,7}$ ]] && [ "$DECKUNG" -le 10000000 ] || { echo "::error::Deckung $DECKUNG (1000000 bis 10000000)"; exit 1; }
          [[ "$WEG" =~ ^(auftrag|abschnitte-v2|rollen)$ ]] || { echo "::error::weg $WEG"; exit 1; }
          [[ "$TOL" =~ ^[234]$ ]] || { echo "::error::toleranz $TOL"; exit 1; }
          if [ "$WEG" = rollen ]; then
            case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; esac
            # Bestellung der Inhaberin: genau diese Felder, ein Abschnitt (t = v = 1),
            # n = 2 k zur Toleranz; Adressen und Schluessel prueft das Werkzeug
            # streng (Form, Schluessel passt zur Adresse, Stellen verschieden).
            [ "${#BESTELLUNG}" -le 16384 ] || { echo "::error::Bestellung zu gross"; exit 1; }
            printf '%s' "$BESTELLUNG" > "$RUNNER_TEMP/bestellung.json"
            jq -e --argjson n "$((2 * K))" '(keys | sort) == ["basen","inhaberin","inhaberin_schluessel","n","stellen"] and .n == $n
              and (.basen | type) == "array" and (.basen | length) == 1 and (.basen[0] | test("^[01]+$")) and (.basen[0] | length) == $n
              and (.inhaberin | test("^0x[0-9a-fA-F]{40}$")) and (.inhaberin_schluessel | test("^(0x)?04[0-9a-fA-F]{128}$"))
              and (.stellen | type) == "array" and (.stellen | length) == 2
              and all(.stellen[]; (keys | sort) == ["adresse","schluessel"] and (.adresse | test("^0x[0-9a-fA-F]{40}$")) and (.schluessel | test("^(0x)?04[0-9a-fA-F]{128}$")))' \
              "$RUNNER_TEMP/bestellung.json" >/dev/null \
              || { echo "::error::Bestellung: Form (n = $((2 * K)) zur Toleranz $TOL %, ein Abschnitt, Adressen, Schluessel)"; exit 1; }
            Y=$(jq -r '.basen[0]' "$RUNNER_TEMP/bestellung.json")
          fi
      - name: Stichtag erreicht?
        run: |
          set -euo pipefail
          AB=$(curl -fsS -m 15 "$NETZ/api/status" | jq -r '.quanten_w.ab // empty')
          [[ "$AB" =~ ^[0-9]{10}$ ]] || { echo "::error::quanten_w.ab nicht lesbar -- laeuft #568 auf C1?"; exit 1; }
          [ "$(date +%s)" -ge "$AB" ] || { echo "::error::W/S erst ab $(date -u -d @"$AB") aktiv"; exit 1; }
          # Stichprobe v2: vor jeder Messung, sonst verbraucht eine Ausgabe,
          # die die Kette abweist, den Auftrag beim Quantenrechner.
          if [ "$WEG" != auftrag ]; then
            V2=$(curl -fsS -m 15 "$NETZ/api/status" | jq -r '.quanten_w.probe_v2_ab // empty')
            [[ "$V2" =~ ^[0-9]{10}$ ]] || { echo "::error::quanten_w.probe_v2_ab nicht lesbar -- Stichprobe v2 schlaeft auf C1"; exit 1; }
            [ "$(date +%s)" -ge "$V2" ] || { echo "::error::Stichprobe v2 erst ab $(date -u -d @"$V2") aktiv"; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - run: python3 -I forschung/quantengeld/s_versiegeln.py --selbsttest
      - name: Schluessel von C1 (fuer die versiegelte Messung)
        id: c1
        if: inputs.weg != 'auftrag'
        run: |
          set -euo pipefail
          curl -fsS -m 15 "$NETZ/api/quanten-w/validator/schluessel" > "$RUNNER_TEMP/c1.json"
          [ "$(jq -r .validator "$RUNNER_TEMP/c1.json")" = "$C1_VALIDATOR" ] || { echo "::error::Validator-Dienst meldet eine andere Adresse als C1"; exit 1; }
          PUB=$(jq -r .schluessel "$RUNNER_TEMP/c1.json")
          [[ "$PUB" =~ ^04[0-9a-f]{128}$ ]] || { echo "::error::Schluessel von C1: Form"; exit 1; }
          # Gehoert der Schluessel zur festgelegten Adresse (Keccak)? Sonst nicht versiegeln.
          python3 -I forschung/quantengeld/s_versiegeln.py --pruefen-schluessel "$PUB" --adresse "$C1_VALIDATOR"
          echo "pub=$PUB" >> "$GITHUB_OUTPUT"
      - name: Messung auf dem IBM-Chip
        id: lauf
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ vars.IBM_QUANTUM_INSTANCE }}
          IBM_QUANTUM_BACKEND: ${{ vars.IBM_QUANTUM_BACKEND }}
          C1_PUB: ${{ steps.c1.outputs.pub }}
        run: |
          set -euo pipefail
          if [ "$WEG" != auftrag ]; then
            # Basen der Inhaberin: n = 2 k (Tabelle der Kette, t = v = 1).
            case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; *) echo "::error::toleranz $TOL"; exit 1 ;; esac
            if [ "$WEG" = rollen ]; then
              # Bestellung der Inhaberin: genau diese Felder, ein Abschnitt (t = v = 1),
              # n = 2 k zur Toleranz; Adressen und Schluessel prueft das Werkzeug
              # streng (Form, Schluessel passt zur Adresse, Stellen verschieden).
              [ "${#BESTELLUNG}" -le 16384 ] || { echo "::error::Bestellung zu gross"; exit 1; }
              printf '%s' "$BESTELLUNG" > "$RUNNER_TEMP/bestellung.json"
              jq -e --argjson n "$((2 * K))" '(keys | sort) == ["basen","inhaberin","inhaberin_schluessel","n","stellen"] and .n == $n
                and (.basen | type) == "array" and (.basen | length) == 1 and (.basen[0] | test("^[01]+$")) and (.basen[0] | length) == $n
                and (.inhaberin | test("^0x[0-9a-fA-F]{40}$")) and (.inhaberin_schluessel | test("^(0x)?04[0-9a-fA-F]{128}$"))
                and (.stellen | type) == "array" and (.stellen | length) == 2
                and all(.stellen[]; (keys | sort) == ["adresse","schluessel"] and (.adresse | test("^0x[0-9a-fA-F]{40}$")) and (.schluessel | test("^(0x)?04[0-9a-fA-F]{128}$")))' \
                "$RUNNER_TEMP/bestellung.json" >/dev/null \
                || { echo "::error::Bestellung: Form (n = $((2 * K)) zur Toleranz $TOL %, ein Abschnitt, Adressen, Schluessel)"; exit 1; }
              Y=$(jq -r '.basen[0]' "$RUNNER_TEMP/bestellung.json")
            else
              Y=$(python3 -I -c 'import random,sys; r = random.SystemRandom(); print("".join(str(r.getrandbits(1)) for _ in range(int(sys.argv[1]))))' "$((2 * K))")
            fi
            mkdir -m 700 "$RUNNER_TEMP/qs"
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-abschnitt "$RUNNER_TEMP/qs" --basen "$Y"
            NAME=$(printf '%s' "$Y" | sha256sum | cut -d' ' -f1)
            [ "$(ls -A "$RUNNER_TEMP/qs")" = "$NAME.json" ] || { echo "::error::Messverzeichnis: erwartet genau $NAME.json"; exit 1; }
            # Nur das Chiffrat verlaesst diesen Job; wo und job sind oeffentlich
            # (stehen auch in der Ausgabe auf der Kette).
            umask 077
            python3 -I forschung/quantengeld/s_versiegeln.py --fuer "$C1_PUB" --adresse "$C1_VALIDATOR" < "$RUNNER_TEMP/qs/$NAME.json" > "$RUNNER_TEMP/versiegelt.hex"
            {
              echo "wo=$(jq -r .wo "$RUNNER_TEMP/qs/$NAME.json" | tr -cd '[:alnum:] ._,:/()+-' | head -c 200)"
              echo "job=$(jq -r .job "$RUNNER_TEMP/qs/$NAME.json" | tr -cd '[:alnum:]._,:-' | head -c 200)"
              echo "basen=$Y"
            } >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/qs"
            echo "messung=$(gzip -9c "$RUNNER_TEMP/versiegelt.hex" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/versiegelt.hex"
          else
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-messen "$RUNNER_TEMP/messung.json"
            echo "messung=$(gzip -9c "$RUNNER_TEMP/messung.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/messung.json"
          fi

  ausgeben:
    needs: messen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: produktion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx "$C1_HOSTKEY" || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Ausgabe auf C1
        env:
          MESSUNG: ${{ needs.messen.outputs.messung }}
          MESS_WO: ${{ needs.messen.outputs.wo }}
          MESS_JOB: ${{ needs.messen.outputs.job }}
          MESS_BASEN: ${{ needs.messen.outputs.basen }}
          DECKUNG: ${{ inputs.deckung }}
        run: |
          set -euo pipefail
          [[ "$DECKUNG" =~ ^[1-9][0-9]{6,7}$ ]] && [ "$DECKUNG" -le 10000000 ] || { echo "::error::Deckung $DECKUNG"; exit 1; }
          [[ "$WEG" =~ ^(auftrag|abschnitte-v2|rollen)$ ]] && [[ "$TOL" =~ ^[234]$ ]] || { echo "::error::weg $WEG / toleranz $TOL"; exit 1; }
          umask 077
          if [ "$WEG" != auftrag ]; then
            case "$TOL" in 2) K=552 ;; 3) K=672 ;; 4) K=840 ;; esac
            N=$((2 * K))
            # Versiegelt: nur Hex; oeffnen und streng pruefen tut der Knoten von C1.
            printf '%s' "$MESSUNG" | base64 -d | gunzip -c > "$RUNNER_TEMP/m.versiegelt"
            [ "$(stat -c %s "$RUNNER_TEMP/m.versiegelt")" -le 2101248 ] && grep -qxE '[0-9a-f]+' "$RUNNER_TEMP/m.versiegelt" \
              || { echo "::error::versiegelte Messung: Form"; exit 1; }
            if [ "$WEG" = rollen ]; then
              # Bestellung der Inhaberin: genau diese Felder, ein Abschnitt (t = v = 1),
              # n = 2 k zur Toleranz; Adressen und Schluessel prueft das Werkzeug
              # streng (Form, Schluessel passt zur Adresse, Stellen verschieden).
              [ "${#BESTELLUNG}" -le 16384 ] || { echo "::error::Bestellung zu gross"; exit 1; }
              printf '%s' "$BESTELLUNG" > "$RUNNER_TEMP/bestellung.json"
              jq -e --argjson n "$((2 * K))" '(keys | sort) == ["basen","inhaberin","inhaberin_schluessel","n","stellen"] and .n == $n
                and (.basen | type) == "array" and (.basen | length) == 1 and (.basen[0] | test("^[01]+$")) and (.basen[0] | length) == $n
                and (.inhaberin | test("^0x[0-9a-fA-F]{40}$")) and (.inhaberin_schluessel | test("^(0x)?04[0-9a-fA-F]{128}$"))
                and (.stellen | type) == "array" and (.stellen | length) == 2
                and all(.stellen[]; (keys | sort) == ["adresse","schluessel"] and (.adresse | test("^0x[0-9a-fA-F]{40}$")) and (.schluessel | test("^(0x)?04[0-9a-fA-F]{128}$")))' \
                "$RUNNER_TEMP/bestellung.json" >/dev/null \
                || { echo "::error::Bestellung: Form (n = $((2 * K)) zur Toleranz $TOL %, ein Abschnitt, Adressen, Schluessel)"; exit 1; }
              Y=$(jq -r '.basen[0]' "$RUNNER_TEMP/bestellung.json")
              ROLLEN=ja
              cp "$RUNNER_TEMP/bestellung.json" "$RUNNER_TEMP/b.json"
            else
              Y="$MESS_BASEN"
              ROLLEN=nein
              jq -nc --argjson n "$N" --arg y "$Y" --arg wo "$MESS_WO" --arg job "$MESS_JOB" '{n: $n, basen: [$y], wo: $wo, job: $job}' > "$RUNNER_TEMP/b.json"
            fi
            [[ "$Y" =~ ^[01]+$ ]] && [ "${#Y}" -eq "$N" ] || { echo "::error::Basen: $N Bits"; exit 1; }
            NAME=$(printf '%s' "$Y" | sha256sum | cut -d' ' -f1)
            [[ "$NAME" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Name"; exit 1; }
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-abschnitt.versiegelt' < "$RUNNER_TEMP/m.versiegelt"
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-basen.json' < "$RUNNER_TEMP/b.json"
            rm -f "$RUNNER_TEMP/m.versiegelt" "$RUNNER_TEMP/b.json"
            scp -q -o BatchMode=yes deploy/quanten-s-ausgabe-abschnitt.sh root@$C1:/root/quanten-s-ausgabe-abschnitt.sh
            set +e
            ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$C1 "DECKUNG=$DECKUNG TOLERANZ=$TOL QS_N=$N QS_NAME=$NAME QS_ROLLEN=$ROLLEN bash /root/quanten-s-ausgabe-abschnitt.sh" > ausgabe-roh.txt
            RC=$?
            set -e
          else
            jq -e '.n == 1680 and (.x | length) == 1680' "$RUNNER_TEMP/m.json" >/dev/null || { echo "::error::Messung unvollstaendig"; exit 1; }
            ssh -o BatchMode=yes root@$C1 'umask 077; cat > /root/qs-messung.json' < "$RUNNER_TEMP/m.json"
            rm -f "$RUNNER_TEMP/m.json"
            scp -q -o BatchMode=yes deploy/quanten-s-ausgabe.sh root@$C1:/root/quanten-s-ausgabe.sh
            set +e
            ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$C1 "DECKUNG=$DECKUNG bash /root/quanten-s-ausgabe.sh" > ausgabe-roh.txt
            RC=$?
            set -e
          fi
          # Das Ergebnis ist das JSON-Objekt ab der Zeile "{". Zeilen davor
          # (Hinweise beim Start des Werkzeugs) gehoeren nach stderr; stehen doch
          # welche auf stdout, nennt sie das Protokoll, statt dass jq am Ergebnis
          # scheitert (21.11.2026, Lauf 44904131085: "[RPC] ..." vor dem JSON).
          awk 'f || /^\{$/ {f = 1; print}' ausgabe-roh.txt > ergebnis.json
          if [ -s ergebnis.json ] && ! cmp -s ausgabe-roh.txt ergebnis.json; then
            echo "::warning::Zeilen vor dem Ergebnis (nicht Teil des JSON):"
            awk '/^\{$/ {exit} {print}' ausgabe-roh.txt
          fi
          if [ "$WEG" = rollen ]; then
            # Das Paket ist oeffentlich (x nur fuer die Inhaberin verschluesselt),
            # aber gross; die Zusammenfassung nennt, was die Inhaberin braucht.
            {
              echo "## Quantengeld S: Ausgabe fuer eine Inhaberin (getrennte Rollen, Toleranz $TOL %)"
              echo
              if [ "$RC" = 0 ] && jq -e '.k | test("^[0-9a-f]{64}$")' ergebnis.json >/dev/null 2>&1; then
                echo "**Ausgegeben.** Abholen in der App (Quanten-Token, Abholen) mit (genau so eintragen):"
                echo
                echo "- K: \`$(jq -r .k ergebnis.json)\`"
                echo "- Validatoren: \`$(jq -r --arg api "$NETZ" '[.validatoren[] | . + "=" + $api + "/api"] | join(",")' ergebnis.json)\`"
                echo
                echo "Inhaberin \`$(jq -r .inhaberin ergebnis.json)\`, Stellen \`$(jq -r '.stellen | join(", ")' ergebnis.json)\`, n = $(jq -r .n ergebnis.json), Deckung $(jq -r .deckung_mikro ergebnis.json) Mikro-AEQ."
                echo "Einloesen an C1 als Annahmestelle: quanten-s-annahme.yml mit der Vorlage aus der App."
              else
                echo "**Gescheitert (Exit $RC)** -- Verlauf im Protokoll."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            jq -c '{k, n, inhaberin, stellen, validatoren, deckung_mikro, probe_art}' ergebnis.json 2>/dev/null || true
            exit "$RC"
          fi
          cat ausgabe-roh.txt
          {
            echo "## Quantengeld S: Ausgabe auf dem Hauptnetz (Weg $WEG, Toleranz $TOL %)"
            echo
            if [ "$RC" = 0 ] || [ "$RC" = 3 ]; then echo "**Erfolg:** Doppelvorlage abgewiesen, ehrliche Vorlage eingeloest."; else echo "**Gescheitert (Exit $RC)** -- Verlauf im Protokoll."; fi
            if [ "$RC" = 3 ]; then
              echo
              echo "**Nachweis nach dem Ende nicht bestaetigt:** $(jq -r '.nachweis_fehler // "?"' ergebnis.json)"
            elif jq -e '.nachweis.wurzel_gegen == "kette"' ergebnis.json >/dev/null 2>&1; then
              echo
              echo "**Nachweis nach dem Ende** (DEZENTRAL.md 17 R7): Die offengelegte Praeparation ergibt die Wurzel und die Proben der Ausgabe."
              echo "Ueber alle $(jq -r .nachweis.n ergebnis.json) Stellen $(jq -r .nachweis.fehler ergebnis.json) Fehler bei $(jq -r .nachweis.treffer ergebnis.json) Treffern (passende Basis);"
              echo "an der gewaehlten Stelle $(jq -r .nachweis.fehler_stelle ergebnis.json) bei $(jq -r .nachweis.treffer_stelle ergebnis.json). Roh: Artefakt nachweis-$(jq -r .k ergebnis.json)."
              echo "Das zeigt, dass genau diese Praeparation bei der Ausgabe festgelegt war -- nicht, dass ein Quantenrechner gemessen hat."
            fi
            echo
            echo '```json'
            cat ergebnis.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
      - name: Nachweis holen (oeffentlich)
        if: success() && inputs.weg == 'abschnitte-v2'
        run: |
          set -euo pipefail
          K=$(jq -r .k ergebnis.json)
          [[ "$K" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::K"; exit 1; }
          mkdir -p nachweis
          curl -fsS -m 30 --max-filesize 16777216 "$NETZ/api/quanten-w/validator/nachweis?k=$K" > "nachweis/nachweis-$K-c1.json"
          jq -e --arg k "$K" '.k == $k and .validator == env.C1_VALIDATOR' "nachweis/nachweis-$K-c1.json" >/dev/null
          cp ergebnis.json "nachweis/ergebnis-$K.json"
          echo "K=$K" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.weg == 'abschnitte-v2'
        with:
          name: nachweis-${{ env.K }}
          path: nachweis/
          retention-days: 90
