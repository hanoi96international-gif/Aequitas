name: Neuer Server (netcup) -- Validator starten
# Startet den Validator auf 188.172.229.121 (Ersatz fuer C1, der offline
# ist). Betreiber-Wallet wie bei C1. Schluessel erzeugt die Box selbst; sie
# erscheinen nie in diesem (oeffentlichen) Log. Siehe deploy/server-starten.sh.
on:
  workflow_dispatch:
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  starten:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 30
    env:
      NEU: 188.172.229.121
      WALLET: "0x0be8b961cbf6564bd1931b0803d35c0659e0d016"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel bereitstellen
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Host-Schluessel von C1 gepinnt (wie backup-ledger.yml): genau eine
          # ed25519-Zeile, und ihr Fingerabdruck muss stimmen.
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh1
          [ "$(grep -c . ~/.ssh/kh1)" = 1 ] || { echo "::error::Host-Schluessel von C1: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}')" = "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA" ] || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Warten, bis das Knoten-Image gebaut ist
        run: |
          set -eu
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=yes -o BatchMode=yes root@$NEU 'docker image inspect aequitas-node:local >/dev/null 2>&1'; then
              echo "Image da"; exit 0
            fi
            sleep 20
          done
          echo "::error::Image aequitas-node:local fehlt nach 20 min"; exit 1
      - name: Validator starten
        run: |
          set -eu
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@$NEU "bash -s -- $WALLET" < deploy/server-starten.sh
