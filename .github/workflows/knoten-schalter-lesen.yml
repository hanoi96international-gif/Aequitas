name: Knoten-Schalter lesen (Leistung, nur lesend)

# Welche Leistungsschalter stehen auf welchem Knoten WIRKLICH -- im laufenden
# Container, nicht in einer Datei oder einem alten Kommentar?
#
# Anlass (23.09.2026): align-c2-perf-flags.yml sagt, ENABLE_MULTI_BLOCK_TICK
# stehe auf beiden Knoten auf 0; spaetere Notizen sagen, C2 fahre ihn mit 1.
# Seit dem Annahme-Tor traegt nur C1 Transaktionen in Bloecke -- ein Schalter,
# der Blockkapazitaet schafft, gehoert dann auf C1, und ob er dort steht,
# entscheidet ueber die Obergrenze (10.000 je Block, 1 s Takt).
#
# Seit dem 24.09.2026 auch die NETZ-Einstellungen (Seeds, eigene URL,
# Validator-ADRESSEN, Proof-Server-URLs): alles oeffentliche Adressen, die
# ohnehin in /api/status bzw. im Explorer stehen -- nie Schluessel.
#
# NUR EINE FESTE LISTE. Das Repository ist oeffentlich, jeder Lauf ist fuer
# jeden lesbar. Gezeigt werden ausschliesslich die unten genannten Namen, deren
# Werte Zahlen oder Schalter sind; alles andere -- Schluessel, Tokens,
# Datenbank-URLs -- wird nie gelesen. Ein neuer Name gehoert erst in die Liste,
# wenn sicher ist, dass sein Wert kein Geheimnis ist.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/knoten-schalter-lesen.yml"

permissions:
  contents: read

jobs:
  lesen:
    strategy:
      fail-fast: false
      matrix:
        box:
          - { name: Contabo1, host: "173.249.37.118", secret: C1 }
          - { name: Contabo2, host: "194.163.188.71", secret: C2 }
    runs-on: ubuntu-latest
    steps:
      - name: ${{ matrix.box.name }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.box.host }}
          username: root
          key: ${{ matrix.box.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 60s
          command_timeout: 60s
          script: |
            LISTE='^(BLOCK_TIME_MS|ENABLE_MULTI_BLOCK_TICK|AEQUITAS_MAX_TXS_PER_BLOCK|AEQUITAS_WAL_ENABLED|AEQUITAS_RPC_RATE_LIMIT_MAX|AEQUITAS_RPC_RATE_LIMIT_FREI|ANNAHME_ROLLE|AEQUITAS_EIGENLAST_BREMSE|AEQUITAS_VORLADEN|AEQUITAS_COMPRESS_BLOCK_PAYLOAD|AEQUITAS_PRODUCE_WHEN_BACKLOG_SHRINKING|AEQUITAS_PEER_LAG_[A-Z_]+|AEQUITAS_INFLIGHT_[A-Z_]+|AEQUITAS_RPC_BATCH_PARALLEL|AEQUITAS_RPC_QUIET_TX|AEQUITAS_TRANSFER_BATCH_[A-Z_]+|AEQUITAS_PARALLEL_[A-Z_]+|AEQUITAS_DB_MAX_[A-Z_]+|GOMAXPROCS|GOMEMLIMIT|GOGC|PRIMARY_NODE_URLS?|SELF_URL|AUTHORIZED_VALIDATORS|VALIDATOR_LABELS|P2P_BOOTSTRAP[A-Z_]*|STATIC_PEERS|PROOF_SERVER_URLS|IS_PRIMARY_NODE|AUTO_HEAL_ON_DIVERGENCE|AEQUITAS_DIVERGENZ_AUTORESYNC)='
            echo "=== laufender Container: Leistungsschalter (feste Liste) ==="
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -E "$LISTE" | sort || echo "(keiner gesetzt -- alle auf Vorgabe)"
            echo "=== Container ==="
            docker inspect aequitas-node --format 'Start={{.State.StartedAt}} Neustarts={{.RestartCount}} Neustartregel={{.HostConfig.RestartPolicy.Name}} CPUs={{.HostConfig.NanoCpus}} Speicher={{.HostConfig.Memory}}'
            # Kommt alles nach einem Neustart der Box von selbst wieder hoch?
            # (Anlass: C1 war am 24.09.2026 stundenlang ganz weg.)
            echo "docker beim Booten: $(systemctl is-enabled docker 2>/dev/null)"
            docker ps -a --format '{{.Names}} {{.Status}}' | head -12
            for c in $(docker ps -aq); do docker inspect "$c" --format '{{.Name}} Neustartregel={{.HostConfig.RestartPolicy.Name}}'; done | head -12
            echo "Box laeuft seit: $(uptime -s)"
            last -x reboot shutdown 2>/dev/null | head -4
            echo "=== Maschine ==="
            echo "Kerne: $(nproc)"; free -m | head -2; uptime
