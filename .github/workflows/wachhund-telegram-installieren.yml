name: Wachhund (Telegram und/oder ntfy) auf C1 einrichten

# Ein Cron auf jeder Box (alle 5 Minuten) liest /api/wache lokal und beim
# Partner und schickt eine Nachricht, wenn es rot wird -- ohne GitHub-Cron
# (der feuert nur alle paar Stunden; gemessen am 22./23.09.: 22:07, 00:30,
# 05:08, 09:58, 14:53) und ohne Konto bei einem Monitoring-Dienst. Beim
# Umschlagen sofort, danach alle 6 Stunden, und einmal, wenn es wieder gruen
# ist.
#
# ZWEI KANAELE, EINER GENUEGT:
#
# ntfy (seit 23.09.2026) -- kein Konto, kein Token, kein Bot:
#   1. ntfy-App installieren (Android/iOS) oder https://ntfy.sh im Browser.
#   2. Einen Kanalnamen abonnieren, den nur du kennst (lang und zufaellig).
#   3. Diesen Workflow mit genau diesem Namen als ntfy_kanal starten.
#   Bis dahin hing der ganze Alarm an Telegram, und niemand hatte es
#   eingerichtet -- der Wachhund lag fertig auf dem Tisch und bellte nie.
#
# Telegram (wie bisher):
#   1. In Telegram @BotFather oeffnen, /newbot, Namen vergeben -> Token.
#   2. Dem Bot eine Nachricht schicken, dann
#      https://api.telegram.org/bot<TOKEN>/getUpdates aufrufen -> "chat":{"id":...}.
#   3. Beide als Repository-Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
#
# DER KANALNAME IST EIN KLEINES GEHEIMNIS, UND DIESES REPO IST OEFFENTLICH.
# Wer ihn kennt, kann mitlesen (das ist harmlos: /api/wache ist ohnehin
# oeffentlich) und falsche Alarme schicken (das ist laestig). Er wird deshalb
# nicht als ${{ inputs.* }} in einen Schritt geschrieben -- GitHub druckt
# Schritt-Umgebungen und ausgewertete Skripte ins Log --, sondern zur Laufzeit
# aus der Ereignisdatei gelesen und sofort maskiert. Ob GitHub die
# Eingabewerte auf der Seite des Laufs anzeigt, liegt nicht in unserer Hand;
# im Zweifel: neuen Namen abonnieren und diesen Workflow erneut starten.
#
# Alles liegt danach in /root/wachhund/env (Modus 600) auf beiden Boxen.

on:
  workflow_dispatch:
    inputs:
      test:
        description: "true = am Ende eine Testnachricht schicken"
        required: false
        default: "true"
      ntfy_kanal:
        description: "ntfy-Kanalname (den du in der ntfy-App abonniert hast). Leer = nur Telegram."
        required: false
        default: ""

# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    environment: produktion
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Neuer C1 (netcup, Primary seit 26.09.2026); die alte Contabo1
          # (173.249.37.118) ist abgeschaltet.
          - name: c1
            host: 188.172.229.121
            # Kein Partner, solange C1 der einzige Knoten ist (C2 seit
            # 03.10.2026 abgeschaltet, IP neu vergeben).
            partner: ""
            secret: C1
            fingerprint: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/wachhund-einrichten.sh
          sparse-checkout-cone-mode: false

      - name: Welche Kanaele?
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Aus der Ereignisdatei, nicht als Eingabe-Ausdruck -- siehe Kopf.
          N=$(jq -r '.inputs.ntfy_kanal // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          if [ -n "$N" ]; then
            echo "::add-mask::$N"
            case "$N" in
              *[!A-Za-z0-9_-]*) echo "::error::ntfy-Kanalname nur aus Buchstaben, Ziffern, - und _"; exit 1 ;;
            esac
            if [ ${#N} -lt 16 ]; then
              echo "::error::ntfy-Kanalname zu kurz (< 16 Zeichen) -- jeder koennte ihn erraten und falsche Alarme schicken"; exit 1
            fi
            echo "NTFY_KANAL=$N" >> "$GITHUB_ENV"
            echo "ntfy: gesetzt (Name maskiert)"
          else
            echo "ntfy: nicht gesetzt"
          fi
          if [ -n "$T" ] && [ -n "$C" ]; then echo "Telegram: gesetzt"; else echo "Telegram: nicht gesetzt"; fi
          if [ -z "$N" ] && { [ -z "$T" ] || [ -z "$C" ]; }; then
            echo "::error title=Kein Kanal::Weder ntfy_kanal angegeben noch TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID gesetzt (siehe Kopf dieser Datei)."
            exit 1
          fi

      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fingerprint }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Wie backup-ledger.yml (F1, #382): nur ed25519, genau eine Zeile --
          # sonst landen ungepruefte Schluessel anderer Typen in known_hosts.
          ssh-keyscan -t ed25519 "$HOST" 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh_all
          [ "$(grep -c . ~/.ssh/kh_all)" = 1 ] || { echo "::error::Host-Schluessel von $HOST: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh_all | awk '{print $2}')" = "$FP" ] || { echo "::error::Host-Schluessel von $HOST passt nicht"; exit 1; }
          cp ~/.ssh/kh_all ~/.ssh/known_hosts

      - name: Wachhund einrichten
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTNER: ${{ matrix.partner }}
          BOXNAME: ${{ matrix.name }}
          TESTEN: ${{ inputs.test }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Werte als export-Zeilen vor dem Skript ueber stdin -- nicht auf die
          # Befehlszeile der Box, wo ps sie zeigen wuerde.
          {
            for v in TOKEN CHAT NTFY_KANAL PARTNER BOXNAME TESTEN; do
              printf 'export %s=%q\n' "$v" "${!v:-}"
            done
            cat deploy/wachhund-einrichten.sh
          } | ssh -o BatchMode=yes root@${{ matrix.host }} 'bash -s'
