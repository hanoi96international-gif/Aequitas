name: Generate more load-test accounts (append-only, moves no AEQ)

# WHY MORE ACCOUNTS. Throughput here is pairs divided by per-transfer latency,
# and the pair count is the multiplier we lack:
#
#   623 funded rows = 311 pairs
#   ~77ms per transfer
#   311 / 0.077 = ~4,000/s expected, 3,356-3,779/s measured
#
# Two large latency reductions landed today -- the batch nonce reservation
# (19.6ms) and the blocking precheck (25ms) -- and throughput barely moved. It
# is not latency-bound any more. At this latency, 10,000 TPS needs roughly 930
# pairs, so ~1,900 funded accounts.
#
# APPEND-ONLY, DELIBERATELY. loadtest-prepare-contabo2.yml REGENERATES
# accounts.csv, which would strand the AEQ currently held by the existing rows
# behind keys no longer in the file. This only adds new rows, after backing the
# file up, so every existing funded account stays exactly where it is.
#
# This moves no AEQ. It generates keypairs and appends them. Funding is a
# separate, explicitly confirmed step (loadtest-widen-senders.yml).
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many NEW accounts to append"
        required: false
        default: "800"

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Append accounts on Contabo2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 900s
          command_timeout: 900s
          envs: COUNT
          script: |
            set +e
            cd /root/contabo-loadtest || { echo "no loadtest directory"; exit 1; }
            [ -f accounts.csv ] || { echo "accounts.csv missing"; exit 1; }

            STAMP=$(date +%Y%m%d-%H%M%S)
            cp accounts.csv "accounts.csv.bak.$STAMP"
            BEFORE=$(grep -c '^[0-9]*,0[xX]' accounts.csv)
            echo "=== before: $BEFORE real account rows (backup accounts.csv.bak.$STAMP) ==="

            echo "=== generating $COUNT new keypairs ==="
            docker run --rm --network host -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine \
              go run ./gen_accounts.go "$COUNT" > /tmp/new.csv 2>/tmp/gen.err
            if [ ! -s /tmp/new.csv ]; then
              echo "generation produced nothing:"; tail -20 /tmp/gen.err; exit 1
            fi

            # Keep only real rows: gen_accounts.go emits a header line, and a
            # header appended into the middle of the file would be handed to the
            # fund phase as an account whose address is the literal string
            # "address".
            grep -E '^[0-9]+,0[xX][0-9a-fA-F]{40},' /tmp/new.csv > /tmp/new_rows.csv
            NEW=$(wc -l < /tmp/new_rows.csv)
            echo "generated $NEW usable rows"
            if [ "$NEW" -lt 1 ]; then echo "nothing usable generated"; exit 1; fi

            # Append, then renumber the index column across the whole file so it
            # stays consistent. The header, if present, is preserved as line 1.
            HEADER=""
            head -1 accounts.csv | grep -qE '^[0-9]+,0[xX]' || HEADER=$(head -1 accounts.csv)
            {
              [ -n "$HEADER" ] && echo "$HEADER"
              grep -E '^[0-9]+,0[xX][0-9a-fA-F]{40},' accounts.csv
              cat /tmp/new_rows.csv
            } | awk -F, -v OFS=, -v hdr="$HEADER" 'NR==1 && hdr!="" {print; next} {$1=(hdr==""?NR-1:NR-2); print}' > /tmp/merged.csv

            AFTER=$(grep -c '^[0-9]*,0[xX]' /tmp/merged.csv)
            echo "=== after: $AFTER real account rows ==="
            if [ "$AFTER" -le "$BEFORE" ]; then
              echo "merge did not grow the file — refusing to replace it"; exit 1
            fi

            # Every original address must survive: losing one strands its AEQ.
            cut -d, -f2 accounts.csv | grep -iE '^0x' | sort > /tmp/old_addrs.txt
            cut -d, -f2 /tmp/merged.csv | grep -iE '^0x' | sort > /tmp/new_addrs.txt
            MISSING=$(comm -23 /tmp/old_addrs.txt /tmp/new_addrs.txt | wc -l)
            if [ "$MISSING" -ne 0 ]; then
              echo "$MISSING original address(es) missing from the merged file — refusing to replace it"
              exit 1
            fi
            echo "all $BEFORE original addresses preserved"

            mv /tmp/merged.csv accounts.csv
            echo ""
            echo "=== done. accounts.csv now holds $AFTER accounts (~$((AFTER / 2)) pairs once funded) ==="
            echo "Next: loadtest-widen-senders.yml with confirm=true to fund them,"
            echo "then loadtest-find-funded.yml to rebuild accounts-funded.csv."
        env:
          COUNT: ${{ inputs.count }}
