name: Lage C1 (netcup) -- Rolle, Dienste, Quorum (nur lesend)
# Vor dem Umschalten: welche Box nimmt an (ANNAHME_ROLLE), welche Dienste
# laufen wo, steht das Bezeugungs-Quorum? Gibt nur Namen aus festen Listen
# aus (deploy/lage-lesen.sh) -- das Log ist oeffentlich.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c1:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    env:
      NEU: 188.172.229.121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # Host-Schluessel von C1 gepinnt (wie backup-ledger.yml): genau eine
          # ed25519-Zeile, und ihr Fingerabdruck muss stimmen.
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh1
          [ "$(grep -c . ~/.ssh/kh1)" = 1 ] || { echo "::error::Host-Schluessel von C1: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}')" = "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA" ] || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: C1 lesen
        run: ssh -o StrictHostKeyChecking=yes -o BatchMode=yes root@$NEU 'bash -s' < deploy/lage-lesen.sh
  aussen:
    runs-on: ubuntu-latest
    steps:
      - name: Oeffentliche Endpunkte
        run: |
          for u in https://aequitas.digital/api/status https://proof1.aequitas.digital/coordinator/health https://proof1.aequitas.digital/matching/health; do
            echo "== $u"; curl -s -m 10 -w '  [HTTP %{http_code}]' "$u" | head -c 1500; echo
          done
          echo "== DNS"; for h in aequitas.digital proof1.aequitas.digital; do echo "$h -> $(dig +short $h | tr '\n' ' ')"; done
          # Welche App liefert die Seite aus? /download/app.apk leitet auf ein
          # Release weiter (api.go handleAppDownload, AEQUITAS_APK_URL).
          echo "== /download/app.apk"; curl -sI -m 15 https://aequitas.digital/download/app.apk | grep -iE '^HTTP|^location' || echo "  keine Antwort"
