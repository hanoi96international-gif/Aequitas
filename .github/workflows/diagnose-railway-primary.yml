name: Diagnose the Railway-hosted primary (manual, read-only)

# Read-only companion to diagnose-primary-from-contabo.yml. That one asks
# Contabo1 what the primary reports about ITSELF over HTTP, which is enough
# for "is it producing" but says nothing about the layer underneath: whether
# Railway restarted it, crash-looped it, or is holding a failed deployment.
# This one asks Railway directly.
#
# TOKEN TYPES (why both env vars are set below): Railway distinguishes two
# kinds of token BY ENVIRONMENT VARIABLE NAME, and picking the wrong one
# fails with a bare "Unauthorized" that looks identical to an invalid token:
#   RAILWAY_TOKEN     -- a PROJECT token, scoped to a single environment.
#                        `railway whoami` is not valid for this type.
#   RAILWAY_API_TOKEN -- an ACCOUNT or TEAM token; this is what whoami/list
#                        require.
# The first run of this workflow set only RAILWAY_TOKEN and every subcommand
# came back Unauthorized. Setting both from the same secret makes the probe
# work whichever type was created; the CLI ignores the name that does not
# apply.
#
# Every command is a read (whoami/list/status/logs). No deploys, no
# restarts, no variable changes, no redeploys. A missing secret exits 0 with
# an explanation -- this is a diagnostic tool, not a gate.
on:
  workflow_dispatch:
    inputs:
      log_lines:
        description: "How many recent deploy-log lines to fetch"
        required: false
        default: "200"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Railway for the primary's service + deployment state
        env:
          RAILWAY_TOKEN: ${{ secrets.Railway }}
          RAILWAY_API_TOKEN: ${{ secrets.Railway }}
          LOG_LINES: ${{ inputs.log_lines }}
        run: |
          set -uo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "No Railway token found in the repository secret 'Railway'."
            echo "Add it under: repo Settings -> Secrets and variables -> Actions."
            echo "(Exiting 0: this is a diagnostic, not a required check.)"
            exit 0
          fi

          echo "=== installing railway CLI ==="
          npm install -g @railway/cli >/dev/null 2>&1 || {
            echo "(railway CLI install failed)"; exit 0; }
          railway --version || true

          ok=0

          echo ""
          echo "=== whoami (valid for ACCOUNT/TEAM tokens; expected to fail for a PROJECT token) ==="
          if railway whoami 2>&1 | head -5; then ok=$((ok+1)); fi

          echo ""
          echo "=== projects visible to this token ==="
          if railway list 2>&1 | head -40; then ok=$((ok+1)); fi

          echo ""
          echo "=== service status ==="
          if railway status 2>&1 | head -40; then ok=$((ok+1)); fi

          echo ""
          echo "=== recent deployment logs (last $LOG_LINES lines) ==="
          timeout 60 railway logs --deployment 2>&1 | tail -n "$LOG_LINES" \
            || echo "(logs unavailable)"

          echo ""
          if [ "$ok" -eq 0 ]; then
            echo "RESULT: every subcommand failed. The secret is set but Railway rejects it."
            echo "  -> Create a token at railway.app -> Account Settings -> Tokens,"
            echo "     then update the repository secret 'Railway' with that value."
          else
            echo "RESULT: $ok subcommand(s) authenticated successfully."
          fi
