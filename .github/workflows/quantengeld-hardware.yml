# Quantengeld auf Quanten-Hardware (forschung/quantengeld/hardware.py,
# hardware_ibm.py): Note praegen, mit Variante B pruefen, Faelschungen
# dagegen -- in Spielzeuggroesse (Zyklus N = 8, 6-9 Qubits).
#
#   rauschen: Rauschmodell einer echten IBM-Maschine (kein Geheimnis,
#             keine Freigabe).
#   ibm:      echter Quantenrechner bei IBM. Laeuft in der Umgebung
#             `quantenhardware` (Freigabe noetig); dort liegt das Secret
#             IBM_QUANTUM_TOKEN, optional die Variablen IBM_QUANTUM_INSTANCE
#             und IBM_QUANTUM_BACKEND. Kostet Rechenzeit des IBM-Kontos.
#   quantinuum-pruefen / quantinuum-emulator / quantinuum:
#             IONENFALLE bei Quantinuum ueber Nexus (hardware_quantinuum.py):
#             Syntaxpruefung (H2-1SC, kostenlos), Emulator (H2-1E) oder die
#             Maschine (Variable QUANTINUUM_DEVICE, Standard H2-1). Umgebung
#             `quantenhardware` mit dem Secret QUANTINUUM_TOKEN (Refresh-Token
#             aus Nexus) oder QUANTINUUM_EMAIL + QUANTINUUM_PASSWORT. warten_reihe gilt hier in MILLISEKUNDEN (Ionen halten
#             Sekunden). Kostendeckel je Schaltkreis: Variable
#             QUANTINUUM_HQC_JE_KREIS (Standard 50).
#
# Abhaengigkeiten fest mit Hashes (hardware-anforderungen.txt). Nur lesende
# Rechte, kein Schreibzugriff auf das Repo, kein Server.
name: Quantengeld auf Quanten-Hardware

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "rauschen = Rauschmodell, ibm = IBM-Chip, quantinuum-* = Ionenfalle (pruefen kostenlos, emulator, Maschine)"
        type: choice
        options: [rauschen, ibm, quantinuum-pruefen, quantinuum-emulator, quantinuum]
        default: rauschen
      rauschmodell:
        description: "Rauschmodell (nur Modus rauschen)"
        type: choice
        options: [FakeFez, FakeTorino, FakeMarrakesh, FakeKingston]
        default: FakeFez
      laeufe:
        description: "Schaltkreise je Fall (1-64)"
        default: "8"
      schuesse:
        description: "Schuesse je Schaltkreis (1-4000)"
        default: "1000"
      unterdrueckung:
        description: "nur ibm: Fehlerunterdrueckung (dynamische Entkopplung, Pauli-Twirling)"
        type: boolean
        default: false
      dynamisch:
        description: "Praegen mit halbklassischer QFT (Messen mitten im Lauf, weniger 2-Qubit-Gatter)"
        type: boolean
        default: true
      warten_reihe:
        description: "Speicherzeit messen: IBM in Mikrosekunden (0,20,50,100), Quantinuum in Millisekunden (0,10,100,1000); leer = normaler Lauf"
        default: ""
      bezahlen:
        description: "Bezahlen: Note per Teleportation uebertragen und beim Empfaenger pruefen"
        type: boolean
        default: false
      schutz:
        description: "Speicher mit Fehlerkorrektur: ungeschuetzte Note gegen 3-Qubit-Code je Wartezeit (aus/phase/bit/beide)"
        type: choice
        options: [aus, phase, bit, beide]
        default: aus

permissions:
  contents: read

concurrency:
  group: quantengeld-hardware
  cancel-in-progress: false

jobs:
  rauschen:
    if: inputs.modus == 'rauschen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware.py --selbsttest
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Lauf
        env:
          MODELL: ${{ inputs.rauschmodell }}
          LAEUFE: ${{ inputs.laeufe }}
          SCHUESSE: ${{ inputs.schuesse }}
          DYNAMISCH: ${{ inputs.dynamisch }}
          WARTEN: ${{ inputs.warten_reihe }}
          BEZAHLEN: ${{ inputs.bezahlen }}
          SCHUTZ: ${{ inputs.schutz }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$DYNAMISCH" = "true" ]; then extra+=(--dynamisch); fi
          if [ -n "$WARTEN" ]; then extra+=(--warten-reihe "$WARTEN"); fi
          if [ "$BEZAHLEN" = "true" ]; then extra+=(--bezahlen); fi
          case "$SCHUTZ" in aus) ;; phase|bit|beide) extra+=(--geschuetzt "$SCHUTZ") ;; *) echo "schutz: $SCHUTZ unbekannt"; exit 1 ;; esac
          python3 -I forschung/quantengeld/hardware_ibm.py --rauschen "$MODELL" --laeufe "$LAEUFE" --schuesse "$SCHUESSE" "${extra[@]}" --json ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quantengeld-rauschen
          path: ergebnis.json

  ibm:
    if: inputs.modus == 'ibm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: quantenhardware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware.py --selbsttest
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Lauf auf echter Hardware
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ vars.IBM_QUANTUM_INSTANCE }}
          IBM_QUANTUM_BACKEND: ${{ vars.IBM_QUANTUM_BACKEND }}
          LAEUFE: ${{ inputs.laeufe }}
          SCHUESSE: ${{ inputs.schuesse }}
          UNTERDRUECKUNG: ${{ inputs.unterdrueckung }}
          DYNAMISCH: ${{ inputs.dynamisch }}
          WARTEN: ${{ inputs.warten_reihe }}
          BEZAHLEN: ${{ inputs.bezahlen }}
          SCHUTZ: ${{ inputs.schutz }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$UNTERDRUECKUNG" = "true" ]; then extra+=(--unterdrueckung); fi
          if [ "$DYNAMISCH" = "true" ]; then extra+=(--dynamisch); fi
          if [ -n "$WARTEN" ]; then extra+=(--warten-reihe "$WARTEN"); fi
          if [ "$BEZAHLEN" = "true" ]; then extra+=(--bezahlen); fi
          case "$SCHUTZ" in aus) ;; phase|bit|beide) extra+=(--geschuetzt "$SCHUTZ") ;; *) echo "schutz: $SCHUTZ unbekannt"; exit 1 ;; esac
          python3 -I forschung/quantengeld/hardware_ibm.py --ibm --laeufe "$LAEUFE" --schuesse "$SCHUESSE" "${extra[@]}" --json ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quantengeld-ibm
          path: ergebnis.json

  quantinuum:
    if: startsWith(inputs.modus, 'quantinuum')
    runs-on: ubuntu-latest
    timeout-minutes: 400
    environment: quantenhardware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/quantinuum-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware.py --selbsttest
      - run: python3 -I forschung/quantengeld/hardware_quantinuum.py --selbsttest
      - name: Lauf auf der Ionenfalle
        env:
          QUANTINUUM_TOKEN: ${{ secrets.QUANTINUUM_TOKEN }}
          QUANTINUUM_EMAIL: ${{ secrets.QUANTINUUM_EMAIL }}
          QUANTINUUM_PASSWORT: ${{ secrets.QUANTINUUM_PASSWORT }}
          QUANTINUUM_DEVICE: ${{ vars.QUANTINUUM_DEVICE }}
          QUANTINUUM_HQC_JE_KREIS: ${{ vars.QUANTINUUM_HQC_JE_KREIS }}
          MODUS: ${{ inputs.modus }}
          LAEUFE: ${{ inputs.laeufe }}
          SCHUESSE: ${{ inputs.schuesse }}
          WARTEN: ${{ inputs.warten_reihe }}
          SCHUTZ: ${{ inputs.schutz }}
        run: |
          set -euo pipefail
          case "$MODUS" in
            quantinuum-pruefen) geraet=H2-1SC ;;
            quantinuum-emulator) geraet=H2-1E ;;
            quantinuum) geraet="${QUANTINUUM_DEVICE:-H2-1}" ;;
            *) echo "modus: $MODUS unbekannt"; exit 1 ;;
          esac
          extra=()
          if [ -n "$WARTEN" ]; then extra+=(--warten-ms "$WARTEN"); fi
          case "$SCHUTZ" in aus) ;; phase|bit|beide) extra+=(--geschuetzt "$SCHUTZ") ;; *) echo "schutz: $SCHUTZ unbekannt"; exit 1 ;; esac
          python3 -I forschung/quantengeld/hardware_quantinuum.py --nexus "$geraet" --laeufe "$LAEUFE" --schuesse "$SCHUESSE" \
            --hqc-je-kreis "${QUANTINUUM_HQC_JE_KREIS:-50}" "${extra[@]}" --json ergebnis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quantengeld-quantinuum
          path: ergebnis.json
