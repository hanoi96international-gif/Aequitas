name: TPS C1 -- Generator auf C2, Ziel C1 (Primary), bewegt Test-AEQ
# C2 ist nur_lesend und nimmt keine Ueberweisung an; C1 ist der einzige
# annehmende Knoten. Die Testkonten (accounts*.csv, Wegwerf-Schluessel)
# liegen seit August auf C2 -- der Generator laeuft deshalb dort und
# schickt an C1s oeffentliche RPC (Ratenbegrenzung 1000/10 s je IP bei
# Batch 100 = bis 10.000 tx/s je Generator-IP). Nur Phase "run": es wird
# nichts neu finanziert, nur zwischen Testkonten ueberwiesen.
# Den Durchsatz zaehlt C1 selbst ([RPC] ⚡) -- gelesen im zweiten Schritt.
on:
  workflow_dispatch:
    inputs:
      duration: {description: "Messfenster", required: false, default: "30s"}
      accounts_csv: {description: "Kontenliste auf C2", required: false, default: "accounts-funded.csv"}
      pairs: {description: "Sender-Paare (0 = alle)", required: false, default: "0"}
      topology: {description: "pairs (je Paar ein Absender) oder ring (jedes Konto sendet, doppelt so viele Absender)", required: false, default: "pairs"}
      batch: {description: "Ueberweisungen je Buendel (1..100). Ein Buendel eines Absenders laeuft im Knoten nacheinander.", required: false, default: "20"}
  # Nur noch von Hand: ein Push dieser Datei darf keine Last auf C1 starten
  # (26.09.2026, Kontenabweichung in Untersuchung).
permissions:
  contents: read
concurrency:
  group: c1-knoten
  cancel-in-progress: false
jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      ACCOUNTS_CSV: ${{ inputs.accounts_csv || 'accounts-funded.csv' }}
      PAIRS: ${{ inputs.pairs || '0' }}
      BATCH: ${{ inputs.batch || '20' }}
      TOPOLOGY: ${{ inputs.topology || 'pairs' }}
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          K1: ${{ secrets.CONTABO_SSH_KEY }}
          K2: ${{ secrets.CONTABO2_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$K1" > ~/.ssh/c1 && printf '%s\n' "$K2" > ~/.ssh/c2 && chmod 600 ~/.ssh/c1 ~/.ssh/c2
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/k1
          ssh-keygen -lf ~/.ssh/k1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA'
          ssh-keyscan 194.163.188.71 2>/dev/null > ~/.ssh/k2
          ssh-keygen -lf ~/.ssh/k2 | awk '{print $2}' | grep -qx 'SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto'
          cat ~/.ssh/k1 ~/.ssh/k2 > ~/.ssh/known_hosts
      - name: Werkzeug auf C2
        run: |
          scp -i ~/.ssh/c2 -o BatchMode=yes tools/contabo-loadtest/main.go tools/contabo-loadtest/gen_accounts.go go.mod go.sum root@194.163.188.71:/root/contabo-loadtest/
      - name: Startzeit und Stand C1
        run: |
          echo "START=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
          curl -s -m 10 https://aequitas.digital/api/status | jq -c '{height, uptime}'
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 \
            "curl -s -m 10 http://127.0.0.1:8080/api/health/combined | jq -c .produktion_phasen" > /tmp/phasen_vorher.json || true
      - name: Rueckstau-Messer (jede Sekunde, waehrend der Last)
        run: |
          nohup bash -c 'while true; do
            ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 \
              "curl -s -m 2 http://127.0.0.1:8080/api/health/combined | jq -c \"{r: .rueckstau.aktuell, g: .rueckstau.grenze}\"" 2>/dev/null
            sleep 1; done' > /tmp/rueckstau.log 2>&1 &
          echo $! > /tmp/rueckstau.pid
      - name: Last von C2 auf C1
        run: |
          ssh -i ~/.ssh/c2 -o BatchMode=yes root@194.163.188.71 \
            "DURATION='$DURATION' ACCOUNTS_CSV='$ACCOUNTS_CSV' PAIRS='$PAIRS' BATCH='$BATCH' TOPOLOGY='$TOPOLOGY' bash -s" <<'SKRIPT'
          set -euo pipefail
          cd /root/contabo-loadtest
          rm -rf ./tools
          [ -f "$ACCOUNTS_CSV" ] || ACCOUNTS_CSV=accounts.csv
          echo "Konten: $ACCOUNTS_CSV ($(($(wc -l < "$ACCOUNTS_CSV") - 1)) Zeilen)"
          mkdir -p /root/go-mod-cache
          docker run --rm -v "$(pwd)":/w -w /w -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine go build -o loadtest main.go
          docker run --rm --network host -v "$(pwd)":/w -w /w golang:1.24-alpine \
            ./loadtest -accounts "$ACCOUNTS_CSV" \
              -rpc http://188.172.229.121:8080/rpc \
              -status http://188.172.229.121:8080/api/status \
              -phase run -duration "$DURATION" -ramp 5 \
              -transfer-amount-wei 10000000000000 -batch-size "$BATCH" -http-timeout 30s -pairs "$PAIRS" -topology "$TOPOLOGY"
          SKRIPT
      - name: Was C1 gezaehlt hat
        if: always()
        run: |
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 "START='$START' bash -s" <<'SKRIPT'
          echo "--- angewandte Ueberweisungen je Sekunde (C1) ---"
          docker logs --since "$START" aequitas-node 2>&1 | grep -F '[RPC] ⚡' | tail -30 || true
          echo "--- langsamste Ticks ---"
          docker logs --since "$START" aequitas-node 2>&1 | grep -F '[BLOCK] ⏱' | tail -8 || true
          echo "--- Warnungen ---"
          docker logs --since "$START" aequitas-node 2>&1 | grep -E 'panic|FATAL|ivergen' | tail -10 || true
          echo "--- Last auf C1 ---"
          uptime
          echo "--- Bremse und Deckel (C1) ---"
          curl -s -m 10 http://127.0.0.1:8080/api/health/combined \
            | jq -c '{peer_lag_bremse, block_tx_deckel, signierte_ueberweisungen, inflight, rueckstau: (.rueckstau|{aktuell,grenze,abgelehnt}), produktion: (.produktion|{bloecke,tx_je_block,groesster_block})}' 2>/dev/null | head -c 4000 || true
          SKRIPT
      - name: Rueckstau waehrend der Last und Blockbau-Phasen im Messfenster
        if: always()
        run: |
          kill "$(cat /tmp/rueckstau.pid)" 2>/dev/null || true
          echo "--- Rueckstau (angenommen, noch in keinem Block), je Sekunde ---"
          jq -s -c 'map(select(.r != null)) | {proben: length, max: (map(.r)|max), mittel: ((map(.r)|add) / (length|if .==0 then 1 else . end) | floor), grenze: (.[0].g // null)}' /tmp/rueckstau.log || cat /tmp/rueckstau.log | tail -5
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 \
            "curl -s -m 10 http://127.0.0.1:8080/api/health/combined | jq -c .produktion_phasen" > /tmp/phasen_nachher.json || true
          echo "--- Annahmeweg (seit Knotenstart, gemittelt) ---"
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 \
            "curl -s -m 10 http://127.0.0.1:8080/api/health/combined | jq -c '{rpc_phases, atomic_phasen, transfer_path, wal_flush, wal_writer, batcher_phasen, transfer_batch}'" 2>/dev/null | sed -E 's/0x[0-9a-fA-F]{40}/0x…/g' | head -c 6000 || true
          echo
          echo "--- Blockbau je Block, nur Bloecke im Messfenster (ms) ---"
          jq -n -c --slurpfile a /tmp/phasen_vorher.json --slurpfile b /tmp/phasen_nachher.json '
            ($a[0] // {bloecke:0}) as $v | $b[0] as $n | ($n.bloecke - ($v.bloecke // 0)) as $d
            | if $d <= 0 then {bloecke: 0} else
              ([ "gesamt_ms","laden_ms","sperren_ms","db_paar_ms","bauen_ms","speichern_ms","verteilen_ms","rest_ms" ]
               | map({key: ., value: ((($n[.] * $n.bloecke) - (($v[.] // 0) * ($v.bloecke // 0))) / $d | . * 10 | round / 10)}) | from_entries)
              + {bloecke: $d, schlimmster_ms: $n.schlimmster_ms, schlimmster_tx: $n.schlimmster_tx} end' || true
      - name: Warum kein Block (C1) und haelt C2 beim Nachspielen mit
        if: always()
        run: |
          echo "--- C1: Takte ohne Block, nach Grund (seit Knotenstart) ---"
          ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 \
            "curl -s -m 10 http://127.0.0.1:8080/api/health/combined | jq -c '{produktions_ausfaelle, exclusive_lock, fallback_gruende, signierte_ueberweisungen, rueckstau: (.rueckstau|{aktuell,grenze,abgelehnt})}'" | head -c 4000 || true
          echo
          echo "--- C2: Nachspielen (replay_phasen, replay_schlimmster) ---"
          ssh -i ~/.ssh/c2 -o BatchMode=yes root@194.163.188.71 \
            "curl -s -m 10 http://127.0.0.1:8080/api/health/combined | jq -c '{replay_phasen, replay_schlimmster}'" | head -c 3000 || true
          echo
      - name: C2 folgt?
        if: always()
        run: |
          a=$(curl -s -m 10 https://aequitas.digital/api/status | jq -r .height)
          b=$(curl -s -m 10 https://proof2.aequitas.digital/api/status | jq -r .height)
          echo "C1 $a  C2 $b  Abstand $((a-b))"
