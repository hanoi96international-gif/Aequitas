name: Authoritative resync of Contabo2 only from the trusted primary (manual)

# Same mechanism as resync-both-contabos.yml's contabo2 job (see that
# workflow's own header comment for the full rationale), split out standalone
# so it can be dispatched without touching Contabo1, which may be mid
# recovery/rebuild at the same time -- avoids two workflows racing docker
# operations on the same host.
#
# Contabo2's /root/.aequitas.env already permanently has
# RESYNC_FROM_SNAPSHOT=true (by design -- deploy_safe_c2.sh normally strips
# it from the running container). This bypasses that strip for one restart
# only by passing --env-file straight through, reusing the current image
# (no rebuild).
#
# "FOR ONE RESTART ONLY" musste dieser Workflow bis zum 22.09.2026 erst noch
# einloesen: er reichte den Schluessel durch und liess ihn danach im Container
# stehen. Mit `--restart unless-stopped` heisst das, dass jeder Absturz und
# jeder Reboot den Zustand erneut verworfen haette. Der Lauf endet deshalb
# jetzt mit einem zweiten Neustart ohne den Schluessel -- und haengt dabei
# dieselben Mounts ein wie der gewoehnliche Deploy, statt MPC und APK
# abzuwerfen.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type \"true\" to actually resync Contabo2"
        required: false
        default: "false"

jobs:
  contabo2:
    runs-on: ubuntu-latest
    steps:
      - name: Resync Contabo2 from the trusted primary
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false  # set -e steht im Skript; script_stop:true haengt hinter JEDE Zeile eine Exit-Pruefung -- auch in Heredocs und hinter else/case (Beleg: wachhund-telegram-installieren.yml, 23.09.2026)
          timeout: 900s
          command_timeout: 900s
          envs: CONFIRM
          script: |
            set -euo pipefail
            if [ "${CONFIRM:-false}" != "true" ]; then
              echo "confirm != true -- doing nothing. Re-run with confirm=true to actually resync Contabo2."
              exit 0
            fi
            echo "=== Contabo2: .aequitas.env RESYNC_FROM_SNAPSHOT (expected true, permanently, by design) ==="
            grep -E '^RESYNC_FROM_SNAPSHOT=' /root/.aequitas.env || echo "(not present -- aborting)"
            if ! grep -qE '^RESYNC_FROM_SNAPSHOT=true$' /root/.aequitas.env; then
              echo "✗ Expected RESYNC_FROM_SNAPSHOT=true already in the file -- aborting rather than guessing."
              exit 1
            fi
            IMG="$(docker inspect aequitas-node --format '{{.Config.Image}}')"
            # DIE MOUNTS GEHOEREN HIER VOLLSTAENDIG HIN. Hier stand nur die WAL.
            # Am 22.09.2026 hat dieser Neustart damit den MPC-Ordner und die
            # lokal ausgelieferte APK abgeworfen -- beide fehlten dem Knoten
            # danach still, bis ein gewoehnlicher Deploy sie zurueckbrachte. Ein
            # Wiederherstellungs-Workflow, der beim Wiederherstellen etwas
            # wegnimmt, ist ein zweiter Vorfall.
            # if/then, NICHT `[ -x ] && ...`: unter set -e liefert eine solche
            # Liste 1, wenn der Test falsch ist -- der Lauf waere dann
            # ausgerechnet dort gestorben, wo eine Box den MPC-Ordner nicht hat.
            MOUNTS="-v /root/aequitas-wal-data:/data/wal"
            if [ -d /root/aequitas-mpc ]; then
              MOUNTS="$MOUNTS -v /root/aequitas-mpc:/data/mpc"
            fi
            if [ -f /root/aequitas-downloads/aequitas-app.apk ]; then
              MOUNTS="$MOUNTS -v /root/aequitas-downloads/aequitas-app.apk:/app/downloads/aequitas-app.apk"
            fi
            echo "=== Contabo2: current image (reused, no rebuild): $IMG ==="
            echo "=== Contabo2: Mounts fuer diesen Lauf: $MOUNTS ==="
            echo "=== Contabo2: one-off restart with --env-file passed straight through ==="
            docker stop aequitas-node 2>&1 || true
            docker rm aequitas-node 2>&1 || true
            mkdir -p /root/aequitas-wal-data
            docker run -d --name aequitas-node \
              --network aequitas-net \
              --restart unless-stopped \
              $MOUNTS \
              --env-file /root/.aequitas.env \
              -p 8080:8080 -p 4001:4001 \
              "$IMG"
            echo "=== Contabo2: waiting 15s for the node to finish booting ==="
            sleep 15
            echo "=== Contabo2: boot log lines mentioning RESYNC/BOOTSTRAP/AUTO-HEAL/DAG merge ==="
            # Ohne das "|| echo" beendet ein LEERES grep-Ergebnis den ganzen
            # Schritt: grep gibt bei null Treffern 1 zurueck. Genau so meldete
            # sich dieser Workflow am 22.09. als "failure", obwohl der Knoten
            # sauber hochkam -- er starb VOR der Statusausgabe, also vor dem
            # einzigen Teil, der zeigt, ob der Resync etwas gebracht hat.
            # (Damals lief er noch mit script_stop:true, das hinter JEDE Zeile
            # eine Exit-Pruefung haengt; seit 23.09. ist es aus, und set -e
            # oben traegt den Abbruch -- auch das else weiter unten waere
            # sonst im Erfolgsfall mit 1 ausgestiegen.)
            docker logs aequitas-node 2>&1 | grep -iE '\[RESYNC\]|\[BOOTSTRAP\]|\[AUTO-HEAL\]|Merged.*tips|orphan' | tail -60 || echo "(keine solchen Zeilen im Bootlog)"
            echo "=== Contabo2: /api/status after resync ==="
            curl -s http://localhost:8080/api/status || true
            echo ""

            # DEN SCHARFSCHALTER WIEDER AUS DEM LAUFENDEN CONTAINER NEHMEN.
            #
            # Oben wird --env-file absichtlich durchgereicht, damit dieser eine
            # Neustart RESYNC_FROM_SNAPSHOT=true sieht. Danach steckt der
            # Schluessel aber IM CONTAINER -- und `--restart unless-stopped`
            # heisst: jeder Absturz, jeder Reboot wirft den Zustand erneut weg
            # und liest ihn neu ein. Das ist die Dauerschleife aus dem Kopf von
            # fix-resync-from-snapshot-flag.yml, diesmal von der
            # Wiederherstellung selbst erzeugt. Am 22.09. blieb der Container
            # genau so zurueck und musste von Hand geradegezogen werden.
            #
            # Also: einmal ohne den Schluessel neu starten. Kein Neubau,
            # dieselbe Abbildung, dieselben Mounts -- nur die Umgebung
            # gefiltert. Die Datei behaelt ihr `true` und bleibt fuer den
            # naechsten Lauf scharf.
            echo "=== Contabo2: Scharfschalter aus dem laufenden Container nehmen ==="
            mkdir -p /root/resync
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
              | grep -vE '^(RESYNC_FROM_SNAPSHOT|HOSTNAME|PATH|HOME)=' > /root/resync/env
            docker stop aequitas-node 2>&1 || true
            docker rm aequitas-node 2>&1 || true
            docker run -d --name aequitas-node \
              --network aequitas-net \
              --restart unless-stopped \
              $MOUNTS \
              --env-file /root/resync/env \
              -p 8080:8080 -p 4001:4001 \
              "$IMG"
            sleep 20
            echo "--- steht der Schluessel noch im Prozess? (erwartet: nein) ---"
            if docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qE '^RESYNC_FROM_SNAPSHOT='; then
              echo "⚠ STEHT NOCH DRIN -- jeder Neustart wuerde den Zustand verwerfen"
            else
              echo "✓ nicht mehr im Prozess"
            fi
            echo "--- und die Rolle? ---"
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E '^ANNAHME_ROLLE=' || echo "(nicht gesetzt -- dieser Knoten nimmt Ueberweisungen an)"
            echo "=== Contabo2: /api/status final ==="
            curl -s http://localhost:8080/api/status || true
            echo ""
        env:
          CONFIRM: ${{ inputs.confirm }}
