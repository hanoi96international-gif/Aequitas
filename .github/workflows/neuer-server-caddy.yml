name: Neuer Server (netcup) -- aequitas.digital ausliefern
# Startet Caddy mit Zertifikat fuer aequitas.digital auf 188.172.229.121,
# sobald der Knoten dort gleichauf ist (deploy/caddy-neuer-server.sh).
on:
  workflow_dispatch:
  push:
    branches: [claude/aequitas-weitermachen-i6yayi]
    paths:
      - .github/workflows/neuer-server-caddy.yml
      - deploy/caddy-neuer-server.sh
      - deploy/Caddyfile.neuer-server
jobs:
  caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEU: 188.172.229.121
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel bereitstellen
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - name: Caddyfile auf die Box
        run: |
          set -eu
          scp -o StrictHostKeyChecking=accept-new -o BatchMode=yes deploy/Caddyfile.neuer-server root@$NEU:/root/Aequitas/deploy/Caddyfile.neuer-server
      - name: Warten bis gleichauf, dann Caddy starten
        run: |
          set -eu
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@$NEU 'bash -s' < deploy/caddy-neuer-server.sh
