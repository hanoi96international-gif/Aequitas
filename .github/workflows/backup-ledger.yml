name: Backup the ledger (scheduled + manual)

# THE LEDGER HAD NO BACKUP. THAT IS WHAT THIS FIXES.
#
# Audit 2026-08-18, K1: there was no pg_dump, no pg_basebackup, no WAL
# archiving and no volume snapshot anywhere in this repository. The ledger is
# Postgres — the code says so itself (evm_rpc.go: "Go state is authoritative
# for balances") — and it existed in exactly two copies, on two Contabo boxes,
# whose only recovery path was "resync from the other one".
#
# Both are deployed from the same push. The staggering in deploy-contabo.yml
# and deploy-contabo2.yml is good, but both waits fail OPEN after their
# timeout, so a deploy that damages both is unlikely rather than impossible.
# And staggering does nothing at all against a datacentre loss, a Postgres
# corruption, or a migration that runs everywhere.
#
# /api/snapshot is not a substitute: it serves account state, not chain_blocks,
# and it is served BY the nodes this is meant to survive the loss of.
#
# WHAT THIS DOES
#
# Takes a compressed pg_dump of each validator's database, verifies the dump
# can actually be restored (into a throwaway database on the same box, then
# dropped), and uploads it as a workflow artifact. Retention is 90 days, which
# is GitHub's storage rather than the operator's — a second location by
# construction, which is the entire point.
#
# A dump that has never been restored is not a backup, it is a file. The
# restore check is not optional here and the job fails if it does not pass.
#
# WAS GESICHERT WIRD -- UND WAS NICHT (Entscheidung vom 12.09.2026)
#
# Gesichert wird der ZUSTAND: Konten, Menschen, Nullifier, Konfiguration,
# EVM-Speicher, Nonces, Validatoren, MPC-Anteile -- alles, was nur in dieser
# Datenbank steht. Zusammen unter 200 MB, in Sekunden gedumpt.
#
# NICHT gesichert werden die Bloecke (chain_blocks, 14 GB am 12.09.2026 und
# unter Last um mehrere GB je Tag wachsend) und was sich daraus ableitet
# (chain_tx_batches, chain_tx_block_index, evm_tx_receipts, pending_txs).
# Gruende, gemessen: der volle Dump brauchte 29,5 Minuten auf C1 und lief
# auf C2 in das 30-Minuten-Zeitlimit -- jeden Tag rot, seit dem 11.09.; er
# lief 20+ Minuten auf dem lebenden Validator, waehrend GitHub den 03:17-Cron
# um Stunden verschob und er so mitten in Lasttests fiel; und 13 GB je Tag
# und Box passen in kein Artefakt-Kontingent (die "Kopie" vom 12.09. war ein
# nach 2,4 GB abgebrochener cp). Die Bloecke liegen auf JEDEM Validator;
# ein Knoten holt sie sich vom Netz zurueck. Verliert das Netz ALLE
# Validatoren zugleich, verliert es die Blockgeschichte, nicht den Kontostand
# -- ein Neustart aus dem Zustand ist dann moeglich, ein Beweis der
# Geschichte nicht. Wer die Geschichte zusaetzlich sichern will, braucht
# Objektspeicher und einen inkrementellen Block-Export; das ist ein eigenes
# Vorhaben, nicht dieser Cron.
#
# LIMITS, STATED PLAINLY
#
# - Artifact storage is bounded by the GitHub plan. Der Zustands-Dump ist
#   klein; waechst er ueber das Kontingent, gehoert der Upload in einen
#   Objektspeicher -- die Pruefung bleibt, wie sie ist.
# - This is a nightly point-in-time copy, not continuous archiving. Losing up
#   to a day of blocks is survivable for a chain that can re-sync from its
#   peers; losing BOTH databases is not, and that is the case this covers.
# - The dump contains every account balance. DAS REPO IST OEFFENTLICH
#   (festgestellt 26.09.2026): jedes Artefakt ist fuer jeden angemeldeten
#   GitHub-Nutzer lesbar. Ausgelagert wird deshalb nur eine Fassung ohne die
#   Zeilen der biometrischen Tabellen (mpc_shares, bio_hashes, ...); der
#   vollstaendige, gepruefte Dump bleibt auf der Box. Siehe
#   deploy/backup-ledger.sh.

on:
  schedule:
    # 03:17 UTC — off the hour so it does not land with every other cron on
    # the box, and outside the daily distribution window.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      box:
        description: "Which validator to back up"
        required: true
        default: both
        type: choice
        options: [both, c1, contabo2]

concurrency:
  group: backup-ledger
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      # Sequential: both jobs run pg_dump against a live validator, and doing
      # that to both at once is exactly the kind of simultaneous load this
      # project has been bitten by before.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # contabo1 (173.249.37.118) ist seit dem 24.09.2026 abgeschaltet;
          # die IP vergibt der Anbieter neu -- nie mehr per SSH ansprechen.
          # Der neue C1 (netcup, Primary seit 26.09.2026) steht hier als c1.
          - box: c1
            host: 188.172.229.121
            secret_name: CONTABO_SSH_KEY
            fingerprint: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
          - box: contabo2
            host: 194.163.188.71
            secret_name: CONTABO2_SSH_KEY
            fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
    steps:
      - name: Skip boxes this run does not target
        id: gate
        run: |
          want="${{ github.event.inputs.box || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.box }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not targeted this run."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          sparse-checkout: deploy/backup-ledger.sh
          sparse-checkout-cone-mode: false

      - name: Schluessel und Host-Pruefung
        if: steps.gate.outputs.run == 'true'
        env:
          KEY: ${{ secrets[matrix.secret_name] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fingerprint }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$HOST" 2>/dev/null > ~/.ssh/kh_all
          ssh-keygen -lf ~/.ssh/kh_all | awk '{print $2}' | grep -qx "$FP" || { echo "::error::Host-Schluessel von $HOST passt nicht"; exit 1; }
          cp ~/.ssh/kh_all ~/.ssh/known_hosts

      - name: Dump and verify on ${{ matrix.box }}
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        run: ssh -o BatchMode=yes root@${{ matrix.host }} "BOX='${{ matrix.box }}' bash -s" < deploy/backup-ledger.sh

      - name: Fetch the dump off the box
        # always(), damit eine gescheiterte Pruefung die Auslagerung nicht mehr
        # verhindert. Schlaegt schon pg_dump fehl, existiert
        # /root/backup-latest.dump nicht -- es wird zu Beginn geloescht -- und
        # dieser Schritt scheitert. Richtig so: dann gibt es wirklich nichts.
        # Ausgelagert wird die Fassung OHNE biometrische Tabellenzeilen
        # (deploy/backup-ledger.sh) -- das Repo ist oeffentlich.
        if: always() && steps.gate.outputs.run == 'true'
        run: scp -o BatchMode=yes root@${{ matrix.host }}:/root/backup-latest.dump ${{ matrix.box }}-ledger.dump

      - name: Fetch backup summary
        if: success() && steps.gate.outputs.run == 'true'
        timeout-minutes: 2
        run: scp -o BatchMode=yes root@${{ matrix.host }}:/root/backup-latest.summary ${{ matrix.box }}-backup.summary

      - name: Job summary
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Ledger backup \`${{ matrix.box }}\`"
            echo ""
            if [ -f "${{ matrix.box }}-backup.summary" ]; then
              . "./${{ matrix.box }}-backup.summary"
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| humans | ${humans:-?} |"
              echo "| accounts | ${accounts:-?} |"
              echo "| nullifiers | ${nullifiers:-?} |"
              echo "| dump_mb | ${dump_mb:-?} |"
              echo "| dump_bytes | ${dump_bytes:-?} |"
            else
              echo "_No summary file from box._"
            fi
            echo ""
            echo "Dump-Schritt: 10 min; dump size hard-fail if >500MB. Ausgelagert: ohne biometrische Tabellenzeilen."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as an artifact (the second location)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ matrix.box }}-${{ github.run_id }}
          path: ${{ matrix.box }}-ledger.dump
          retention-days: 90
          if-no-files-found: error
