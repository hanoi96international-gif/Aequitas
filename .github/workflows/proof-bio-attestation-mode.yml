name: Set proof BIO_ATTESTATION_MODE (both boxes)

# Launch / rollback helper. Sets BIO_ATTESTATION_MODE on the proof-server
# containers without touching aequitas-node. paths under .github/ do not
# trigger Contabo node deploys.
#
# Do NOT call /root/proof-deploy.sh from this workflow: that script rewrites
# /root/proof-server.env from the RUNNING container and would undo the mode
# change (observed 2026-09-13 — optional written, then health still required).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "BIO_ATTESTATION_MODE value"
        required: true
        type: choice
        options: [optional, required]
        default: required
      box:
        description: "Which box"
        required: true
        type: choice
        options: [both, contabo1, contabo2]
        default: both

jobs:
  set-mode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contabo1
            host: 173.249.37.118
            secret: C1
            fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          - name: contabo2
            host: 194.163.188.71
            secret: C2
            fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
    steps:
      - name: Skip unwanted box
        id: skip
        run: |
          want='${{ inputs.box }}'
          me='${{ matrix.name }}'
          if [ "$want" = "both" ] || [ "$want" = "$me" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set BIO_ATTESTATION_MODE on proof-server
        if: steps.skip.outputs.run == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ matrix.host }}
          username: root
          key: ${{ matrix.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: ${{ matrix.fingerprint }}
          script_stop: true
          timeout: 300s
          command_timeout: 300s
          envs: MODE
          script: |
            set -euo pipefail
            echo "=== ${{ matrix.name }}: set BIO_ATTESTATION_MODE=$MODE ==="
            docker inspect proof-server --format 'status={{.State.Status}}' >/dev/null

            ENVF=/root/proof-server.env
            umask 077
            if [ -f "$ENVF" ]; then
              cp -a "$ENVF" "$ENVF.bak-$(date +%s)"
            else
              docker inspect proof-server --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -vE '^(PATH|NODE_VERSION|YARN_VERSION|HOSTNAME|HOME)=' \
                | grep -E '^[A-Z_]+=' > "$ENVF"
              chmod 600 "$ENVF"
            fi

            grep -vE '^BIO_ATTESTATION_MODE=' "$ENVF" > "$ENVF.tmp"
            printf 'BIO_ATTESTATION_MODE=%s\n' "$MODE" >> "$ENVF.tmp"
            mv "$ENVF.tmp" "$ENVF"
            chmod 600 "$ENVF"
            grep -q "^BIO_ATTESTATION_MODE=$MODE$" "$ENVF" || { echo "ERROR: mode not written"; exit 1; }
            echo "env:"; grep '^BIO_ATTESTATION_MODE=' "$ENVF"

            IMAGE=$(docker inspect proof-server --format '{{.Config.Image}}')
            NET=$(docker inspect proof-server --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
            [ -n "$NET" ] || NET=aequitas-net
            echo "recreate image=$IMAGE net=$NET"
            docker rm -f proof-server >/dev/null 2>&1 || true
            docker run -d --name proof-server --restart unless-stopped \
              --network "$NET" --env-file "$ENVF" "$IMAGE" >/dev/null

            ok=0
            for _ in $(seq 1 20); do
              body=$(docker exec proof-server sh -c 'wget -qO- --timeout=3 http://127.0.0.1:3000/health' 2>/dev/null || true)
              echo "$body" | head -c 400; echo
              if echo "$body" | grep -q "\"mode\":\"$MODE\""; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "ERROR: health mode is not $MODE"; exit 1; }
            echo "=== done ${{ matrix.name }} mode=$MODE ==="
