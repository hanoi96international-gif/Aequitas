name: Absturz C1? Neustarts, OOM, Speicher (nur lesen)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    steps:
      - name: Schluessel und Host-Pruefung
        env:
          K1: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$K1" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/c1 && chmod 600 ~/.ssh/c1
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/k1
          ssh-keygen -lf ~/.ssh/k1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA'
          cat ~/.ssh/k1 > ~/.ssh/known_hosts
      - name: C1
        run: |
          for box in c1:188.172.229.121; do
            k=${box%%:*}; h=${box#*:}
            echo "################ $k ################"
            ssh -i ~/.ssh/$k -o BatchMode=yes root@$h 'bash -s' <<'SKRIPT' | sed -E 's/0x[0-9a-fA-F]{40}/0x…/g; s/[0-9a-fA-F]{16,}/#/g' | cut -c1-260
          date -u; uptime; free -m | head -2
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker inspect "$c" --format '{{.Name}} status={{.State.Status}} gestartet={{.State.StartedAt}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}'
          done
          docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(GOMEMLIMIT|GOGC|GOMAXPROCS)=' || echo "(kein GOMEMLIMIT)"
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' | head -8
          echo "--- Kernel OOM (heute) ---"
          dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -8 || journalctl -k --since today 2>/dev/null | grep -iE 'oom|killed process' | tail -8
          echo "--- [MEM] / panic / FATAL seit 08:00 UTC ---"
          docker logs --since 2026-09-27T08:00:00Z aequitas-node 2>&1 | grep -E '\[MEM\]|panic:|FATAL|fatal error|runtime: out of memory' | sed -E 's/ Above the.*//' | tail -12
          echo "--- Container-Starts heute (docker events) ---"
          docker events --since 2026-09-27T06:00:00Z --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter type=container --filter event=start --filter event=die --filter event=oom --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' 2>/dev/null | tail -20
          SKRIPT
          done
