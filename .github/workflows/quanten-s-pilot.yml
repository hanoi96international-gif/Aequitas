# Pilot fuer Quantengeld Variante S mit MEHREREN Validatoren, auf echter
# Hardware -- Voraussetzung fuer W6 ("Pilot im Testnetz").
#
# Das Hauptnetz hat heute nur einen Validator (C1); ein Testnetz mit
# mehreren Servern gibt es nicht. Dieser Lauf baut es fuer die Dauer des
# Jobs: vier echte Knoten (eigene Datenbank, eigener Schluessel, echtes HTTP,
# je ein Validator-Dienst) wie TestVierKnotenQuantenS_RealDB, das Geheimnis
# des Tokens 3-von-4 geteilt. Der Token selbst kommt vom Chip:
#
#   1. messen: hardware_ibm.py --s-messen --k K -- 2K Qubits in
#      BB84-Zustaenden, in Schaltkreisen zu 16 sofort gemessen (S braucht
#      keinen Speicher, die Groesse ist also nur eine Frage der Schaltkreise). Modus ibm: echter Chip (Umgebung quantenhardware,
#      Freigabe). Modus rauschen: Rauschmodell, kostet nichts.
#      Ausgabe abschnitte: --s-abschnitte --ausgaben 2 -- je Validator ein
#      eigener Auftrag fuer seinen Abschnitt, zwei Ausgaben (eine je Test,
#      denn jede Messung gilt nur einmal): 8 Auftraege.
#   2. pilot: die vier Knoten pruefen die Messung -- Ausgabe mit den
#      Bestaetigungen aller vier Validatoren, Doppelvorlage an der falschen
#      Stelle (muss abgewiesen werden), ehrliche Vorlage (wird eingeloest).
#      Einmal mit allen vier, einmal faellt ein Validator vor der ersten
#      Vorlage aus (3 von 4 genuegen).
#
# Kein Server, kein Hauptnetz, kein Server-Schluessel. Der Job "pilot" hat
# keine Secrets. Die Messung geht als Job-Ausgabe von 1 nach 2; sie schuetzt
# hier keinen Wert (die Knoten leben nur in diesem Job).
#
# Die Tabelle im Knoten gilt unveraendert: fuer 3 von 4 Validatoren und
# Toleranz 4 % verlangt sie k = 5.200 Stellen je Annahmestelle (Vorgabe hier,
# 10.400 Qubits). Ein kleineres k weist das Werkzeug ab (fail-closed).
name: Quantengeld S -- Pilot mit vier Validatoren

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "ibm = echter Chip (Freigabe quantenhardware); rauschen = Rauschmodell (Probe)"
        type: choice
        options: [rauschen, ibm]
        default: rauschen
      k:
        description: "Stellen je Annahmestelle (Token = 2k Qubits); die Tabelle verlangt fuer 3 von 4 Validatoren 5200"
        default: "5200"
      latenz_ms:
        description: "Netzlaufzeit je Richtung zwischen den Knoten in ms (0 bis 300; 0 = wie bisher). Naehert Server im echten Netz an."
        default: "0"
      ausgabe:
        description: "auftrag = alle Stellen in einem Auftrag (wie bisher); abschnitte = je Validator ein eigener Auftrag fuer seinen Abschnitt, zwei Ausgaben (eine je Test; DEZENTRAL.md)"
        type: choice
        options: [auftrag, abschnitte]
        default: auftrag
      toleranz:
        description: "Toleranz in Prozent (4 = Standard). 2 braucht fuer 3 von 4 nur k = 1760 statt 5200, aber kleinen Messfehler -- das Werkzeug prueft es und bricht sonst vor der Kette ab (quanten_s_toleranz.go)"
        type: choice
        options: ["4", "3", "2"]
        default: "4"
      stichprobe_v2:
        description: "ja = Stichprobe erst nach der Bindung (DEZENTRAL.md 16; nur mit ausgabe = abschnitte). Die Kettenregel schlaeft im Hauptnetz; nur im Testprozess der vier Knoten scharf."
        type: choice
        options: ["nein", "ja"]
        default: "nein"
      rollen:
        description: "ja = getrennte Rollen (DEZENTRAL.md 17): Ausgeber, Inhaberin und zwei Annahmestellen mit eigenen Schluesseln, jede an einem anderen Knoten; nur mit ausgabe = abschnitte und stichprobe_v2 = ja"
        type: choice
        options: ["nein", "ja"]
        default: "nein"

permissions:
  contents: read

# Je Modus eine Schlange: IBM-Laeufe verbrauchen Kontingent und laufen
# nacheinander; ein IBM-Lauf, der auf seine Freigabe wartet, haelt keine
# Laeufe im Rauschmodell auf (die kosten nichts und laufen je auf eigener VM).
concurrency:
  group: quanten-s-pilot-${{ inputs.modus }}
  cancel-in-progress: false

env:
  K: ${{ inputs.k }}
  LATENZ: ${{ inputs.latenz_ms }}
  AUSGABE: ${{ inputs.ausgabe }}
  TOL: ${{ inputs.toleranz }}
  V2: ${{ inputs.stichprobe_v2 }}
  ROLLEN: ${{ inputs.rollen }}

jobs:
  rauschen:
    if: inputs.modus == 'rauschen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      messung: ${{ steps.lauf.outputs.messung }}
    steps:
      - name: Eingabe pruefen
        run: |
          set -euo pipefail
          [[ "$K" =~ ^[1-9][0-9]{0,3}$ ]] && [ "$K" -le 8192 ] || { echo "::error::k = $K (1 bis 8192)"; exit 1; }
          [[ "$V2" =~ ^(nein|ja)$ ]] || { echo "::error::stichprobe_v2 = $V2"; exit 1; }
          [ "$V2" = nein ] || [ "$AUSGABE" = abschnitte ] || { echo "::error::stichprobe_v2 = ja nur mit ausgabe = abschnitte"; exit 1; }
          [[ "$ROLLEN" =~ ^(nein|ja)$ ]] || { echo "::error::rollen = $ROLLEN"; exit 1; }
          [ "$ROLLEN" = nein ] || [ "$V2" = ja ] || { echo "::error::rollen = ja nur mit stichprobe_v2 = ja (und ausgabe = abschnitte)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Messung im Rauschmodell
        id: lauf
        run: |
          set -euo pipefail
          if [ "$AUSGABE" = abschnitte ]; then
            # Je Validator ein eigener Auftrag fuer seinen Abschnitt; zwei
            # Ausgaben, eine je Test (die Messquelle gibt jeden Abschnitt
            # nur einmal her).
            python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-abschnitte "$RUNNER_TEMP/ab" --k "$K" --v 4 --ausgaben 2
            echo "messung=$(tar -C "$RUNNER_TEMP/ab" -czf - . | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/ab"
          else
            python3 -I forschung/quantengeld/hardware_ibm.py --rauschen FakeMarrakesh --s-messen "$RUNNER_TEMP/messung.json" --k "$K"
            echo "messung=$(gzip -9c "$RUNNER_TEMP/messung.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/messung.json"
          fi

  messen:
    if: inputs.modus == 'ibm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: quantenhardware
    outputs:
      messung: ${{ steps.lauf.outputs.messung }}
    steps:
      - name: Eingabe pruefen
        run: |
          set -euo pipefail
          [[ "$K" =~ ^[1-9][0-9]{0,3}$ ]] && [ "$K" -le 8192 ] || { echo "::error::k = $K (1 bis 8192)"; exit 1; }
          [[ "$V2" =~ ^(nein|ja)$ ]] || { echo "::error::stichprobe_v2 = $V2"; exit 1; }
          [ "$V2" = nein ] || [ "$AUSGABE" = abschnitte ] || { echo "::error::stichprobe_v2 = ja nur mit ausgabe = abschnitte"; exit 1; }
          [[ "$ROLLEN" =~ ^(nein|ja)$ ]] || { echo "::error::rollen = $ROLLEN"; exit 1; }
          [ "$ROLLEN" = nein ] || [ "$V2" = ja ] || { echo "::error::rollen = ja nur mit stichprobe_v2 = ja (und ausgabe = abschnitte)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r forschung/quantengeld/hardware-anforderungen.txt
      - run: python3 -I forschung/quantengeld/hardware_ibm.py --selbsttest
      - name: Messung auf dem IBM-Chip
        id: lauf
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ vars.IBM_QUANTUM_INSTANCE }}
          IBM_QUANTUM_BACKEND: ${{ vars.IBM_QUANTUM_BACKEND }}
        run: |
          set -euo pipefail
          if [ "$AUSGABE" = abschnitte ]; then
            # Je Validator ein eigener Auftrag fuer seinen Abschnitt (im Pilot
            # alle vom selben Konto -- im Betrieb misst jeder Validator selbst);
            # zwei Ausgaben, eine je Test: 8 Auftraege.
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-abschnitte "$RUNNER_TEMP/ab" --k "$K" --v 4 --ausgaben 2
            echo "messung=$(tar -C "$RUNNER_TEMP/ab" -czf - . | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -rf "$RUNNER_TEMP/ab"
          else
            python3 -I forschung/quantengeld/hardware_ibm.py --ibm --s-messen "$RUNNER_TEMP/messung.json" --k "$K"
            echo "messung=$(gzip -9c "$RUNNER_TEMP/messung.json" | base64 -w0)" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/messung.json"
          fi

  pilot:
    needs: [rauschen, messen]
    # Genau einer der beiden Mess-Jobs laeuft, der andere ist uebersprungen.
    if: always() && (needs.rauschen.result == 'success' || needs.messen.result == 'success')
    runs-on: ubuntu-latest
    # Zwei Laeufe; je Urteil wartet das Werkzeug bis zur Kettenfrist (30 min)
    # plus Nachlauf (quantenSUrteilFrist).
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aeq_pilot
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aeq_pilot?sslmode=disable"
      AEQUITAS_TPS_BENCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Messung uebernehmen
        env:
          MESSUNG: ${{ needs.messen.outputs.messung || needs.rauschen.outputs.messung }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$AUSGABE" = abschnitte ]; then
            mkdir -m 700 "$RUNNER_TEMP/ab"
            printf '%s' "$MESSUNG" | base64 -d | tar -C "$RUNNER_TEMP/ab" --no-same-owner --no-same-permissions -xzf -
            # Genau die erwarteten Dateien, sonst nichts: zwei Ausgaben (eine
            # je Test), je Validator eine Messquelle mit beiden Abschnitten.
            [ "$(cd "$RUNNER_TEMP/ab" && ls | sort | tr '\n' ' ')" = "basen_1.json basen_2.json mess_1.json mess_2.json mess_3.json mess_4.json " ] || { echo "::error::Abschnitte unvollstaendig"; exit 1; }
            for a in 1 2; do
              jq -e --argjson n "$((2 * K))" '.n == $n and (.basen | length) == 4 and ([.basen[] | length] | add) == $n' "$RUNNER_TEMP/ab/basen_$a.json" >/dev/null || { echo "::error::Basen der Ausgabe $a unvollstaendig"; exit 1; }
              jq -r --arg a "$a" '"Ausgabe \($a): Geraet \(.wo)  Jobs \(.job)"' "$RUNNER_TEMP/ab/basen_$a.json"
            done
            for x in 1 2 3 4; do
              jq -e '(.abschnitte | length) == 2' "$RUNNER_TEMP/ab/mess_$x.json" >/dev/null || { echo "::error::Messquelle von Validator $x unvollstaendig"; exit 1; }
            done
          else
            printf '%s' "$MESSUNG" | base64 -d | gunzip -c > "$RUNNER_TEMP/m.json"
            jq -e --argjson n "$((2 * K))" '.n == $n and (.x | length) == $n' "$RUNNER_TEMP/m.json" >/dev/null || { echo "::error::Messung unvollstaendig"; exit 1; }
            jq -r '"Geraet: \(.wo)  Job: \(.job)"' "$RUNNER_TEMP/m.json"
          fi
      - name: Netzlaufzeit zwischen den Knoten
        # Die Knoten lauschen auf 127.0.0.11..14 (vier_knoten_realdb_test.go)
        # und verbinden von ihrer eigenen Adresse aus: netem verzoegert nur
        # Pakete AN 127.0.0.8/29 -- Hin- und Rueckweg zwischen Knoten, also
        # Rundlauf ~ 2 x LATENZ. Datenbank (127.0.0.1) und alles andere
        # bleiben unverzoegert. Klappt das Einrichten nicht, bricht der Lauf
        # ab, statt still ohne Laufzeit zu messen.
        run: |
          set -euo pipefail
          [[ "$LATENZ" =~ ^[0-9]{1,3}$ ]] && [ "$LATENZ" -le 300 ] || { echo "::error::latenz_ms = $LATENZ (0 bis 300)"; exit 1; }
          if [ "$LATENZ" -eq 0 ]; then echo "keine kuenstliche Laufzeit"; exit 0; fi
          sudo modprobe sch_prio || true
          sudo modprobe sch_netem || true
          sudo tc qdisc add dev lo root handle 1: prio bands 3 priomap 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2
          sudo tc qdisc add dev lo parent 1:1 handle 10: netem delay "${LATENZ}ms"
          sudo tc filter add dev lo parent 1:0 protocol ip prio 1 u32 match ip dst 127.0.0.8/29 flowid 1:1
          tc qdisc show dev lo
          tc filter show dev lo
          echo "Rundlauf zu einem Knoten (erwartet ~ $((2 * LATENZ)) ms) und zur Datenbank (erwartet ~ 0):"
          ping -c 3 -I 127.0.0.12 127.0.0.11 | tail -1
          ping -c 3 127.0.0.1 | tail -1
          rtt=$(ping -c 3 -I 127.0.0.12 127.0.0.11 | awk -F'/' '/^rtt/ {print int($5)}')
          [ "${rtt:-0}" -ge "$LATENZ" ] || { echo "::error::Laufzeit wirkt nicht (Rundlauf ${rtt:-?} ms)"; exit 1; }
      - name: Vier Knoten, 3 von 4 -- mit und ohne Ausfall
        run: |
          set -euo pipefail
          [[ "$ROLLEN" =~ ^(nein|ja)$ ]] || { echo "::error::rollen = $ROLLEN"; exit 1; }
          if [ "$AUSGABE" = abschnitte ]; then
            export AEQUITAS_QS_ABSCHNITTE="$RUNNER_TEMP/ab"
            TESTS='TestVierKnotenQuantenSAbschnitte(Ausfall)?_RealDB$'
            # Getrennte Rollen: dieselben zwei Ausgaben (eine je Test), aber
            # Inhaberin, Ausgeber und Annahmestellen mit eigenen Schluesseln.
            [ "$ROLLEN" = nein ] || TESTS='TestVierKnotenQuantenSRollen(Ausfall)?_RealDB$'
          else
            [ "$ROLLEN" = nein ] || { echo "::error::rollen = ja nur mit ausgabe = abschnitte"; exit 1; }
            export AEQUITAS_QS_MESSUNG="$RUNNER_TEMP/m.json"
            TESTS='TestVierKnotenQuantenS(Ausfall)?_RealDB$'
          fi
          [[ "$TOL" =~ ^(2|3|4)$ ]] || { echo "::error::toleranz = $TOL"; exit 1; }
          export AEQUITAS_QS_TOL="$TOL"
          [[ "$V2" =~ ^(nein|ja)$ ]] || { echo "::error::stichprobe_v2 = $V2"; exit 1; }
          [ "$ROLLEN" = nein ] || [ "$V2" = ja ] || { echo "::error::rollen = ja nur mit stichprobe_v2 = ja"; exit 1; }
          if [ "$V2" = ja ]; then
            [ "$AUSGABE" = abschnitte ] || { echo "::error::stichprobe_v2 = ja nur mit ausgabe = abschnitte"; exit 1; }
            export AEQUITAS_QS_V2=1
          fi
          set +e
          go test ./x/humanity/keeper/ -run "$TESTS" -v -count=1 -timeout 80m 2>&1 | tee out.txt
          RC=${PIPESTATUS[0]}
          set -e
          rm -rf "$RUNNER_TEMP/m.json" "$RUNNER_TEMP/ab"
          # Nachvollziehbar: alle Meldungen der Tests (t.Log/t.Fatal samt
          # Folgezeilen) und ihre Ergebnisse -- ohne die Knotenprotokolle.
          awk '/^=== RUN|^ *--- (PASS|FAIL|SKIP)|^(ok|FAIL|PASS)([ \t]|$)/ {print; f=0; next}
               /^    [A-Za-z0-9_]+_test\.go:[0-9]+:/ {print; f=1; next}
               f && /^        / {print; next}
               {f=0}' out.txt > ergebnis.txt
          gzip -9 -c out.txt > ausgabe.txt.gz
          {
            echo "## Quantengeld S: Pilot mit vier Validatoren (Modus ${{ inputs.modus }}, Ausgabe $AUSGABE, k = $K, Toleranz $TOL %, Stichprobe v2 $V2, getrennte Rollen $ROLLEN, Laufzeit zwischen Knoten $LATENZ ms je Richtung)"
            echo
            echo "Commit \`${{ github.sha }}\`, Lauf ${{ github.run_id }}."
            echo
            if [ "$RC" = 0 ]; then
              echo "**Erfolg:** in beiden Laeufen Doppelvorlage abgewiesen, ehrliche Vorlage eingeloest, alle Knoten im Gleichstand."
            else
              echo "**Gescheitert (Exit $RC).**"
            fi
            echo
            echo "### Ergebnis der Tests (vollstaendig)"
            echo '```'
            cat ergebnis.txt
            echo '```'
            echo
            echo "Artefakt \`pilot-${{ github.run_id }}\` (90 Tage): \`ergebnis.txt\` und die ganze Ausgabe \`ausgabe.txt.gz\` mit allen Knotenprotokollen. SHA-256:"
            echo '```'
            sha256sum ergebnis.txt ausgabe.txt.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Auch ans Ende des Protokolls: die Schnittstelle liefert nur dessen
          # letzte 5.000 Zeilen, Zusammenfassung und Artefakt sind von manchen
          # Arbeitsumgebungen aus nicht abrufbar.
          echo "===== Ergebnis der Tests ====="
          echo "Modus ${{ inputs.modus }}, Ausgabe $AUSGABE, k = $K, Toleranz $TOL %, Stichprobe v2 $V2, getrennte Rollen $ROLLEN, Laufzeit zwischen Knoten $LATENZ ms je Richtung"
          cat ergebnis.txt
          sha256sum ergebnis.txt ausgabe.txt.gz
          echo "===== Ende Ergebnis ====="
          exit "$RC"
      - name: Ergebnis und ganze Ausgabe aufbewahren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-${{ github.run_id }}
          path: |
            ergebnis.txt
            ausgabe.txt.gz
          retention-days: 90
          if-no-files-found: warn
