name: Loadtest Contabo2 -- prepare accounts (manual, no chain load yet)

# First of a three-workflow trio (prepare -> run -> cleanup) that drives
# tools/contabo-loadtest (see that tool's own package comment) against the
# live Contabo2 node -- closing SCALING_ARCHITECTURE.md's single biggest
# remaining gap: every TPS number so far is from an isolated, ephemeral
# sandbox, never real hardware.
#
# Deliberately isolated from /root/Aequitas (the production deploy
# checkout used by deploy-contabo2.yml / deploy_safe_c2.sh): this trio
# copies just the tool's own source files into a dedicated
# /root/contabo-loadtest directory instead, so a load-test run can never
# race with or disturb a concurrent production deploy. This workflow does
# NOT generate any chain traffic -- it only creates fresh disposable
# accounts and reports the ones that need funding. Actually sending the
# load lives in loadtest-run-contabo2.yml, dispatched separately, only
# after the printed seed addresses below have been funded by a human.
#
# Account CSV handling, per tools/contabo-loadtest/main.go's own docstring:
# the CSV (index,address,privkey_hex) is generated ON THE SERVER by this
# workflow's own ssh step and never leaves it -- it is NOT scp'd back to
# the runner, NOT uploaded as a workflow artifact, and NOT printed here.
# Only addresses are ever printed, never private keys. Run
# loadtest-cleanup-contabo2.yml when testing is done to shred it.
#
# The backup-then-generate logic below lives in ONE ssh step rather than
# two: an earlier version split "back up any existing accounts.csv" into
# its own preceding step, and that specific step reproducibly failed
# (~2s, zero remote output, even with debug:true) across three live
# attempts on 2026-07-24 -- while a bare `echo` in that same step slot,
# and this step's own more complex script, both succeeded immediately
# after. Root cause unconfirmed (never reproduced once folded into a
# single step), so this avoids the two-step shape rather than trust it.
on:
  workflow_dispatch:
    inputs:
      num_accounts:
        description: "Total disposable test accounts to generate"
        required: false
        default: "150"
      num_seeds:
        description: "How many of them are seed accounts a human must fund with real AEQ (must match the value passed to loadtest-run-contabo2.yml later)"
        required: false
        default: "5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy loadtest tool source to Contabo2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          source: "tools/contabo-loadtest/main.go,tools/contabo-loadtest/gen_accounts.go,go.mod,go.sum"
          target: "/root/contabo-loadtest"
          overwrite: true

      - name: Back up any existing accounts.csv, then generate fresh ones and print seed addresses
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: true
          timeout: 300s
          command_timeout: 300s
          script: |
            set -euo pipefail
            cd /root/contabo-loadtest
            # scp-action's tar-based transfer may or may not preserve the
            # source paths' tools/contabo-loadtest/ subdirectory, so both
            # layouts have to be handled. This used to do that with
            #   MAIN="$(find . -name main.go | head -1)"
            #   [ "$MAIN" = "./main.go" ] || mv -f "$MAIN" ./main.go
            # which is correct exactly once: after the first run BOTH paths
            # exist, and `find | head -1` returns whichever the filesystem
            # yields first. When that is the stale ./main.go the mv is skipped
            # and the freshly copied file is ignored -- nondeterministically,
            # so it sometimes worked. See loadtest-run-contabo2.yml for the
            # live run this was found from.
            #
            # Resolved by PRECEDENCE instead of luck: a nested copy is always
            # the one scp just wrote, so it always wins; the root copy is used
            # only when no nested copy exists, which is exactly the flattened-
            # transfer case (and there scp has already overwritten it in
            # place). The tree is then deleted so a stale nested copy cannot
            # linger into the next run.
            for f in main.go gen_accounts.go; do
              if [ -f "tools/contabo-loadtest/$f" ]; then
                mv -f "tools/contabo-loadtest/$f" "./$f"
              elif [ ! -f "./$f" ]; then
                echo "✗ $f landed in neither layout after scp — aborting rather than using something stale"
                exit 1
              fi
            done
            rm -rf ./tools

            if [ -f accounts.csv ]; then
              BACKUP="accounts.csv.bak.$(date +%s)"
              mv accounts.csv "$BACKUP"
              chmod 600 "$BACKUP"
              echo "Existing accounts.csv backed up to $BACKUP -- if those accounts still hold funded balances, sweep them before discarding the backup."
            else
              echo "No existing accounts.csv, starting clean."
            fi

            echo "=== Generating $NUM_ACCOUNTS disposable accounts (this pulls go-ethereum's deps on first run, can take a few minutes) ==="
            mkdir -p /root/go-mod-cache
            docker run --rm \
              -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod \
              golang:1.24-alpine \
              go run gen_accounts.go "$NUM_ACCOUNTS" > accounts.csv
            chmod 600 accounts.csv
            echo "accounts.csv written ($(($(wc -l < accounts.csv) - 1)) accounts, private keys never printed)."

            echo ""
            echo "=== Fund these $NUM_SEEDS seed addresses with a small amount of REAL AEQ (index,address) ==="
            echo "=== Everything after this point is derived from the SAME accounts.csv -- do not regenerate it before funding these ==="
            head -n "$((NUM_SEEDS + 1))" accounts.csv | cut -d, -f1,2
            echo ""
            echo "Once funded, dispatch loadtest-run-contabo2.yml with num_seeds=$NUM_SEEDS to match."
          envs: NUM_ACCOUNTS,NUM_SEEDS
        env:
          NUM_ACCOUNTS: ${{ inputs.num_accounts }}
          NUM_SEEDS: ${{ inputs.num_seeds }}
