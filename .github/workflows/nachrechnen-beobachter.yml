name: Nachrechnen beobachten (Knoten auf einem Runner spielt C1 nach)
# WARUM: Die Nachrechen-Regeln (K-2/K-4) laufen nur beim NACHSPIELEN fremder
# Bloecke. C1 spielt seine eigenen nicht nach, und C2 gibt es nicht mehr --
# ohne diesen Lauf zaehlt niemand, ob ehrliche Bloecke eine Regel verletzen,
# und ohne diese Zahl darf der strenge Modus nicht scharf werden.
#
# WAS: ein frischer Knoten auf dem Runner holt C1s unterschriebenen Snapshot,
# spielt danach jeden neuen Block von C1 nach (nur Pull-Sync, kein SELF_URL,
# also von aussen unerreichbar) und erzeugt selbst NIE einen Block
# (AEQUITAS_BEOBACHTER=1, beobachter.go). Am Ende: Abweichungen je Regel aus
# /api/wirtschaft/regeln und die [NACHRECHNEN]-Zeilen des Logs.
#
# WANN: Nur ein Lauf, der eine Verteilungsrunde nachspielt, sagt etwas aus --
# in leeren Bloecken gibt es nichts nachzurechnen. Lauf 4 (04.10.) startete
# wegen der Verzoegerung geplanter Laeufe erst um 20:13 statt 17:20, verpasste
# die Runde und meldete "0 Abweichungen" bei 0 geprueften Transaktionen. Darum:
#   - Fenster pruefen: die naechste Runde ist letzte Runde (last_ubi_at von
#     C1) + 24 h. Liegt sie ausserhalb der Laufzeit, endet der Lauf nach einer
#     Minute "ohne Aussage", statt Stunden leer zu laufen.
#   - Ende nach der Runde: sobald der Beobachter sie selbst nachgespielt hat
#     (eigenes last_ubi_at), noch 5 Minuten, dann Schluss.
#   - Zwei Startzeiten; der zweite Lauf endet sofort, wenn der erste die
#     Runde schon gesehen hat. concurrency haelt sie nacheinander.
#   - Ergebnis "ohne Aussage", wenn nichts geprueft wurde.
# C1 wird nur gelesen (Status, Snapshot, Bloecke, StateRoot-Bestandteile).
on:
  schedule:
    - cron: "40 15 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      minuten: {description: "Laufzeit des Beobachters in Minuten (hoechstens 170)", required: false, default: "170"}
      signierer: {description: "Signieradresse von C1 (leer: aus /api/status)", required: false, default: ""}
permissions:
  contents: read
concurrency:
  group: nachrechnen-beobachter
  cancel-in-progress: false
jobs:
  beobachten:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: aequitas
          POSTGRES_DB: aequitas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      C1: http://188.172.229.121:8080
      MINUTEN: ${{ inputs.minuten || '170' }}
    steps:
      - name: Fenster pruefen (liegt die naechste Verteilungsrunde in diesem Lauf?)
        id: fenster
        run: |
          set -u
          case "$MINUTEN" in ''|*[!0-9]*) echo "::error::minuten muss eine Zahl sein"; exit 1;; esac
          [ "$MINUTEN" -le 170 ] || { echo "::error::hoechstens 170 Minuten"; exit 1; }
          L=$(curl -sf -m 25 "$C1/api/debug/stateroot-components" | jq -r '.last_ubi_at // empty' || true)
          case "$L" in
            ''|*[!0-9]*)
              echo "::warning::last_ubi_at von C1 nicht lesbar ('$L') -- Lauf ohne Fensterpruefung"
              echo "laufen=1" >> "$GITHUB_OUTPUT"; echo "ubi_vorher=" >> "$GITHUB_OUTPUT"; exit 0;;
          esac
          JETZT=$(date +%s); NAECHSTE=$((L + 86400))
          echo "Letzte Runde auf C1: $(date -u -d "@$L" '+%F %H:%M') UTC, naechste etwa $(date -u -d "@$NAECHSTE" '+%F %H:%M') UTC"
          echo "ubi_vorher=$L" >> "$GITHUB_OUTPUT"
          # 15 Minuten Reserve fuer Snapshot und Nachspielen der Runde.
          if [ "$NAECHSTE" -gt $((JETZT + MINUTEN*60 - 900)) ]; then
            echo "::warning::Die naechste Verteilungsrunde liegt ausserhalb dieses Laufs -- ohne Aussage, beendet."
            echo "laufen=0" >> "$GITHUB_OUTPUT"
          else
            echo "laufen=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        if: steps.fenster.outputs.laufen == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: Binary bauen (cgo, wie das Docker-Image)
        if: steps.fenster.outputs.laufen == '1'
        run: CGO_ENABLED=1 go build -o aequitasd ./cmd/aequitasd/
      - name: Signieradresse von C1
        if: steps.fenster.outputs.laufen == '1'
        id: c1
        env:
          VORGABE: ${{ inputs.signierer }}
        run: |
          set -u
          s="${VORGABE:-}"
          if [ -z "$s" ]; then
            s=$(curl -sf -m 25 "$C1/api/status" | jq -r '.validator_address // empty' | tr 'A-F' 'a-f')
          fi
          if ! printf '%s' "$s" | grep -Eq '^0x[0-9a-f]{40}$'; then
            echo "::error::keine gueltige Signieradresse von C1 ($s)"; exit 1
          fi
          echo "C1 unterschreibt mit $s"
          # Liefert C1 Bloecke an einen Fremden? (Grundlage des Nachspielens)
          h=$(curl -sf -m 25 "$C1/api/status" | jq -r '.height // 0')
          code=$(curl -s -o bloecke.json -w '%{http_code}' -m 25 "$C1/api/blocks?min_height=$((h-5))&limit=5")
          echo "/api/blocks ab $((h-5)): HTTP $code, $(jq 'if type=="array" then length elif .blocks then (.blocks|length) else "?" end' bloecke.json 2>/dev/null) Bloecke"
          echo "signierer=$s" >> "$GITHUB_OUTPUT"
      - name: Beobachter starten und nachspielen lassen
        if: steps.fenster.outputs.laufen == '1'
        env:
          DATABASE_URL: postgres://postgres:aequitas@localhost:5432/aequitas?sslmode=disable
          PRIMARY_NODE_URLS: ${{ env.C1 }}
          PRIMARY_NODE_URL: ${{ env.C1 }}
          BOOTSTRAP_SNAPSHOT_URL: ${{ env.C1 }}/api/snapshot
          BOOTSTRAP_SIGNER: ${{ steps.c1.outputs.signierer }}
          # Geschlossene Produzentenliste wie bei jedem Betreiberknoten (K-1):
          # ohne sie kennt der frische Knoten C1 nicht als Erzeuger und haengt
          # keinen einzigen Block an (Lauf 2: "Unknown proposer").
          AUTHORIZED_VALIDATORS: ${{ steps.c1.outputs.signierer }}
          AEQUITAS_BEOBACHTER: "1"
          AEQUITAS_WAL_ENABLED: "1"
          AEQUITAS_WAL_PATH: /tmp/aequitas-wal/aequitas_transfers.wal
          GOMEMLIMIT: 10GiB
          PORT: "8080"
          UBI_VORHER: ${{ steps.fenster.outputs.ubi_vorher }}
        run: |
          set -u
          mkdir -p /tmp/aequitas-wal
          nohup ./aequitasd > node.log 2>&1 &
          PID=$!
          START=$(date +%s); ENDE=$((START + MINUTEN*60))
          sleep 30
          grep -E "BOOTSTRAP|Snapshot|snapshot|✗" node.log | head -20 || true
          RUNDE=0
          while [ "$(date +%s)" -lt "$ENDE" ]; do
            kill -0 $PID 2>/dev/null || { echo "::error::Knoten ist gestorben"; tail -80 node.log; exit 1; }
            H=$(curl -s -m 5 http://localhost:8080/api/status | jq -r '.height // "?"')
            S=$(curl -s -m 5 "$C1/api/status" | jq -r '.height // "?"')
            A=$(curl -s -m 5 http://localhost:8080/api/wirtschaft/regeln | jq -r '[.. | objects | select(has("nachrechnen")) | .nachrechnen][0].abweichungen // "?"')
            U=$(curl -s -m 5 http://localhost:8080/api/debug/stateroot-components | jq -r '.last_ubi_at // ""')
            echo "$(( $(date +%s) - START ))s  Beobachter $H  C1 $S  Abweichungen $A  letzte Runde $U"
            # Die Runde ist nachgespielt, sobald das eigene last_ubi_at ueber
            # dem von C1 beim Start liegt. Danach noch 5 Minuten (LP- und
            # Validatoren-Runde folgen), dann Schluss.
            if [ "$RUNDE" = 0 ] && [ -n "$UBI_VORHER" ] && [ -n "$U" ] && [ "$U" -gt "$UBI_VORHER" ] 2>/dev/null; then
              RUNDE=1
              echo "Verteilungsrunde nachgespielt -- noch 5 Minuten"
              N=$(( $(date +%s) + 300 )); [ "$N" -lt "$ENDE" ] && ENDE=$N
            fi
            sleep 60
          done
          echo "$RUNDE" > runde.txt
          # nachrechnen steht unter .unternehmen -- unabhaengig von der Stelle lesen.
          curl -s -m 20 http://localhost:8080/api/wirtschaft/regeln \
            | jq '[.. | objects | select(has("nachrechnen")) | .nachrechnen][0] // {}' > nachrechnen.json || true
          curl -s -m 20 http://localhost:8080/api/status > status.json || true
          kill $PID 2>/dev/null || true
          sleep 5
      - name: Ergebnis
        if: always()
        env:
          LAUFEN: ${{ steps.fenster.outputs.laufen }}
        run: |
          set -u
          if [ "$LAUFEN" != "1" ]; then
            {
              echo "## Nachrechnen beobachtet"
              echo
              echo "**Ohne Aussage:** die naechste Verteilungsrunde lag ausserhalb dieses Laufs (Schritt \"Fenster pruefen\")."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EIGENE=$(grep -cE "^\[Block #" node.log || true)
          GEPRUEFT=$(jq -r '.geprueft // 0' nachrechnen.json 2>/dev/null || echo 0)
          RUNDE=$(cat runde.txt 2>/dev/null || echo 0)
          {
            echo "## Nachrechnen beobachtet"
            echo
            echo "- Hoehe am Ende: $(jq -r '.height // "?"' status.json 2>/dev/null)"
            echo "- Modus: $(jq -r '.modus // "?"' nachrechnen.json 2>/dev/null)"
            echo "- geprueft: $(jq -r '.geprueft // "?"' nachrechnen.json 2>/dev/null), Abweichungen: $(jq -r '.abweichungen // "?"' nachrechnen.json 2>/dev/null)"
            echo "- eigene Bloecke (muss 0 sein): ${EIGENE:-0}"
            echo "- nachgespielte Bloecke: $(grep -cE '\[REPLAY\]' node.log || true) Zeilen, abgelehnt: $(grep -cE 'rolling back whole block' node.log || true)"
            echo "- Verteilungsrunde nachgespielt: $([ "$RUNDE" = 1 ] && echo ja || echo nein)"
            if [ "$GEPRUEFT" = 0 ] || [ "$RUNDE" != 1 ]; then
              echo
              echo "**Ohne Aussage:** keine Verteilungsrunde nachgespielt oder keine Transaktion nachgerechnet -- 0 Abweichungen heisst hier nichts."
            fi
            echo
            echo "| Regel | Abweichungen |"
            echo "|---|---|"
            jq -r '.je_regel // {} | to_entries[] | "| \(.key) | \(.value) |"' nachrechnen.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          echo "=== [NACHRECHNEN]-Zeilen (hoechstens 200) ==="
          grep -F "[NACHRECHNEN]" node.log | head -200 || true
          echo "=== Sync und DAG (erste 60, letzte 60) ==="
          grep -E "HTTP-SYNC|SYNC\]|\[DAG\]|CHECKPOINT|Checkpoint|orphan|Rejected|BOOTSTRAP|RESYNC" node.log | head -60 || true
          echo "..."
          grep -E "HTTP-SYNC|SYNC\]|\[DAG\]|CHECKPOINT|Checkpoint|orphan|Rejected|BOOTSTRAP|RESYNC" node.log | tail -60 || true
          echo "=== Fehler (letzte 40, ohne die Peer-Anmeldung) ==="
          grep -E "✗|panic|PANIC" node.log | grep -v "Registration with primary" | tail -40 || true
          echo "=== Log-Ende (80) ==="
          tail -80 node.log
          if [ "$GEPRUEFT" = 0 ] || [ "$RUNDE" != 1 ]; then
            echo "::warning::ohne Aussage -- keine Verteilungsrunde nachgespielt oder nichts nachgerechnet"
          fi
          if [ "${EIGENE:-0}" -gt 0 ]; then echo "::error::der Beobachter hat Bloecke erzeugt"; exit 1; fi
