name: C1 (netcup) -- Leistungsschalter setzen
# Setzt auf C1 die Schalter, die C2 seit August traegt (deploy/perf-c1-setzen.sh),
# startet nur den Knoten-Container neu und prueft danach: Schalter im
# Container, C1 nimmt an, Hoehe steigt. Freigegeben am 26.09.2026.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c1-knoten
  cancel-in-progress: false
jobs:
  setzen:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel und Host-Pruefung
        env:
          K1: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$K1" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); $_ = $d if $d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/; } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/c1 && chmod 600 ~/.ssh/c1
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/k1
          ssh-keygen -lf ~/.ssh/k1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA'
          cat ~/.ssh/k1 > ~/.ssh/known_hosts
      - name: Schalter setzen und Knoten neu starten
        run: ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 'bash -s' < deploy/perf-c1-setzen.sh
      - name: Hoehe steigt
        run: bash deploy/pruefe-knoten.sh https://aequitas.digital
      - name: Nachher -- C1
        run: ssh -i ~/.ssh/c1 -o BatchMode=yes root@188.172.229.121 'bash -s' < deploy/leistung-lesen.sh
