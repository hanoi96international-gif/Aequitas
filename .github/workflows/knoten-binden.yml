name: Knoten mit Wallet verbinden (QR-Code fuer C1)

# Neue Validatoren bekommen den QR-Code am Ende von
# deploy/validator/einrichten.sh. C1 wurde nicht mit dem Skript eingerichtet
# und hat deshalb nie einen gezeigt. Dieser Workflow macht denselben Schritt
# fuer C1 (deploy/knoten-binden.sh):
#
#   1. code    -- erzeugt den Bindungscode (aequitasapp://knoten-binden?...),
#                 als QR-Bild (Artefakt "qr-code") und als QR im Protokoll.
#   2. warten  -- bis zu 15 Minuten auf die Bestaetigung in der App
#                 ("Knoten" -> "Knoten binden (QR scannen)"), dann wird die
#                 Bindung auf C1 eingetragen und der Knoten neu gestartet
#                 (wenige Sekunden).
#
# Nichts davon ist geheim (Signieradresse, Wallet, zwei Signaturen -- stehen
# ohnehin oeffentlich beim Netz). Der Eintrag auf C1 holt die Bindung dort
# selbst ab und nimmt nur eine, die genau die eingegebene Wallet nennt.

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Leer lassen = die auf C1 eingetragene Betreiber-Wallet. Nur fuer eine ANDERE Wallet hier deren Adresse (0x..., 42 Zeichen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: knoten-binden-c1
  cancel-in-progress: false

env:
  C1: 188.172.229.121
  C1_HOSTKEY: SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA
  NETZ: https://aequitas.digital

jobs:
  code:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    outputs:
      adresse: ${{ steps.link.outputs.adresse }}
      wallet: ${{ steps.link.outputs.wallet }}
    steps:
      - uses: actions/checkout@v5
      - name: Eingabe pruefen
        id: eingabe
        env:
          W: ${{ inputs.wallet }}
        run: |
          set -euo pipefail
          W="$(printf '%s' "$W" | tr -d '[:space:]')"
          [ -z "$W" ] || [[ "$W" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::Das ist keine Wallet-Adresse (0x und 40 Zeichen 0-9/a-f)"; exit 1; }
          echo "wallet=$(printf '%s' "$W" | tr 'A-F' 'a-f')" >> "$GITHUB_OUTPUT"
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx "$C1_HOSTKEY" || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Bindungscode erzeugen
        id: link
        env:
          W: ${{ steps.eingabe.outputs.wallet }}
        run: |
          set -euo pipefail
          # Eingabe ist oben auf 0x + 40 Hex geprueft; das Skript prueft erneut.
          scp -q -o BatchMode=yes deploy/knoten-binden.sh root@$C1:/root/knoten-binden.sh
          AUS="$(ssh -o BatchMode=yes root@$C1 "PHASE=link WALLET='$W' bash /root/knoten-binden.sh")"
          printf '%s\n' "$AUS" | grep -v '^LINK='
          LINK="$(printf '%s\n' "$AUS" | sed -n 's/^LINK=//p')"
          ADR="$(printf '%s\n' "$AUS" | sed -n 's/^ADRESSE=//p')"
          [[ "$LINK" =~ ^aequitasapp://knoten-binden\?adresse=0x[0-9a-f]{40}\&wallet=0x[0-9a-f]{40}\&beweis=0x[0-9a-f]{130}$ ]] || { echo "::error::Kein gueltiger Bindungscode"; exit 1; }
          WJ="$(printf '%s\n' "$LINK" | sed -E 's/.*&wallet=(0x[0-9a-f]{40})&.*/\1/')"
          WEB="$NETZ/binden?${LINK#aequitasapp://knoten-binden?}"
          echo "adresse=$ADR" >> "$GITHUB_OUTPUT"
          echo "wallet=$WJ" >> "$GITHUB_OUTPUT"
          sudo apt-get install -y -qq qrencode >/dev/null
          mkdir -p qr
          qrencode -o qr/aequitas-knoten-binden.png -s 12 -m 4 "$LINK"
          echo
          echo "In der App: Knoten -> Knoten binden (QR scannen) -> diesen Code scannen:"
          qrencode -t utf8 -m 2 "$LINK"
          {
            echo "## Knoten C1 mit deiner Wallet verbinden"
            echo
            echo "**In der Aequitas-App unter *Knoten*** erscheint jetzt die Anfrage dieses Servers -- dort auf **Bestätigen** tippen."
            echo
            echo "Ersatzweise: Link [Knoten verbinden]($WEB) auf dem Handy mit der App öffnen, oder unter *Artifacts* \`qr-code\` mit der App scannen."
            echo
            echo "Dieser Lauf wartet bis zu 15 Minuten und trägt die Bindung dann auf C1 ein."
            echo
            echo "Signieradresse von C1: \`$ADR\` · Wallet: \`$WJ\`"
            echo
            echo "Code als Text:"
            echo
            echo '```'
            echo "$LINK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qr-code
          path: qr/aequitas-knoten-binden.png
          retention-days: 1

  warten:
    needs: code
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Auf die Bestaetigung in der App warten
        env:
          ADR: ${{ needs.code.outputs.adresse }}
          W: ${{ needs.code.outputs.wallet }}
        run: |
          set -euo pipefail
          [[ "$ADR" =~ ^0x[0-9a-f]{40}$ && "$W" =~ ^0x[0-9a-f]{40}$ ]] || { echo "::error::Eingaben fehlen"; exit 1; }
          for i in $(seq 1 180); do
            B="$(curl -fsS -m 10 "$NETZ/api/validator-binding?signing_address=$ADR" 2>/dev/null || true)"
            GEB="$(printf '%s' "$B" | jq -r '.human_wallet // empty' 2>/dev/null | tr 'A-F' 'a-f' || true)"
            if [ "$GEB" = "$W" ]; then echo "Bestaetigung aus der App ist angekommen."; exit 0; fi
            [ $((i % 12)) = 1 ] && echo "warte auf die Bestaetigung in der App ... ($(( (180 - i) * 5 / 60 )) min uebrig)"
            sleep 5
          done
          echo "::error::Keine Bestaetigung aus der App in 15 Minuten. Einfach noch einmal starten."
          exit 1
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx "$C1_HOSTKEY" || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Bindung auf C1 eintragen
        env:
          W: ${{ needs.code.outputs.wallet }}
        run: |
          set -euo pipefail
          [[ "$W" =~ ^0x[0-9a-f]{40}$ ]] || exit 1
          scp -q -o BatchMode=yes deploy/knoten-binden.sh root@$C1:/root/knoten-binden.sh
          ssh -o BatchMode=yes root@$C1 "PHASE=setzen WALLET=$W bash /root/knoten-binden.sh"
          echo "## Verbunden: C1 ist an deine Wallet gebunden." >> "$GITHUB_STEP_SUMMARY"
