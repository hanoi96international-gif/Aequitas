name: Biometrie- und Proof-Datenbanken sichern (verschluesselt)

# WARUM. backup-ledger.yml lagert den Zustand der Kette aus, aber absichtlich
# OHNE die Zeilen der biometrischen Tabellen -- das Repo ist oeffentlich, jedes
# Artefakt fuer jeden angemeldeten GitHub-Nutzer lesbar. Die Biometrie- und
# Proof-Datenbanken lagen damit nur auf C1 (docs/BETA_BEREITSCHAFT.md,
# Betreiber-Punkt 5).
#
# WAS DIESER WORKFLOW TUT. Auf C1 (deploy/backup-biometrie.sh): biometrische
# Tabellen der Kette, Proof-Server-Datenbank, SQLite des Coordinators und des
# Vergleichsdienstes konsistent kopieren, jede Kopie pruefen (Wiederherstellung
# bzw. PRAGMA integrity_check), alles AUF DER BOX mit age an einen
# oeffentlichen Schluessel verschluesseln und den Klartext loeschen. Hierher
# kommt nur die .age-Datei; sie wird 30 Tage als Artefakt gehalten.
#
# NUR DER OEFFENTLICHE SCHLUESSEL VERLAESST DEN BETREIBER. age1... (age-keygen,
# offline) wird einmal mit sicherung-einrichten.yml auf C1 hinterlegt. Der
# private Schluessel liegt nur beim Betreiber; ohne ihn ist das Artefakt
# Rauschen. Ist auf C1 keiner hinterlegt: rot, nichts hochgeladen.
# Einrichtung und Wiederherstellungsuebung: docs/BIOMETRIE_SICHERUNG.md.
#
# UMGEBUNG `sicherung` (24.10.2026), nicht `produktion`: mit Pflicht-Freigabe
# wartete der naechtliche Lauf auf einen Klick, und vergessen hiess keine
# Sicherung. Der Schluessel SICHERUNG_SSH_KEY kann auf C1 nur den erzwungenen
# Befehl deploy/sicherung/sicherung-befehl.sh ausfuehren -- kein Root-Zugang.
# Der age-Empfaenger liegt FEST AUF C1 (eingetragen mit
# sicherung-einrichten.yml, Umgebung produktion, mit Freigabe): wer diesen
# Schluessel stiehlt, kann sich die Daten nicht an seinen eigenen Schluessel
# verschluesseln lassen.

on:
  schedule:
    # 02:43 UTC: krumme Minute, vor backup-ledger (03:17), damit nicht zwei
    # Sicherungen zugleich auf dem Validator laufen.
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup-biometrie
  cancel-in-progress: false

# Nur lesen: dieser Workflow schreibt nichts ins Repo.
permissions:
  contents: read

jobs:
  sichern:
    runs-on: ubuntu-latest
    environment: sicherung
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy/backup-biometrie.sh
            deploy/sicherung/schluessel-lesen.sh
            deploy/sicherung/sicherung_ed25519.pub
          sparse-checkout-cone-mode: false

      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.SICHERUNG_SSH_KEY }}
          HOST: 188.172.229.121
          FP: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Liest den Schluessel auch ohne Zeilenumbrueche oder als eine
          # base64-Zeile und prueft ihn gegen den oeffentlichen im Repo.
          bash deploy/sicherung/schluessel-lesen.sh ~/.ssh/id_ed25519 deploy/sicherung/sicherung_ed25519.pub
          # Nur ed25519 und genau eine Zeile (Pruefung von #382, F1): sonst
          # reicht ein gefaelschter ecdsa-/rsa-Schluessel neben dem echten.
          ssh-keyscan -t ed25519 "$HOST" 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh_all
          [ "$(grep -c . ~/.ssh/kh_all)" = 1 ] || { echo "::error::Host-Schluessel von $HOST: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh_all | awk '{print $2}')" = "$FP" ] || { echo "::error::Host-Schluessel von $HOST passt nicht"; exit 1; }
          cp ~/.ssh/kh_all ~/.ssh/known_hosts

      - name: Empfaenger und installierte Fassung (fail-closed)
        # Ohne hinterlegten age-Empfaenger wird nichts gesichert und nichts
        # hochgeladen. Eine vom Repo abweichende Skriptfassung auf C1 ist nur
        # eine Warnung (sicherung-einrichten.yml bringt sie auf Stand).
        run: |
          set -euo pipefail
          STAND=$(ssh -o BatchMode=yes -o IdentitiesOnly=yes root@188.172.229.121 pruefsummen)
          if ! printf '%s\n' "$STAND" | grep -qx 'bio_empfaenger=gesetzt'; then
            echo "::error title=age-Empfaenger fehlt auf C1::Betreiber-Schritt: offline 'age-keygen -o bio-backup.key' ausfuehren, den privaten Schluessel offline verwahren und sicherung-einrichten.yml mit bio_empfaenger=age1... starten (docs/BIOMETRIE_SICHERUNG.md). Bis dahin wird nichts gesichert."
            exit 1
          fi
          IST=$(printf '%s\n' "$STAND" | awk '$2 == "backup-biometrie.sh" {print $1}')
          SOLL=$(sha256sum deploy/backup-biometrie.sh | awk '{print $1}')
          if [ "$IST" != "$SOLL" ]; then
            echo "::warning title=Sicherungsskript auf C1 veraltet::Installiert ${IST:-?}, im Repo $SOLL -- sicherung-einrichten.yml starten."
          else
            echo "backup-biometrie.sh auf C1 = Repo ($SOLL)"
          fi

      - name: Sichern, pruefen und verschluesseln auf C1
        timeout-minutes: 22
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes root@188.172.229.121 bio

      - name: Verschluesselte Datei abholen und pruefen
        timeout-minutes: 5
        run: |
          set -euo pipefail
          trap 'rm -f bio-c1.tar.age.tmp' EXIT
          ssh -o BatchMode=yes -o IdentitiesOnly=yes root@188.172.229.121 bio-datei > bio-c1.tar.age.tmp
          mv bio-c1.tar.age.tmp bio-c1.tar.age
          ssh -o BatchMode=yes -o IdentitiesOnly=yes root@188.172.229.121 bio-zusammenfassung > bio-c1.summary
          # Nie etwas anderes als age-Chiffrat hochladen.
          [ "$(head -c 21 bio-c1.tar.age)" = "age-encryption.org/v1" ] || { echo "::error::Abgeholte Datei ist keine age-Datei -- nichts hochgeladen."; rm -f bio-c1.tar.age; exit 1; }
          GROESSE=$(stat -c %s bio-c1.tar.age)
          if [ "$GROESSE" -gt $((500 * 1024 * 1024)) ]; then
            echo "::error::bio-c1.tar.age ist $GROESSE Bytes (> 500 MB) -- nichts hochgeladen."; rm -f bio-c1.tar.age; exit 1
          fi
          SOLL=$(grep -E '^age_sha256=' bio-c1.summary | cut -d= -f2)
          IST=$(sha256sum bio-c1.tar.age | awk '{print $1}')
          [ -n "$SOLL" ] && [ "$SOLL" = "$IST" ] || { echo "::error::Pruefsumme passt nicht zur Box -- nichts hochgeladen."; rm -f bio-c1.tar.age; exit 1; }
          echo "abgeholt: $GROESSE Bytes, sha256 $IST"

      - name: Zusammenfassung
        run: |
          {
            echo "### Biometrie-Sicherung C1 (age-verschluesselt)"
            echo ""
            echo '```'
            grep -E '^[a-z_0-9]+=' bio-c1.summary | head -20
            echo '```'
            echo ""
            echo "Artefakt: nur bio-c1.tar.age, 30 Tage. Entschluesseln nur mit dem offline verwahrten Schluessel (docs/BIOMETRIE_SICHERUNG.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Als Artefakt hochladen (nur .age)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: biometrie-c1-${{ github.run_id }}
          path: bio-c1.tar.age
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: SSH-Schluessel vom Runner entfernen
        if: always()
        run: rm -f ~/.ssh/id_ed25519
