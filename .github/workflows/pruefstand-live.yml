name: Pruefstand live (alles, was App und Menschen benutzen -- nur lesen)

# Die Wache prueft, ob die Boxen gesund sind. Dieser Pruefstand prueft, ob das
# funktioniert, was ein Mensch tatsaechlich benutzt -- von aussen, ueber
# dieselben Adressen wie die App, auf BEIDEN Knoten:
#
#   Kette      Status, Hoehe, Gleichstand, git-Commit, /api/wache, Divergenz
#   App-API    die parameterlosen Endpunkte, die die App aufruft
#   RPC        eth_chainId, eth_blockNumber
#   Tor        Contabo2 lehnt Ueberweisungen ab, Contabo1 nicht
#   Coordinator Gesundheit, Quorum, Widerspruchsfristen, /challenge, /widerspruch
#   Vergleich  /matching/health
#   Beweis     Proof-Server /health
#   APK        was die Knoten ausliefern == das neueste Release, Byte fuer Byte
#   Recht      /api/legal-status, /impressum, /datenschutz
#
# NUR LESEN. Das Tor wird mit einem wertlosen Platzhalter ("0x00") geprueft:
# es sitzt in sendRawTransaction VOR dem Einlesen der Parameter, also lehnt
# Contabo2 ab, bevor irgendetwas dekodiert wird, und Contabo1 scheitert am
# Dekodieren -- ohne Nonce, ohne Transaktion, ohne Zustandsaenderung. Der
# Widerspruch wird mit einer Kennung geprueft, die es nicht gibt ("unbekannt").
# /challenge legt einen Nonce im Arbeitsspeicher an, der nach 5 Minuten
# verfaellt -- dasselbe, was jedes Oeffnen der Aufnahme in der App tut.
#
# ROT faellt den Lauf. INFO ist, was bekannt offen ist und nur du schliessen
# kannst (Rechtstexte) -- steht da, aber faellt nicht.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pruefstand-live.yml"

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pruefen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ROT=0
          ok()   { printf '  \033[32mOK  \033[0m  %s\n' "$1"; }
          rot()  { printf '  \033[31mROT \033[0m  %s\n' "$1"; ROT=1; }
          info() { printf '  INFO  %s\n' "$1"; }
          # Nie mit Fehlercode zurueck: das Skript laeuft unter bash -e, und ein
          # einziger Timeout (am 24.09.2026: aequitas.digital nach dem Ende von
          # C1) brach den ganzen Pruefstand ab, bevor der Rest geprueft war.
          get()  { curl -s --max-time 20 "$@" || true; }
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@" || true; }
          jq_() { jq -r "$1" 2>/dev/null; }
          # Nie `.x // "fehlt"` fuer Wahrheitswerte: jq behandelt false wie null,
          # und genau false ist hier der gesunde Wert (abweichend=false,
          # C2 nimmt_an=false). Der erste Lauf fiel daran dreimal ROT.

          # DIE AKTIVEN KNOTEN: NAME=IP=PROOFHOST=NIMMT_AN. Genau einer nimmt
          # Ueberweisungen an (annahme_tor.go). Contabo1 (173.249.37.118, proof1)
          # ist seit dem 24.09.2026 abgeschaltet -- Abo nicht verlaengert, die
          # Kette startet vor dem Launch bei null. Seitdem nimmt C2 an. Ein neuer
          # zweiter Server kommt hier mit einer Zeile dazu (und in wache.yml).
          # Seit 26.09.2026: der neue C1 (netcup) ist Primary und nimmt an,
          # C2 ist nur_lesend.
          KNOTEN="C1=188.172.229.121=proof1=true C2=194.163.188.71=proof2=false"
          declare -A API RPC IP PH SOLLAN HOEHE COMMIT
          NAMEN=""
          for E in $KNOTEN; do
            IFS== read -r N I P A <<< "$E"
            NAMEN="$NAMEN $N"; IP[$N]=$I; PH[$N]=$P; SOLLAN[$N]=$A
            API[$N]=https://$P.aequitas.digital/api; RPC[$N]=https://$P.aequitas.digital/rpc
          done
          ANNEHMER=$(for N in $NAMEN; do [ "${SOLLAN[$N]}" = true ] && echo "$N"; done | wc -l)
          [ "$ANNEHMER" = 1 ] && ok "genau ein Knoten nimmt Ueberweisungen an" || rot "$ANNEHMER Knoten als annehmend eingetragen -- genau einer ist richtig"

          echo "===== Kette ====="
          for K in $NAMEN; do
            S=$(get "${API[$K]}/status")
            H=$(echo "$S" | jq_ '.height // empty'); G=$(echo "$S" | jq_ '.git_commit // empty')
            HOEHE[$K]=${H:-0}; COMMIT[$K]=${G:-?}
            if [ -n "$H" ]; then ok "$K ${API[$K]}/status: Hoehe $H, Commit ${G:-?}"; else rot "$K ${API[$K]}/status antwortet nicht: $(echo "$S" | head -c 120)"; fi
            W=$(code "http://${IP[$K]}:8080/api/wache")
            if [ "$W" = 200 ]; then ok "$K /api/wache 200"; else rot "$K /api/wache HTTP $W: $(get "http://${IP[$K]}:8080/api/wache" | head -c 600)"; fi
            HC=$(get "http://${IP[$K]}:8080/api/health/combined")
            DV=$(echo "$HC" | jq_ '.divergenz.abweichend | if . == null then "fehlt" else tostring end')
            [ "$DV" = false ] && ok "$K keine Kontostand-Abweichung" || rot "$K divergenz.abweichend=$DV"
            NA=$(echo "$HC" | jq_ '.annahme_tor.nimmt_an | if . == null then "fehlt" else tostring end')
            [ "$NA" = "${SOLLAN[$K]}" ] && ok "$K annahme_tor.nimmt_an=$NA (so gewollt)" || rot "$K annahme_tor.nimmt_an=$NA, erwartet ${SOLLAN[$K]}"
          done
          set -- $NAMEN
          if [ $# -lt 2 ]; then
            info "nur EIN Validator aktiv -- der zweite Server fehlt (Launch-Blocker)"
          else
            MIN=""; MAX=0
            for K in $NAMEN; do V=${HOEHE[$K]}; { [ -z "$MIN" ] || [ "$V" -lt "$MIN" ]; } && MIN=$V; [ "$V" -gt "$MAX" ] && MAX=$V; done
            [ $((MAX - MIN)) -le 20 ] && ok "alle gleichauf (Abstand $((MAX - MIN)))" || rot "Abstand der Hoehen $((MAX - MIN))"
            [ "$(for K in $NAMEN; do echo "${COMMIT[$K]}"; done | sort -u | wc -l)" = 1 ] && ok "alle auf demselben Commit" || rot "verschiedene Commits: $(for K in $NAMEN; do printf '%s=%s ' "$K" "${COMMIT[$K]}"; done)"
          fi

          echo "===== App-Endpunkte (jede Basis, wie App-Ausweichliste) ====="
          for K in $NAMEN; do
            for P in status pool price-history "blocks/canonical?limit=1"; do
              C=$(code "${API[$K]}/$P")
              [ "$C" = 200 ] && ok "$K /api/$P" || rot "$K /api/$P HTTP $C"
            done
          done

          echo "===== RPC ====="
          for K in $NAMEN; do
            CI=$(get -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "${RPC[$K]}" | jq_ '.result // empty')
            [ "$CI" = 0x786 ] && ok "$K eth_chainId 0x786" || rot "$K eth_chainId '$CI'"
            BN=$(get -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":2,"method":"eth_blockNumber","params":[]}' "${RPC[$K]}" | jq_ '.result // empty')
            [ -n "$BN" ] && ok "$K eth_blockNumber $BN" || rot "$K eth_blockNumber leer"
          done

          echo "===== Annahme-Tor (wertloser Platzhalter, keine Transaktion) ====="
          for K in $NAMEN; do
            T=$(get -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":3,"method":"eth_sendRawTransaction","params":["0x00"]}' "${RPC[$K]}")
            if [ "${SOLLAN[$K]}" = true ]; then
              if echo "$T" | grep -q 'nimmt keine Ueberweisungen an'; then rot "$K lehnt ALLES ab -- dann nimmt niemand an"; elif echo "$T" | grep -q '"error"'; then ok "$K laesst durch (scheitert erst am Platzhalter: $(echo "$T" | jq_ '.error.message' | head -c 60))"; else rot "$K unerwartete Antwort: $(echo "$T" | head -c 160)"; fi
            else
              echo "$T" | grep -q 'nimmt keine Ueberweisungen an' && ok "$K lehnt Ueberweisungen ab (Tor)" || rot "$K hat das Tor NICHT gezeigt: $(echo "$T" | head -c 160)"
            fi
          done

          echo "===== Coordinator, Vergleichsdienst, Proof-Server ====="
          for K in $NAMEN; do
            B="https://${PH[$K]}.aequitas.digital"
            CH=$(get "$B/coordinator/health")
            [ "$(echo "$CH" | jq_ '.status')" = ok ] && ok "${PH[$K]} Coordinator ok" || rot "${PH[$K]} Coordinator: $(echo "$CH" | head -c 120)"
            # Das Quorum muss ERREICHBAR sein, nicht nur konfiguriert: am
            # 24.09.2026 stand "Quorum 2 aus 2", waehrend einer der beiden
            # Vergleichsdienste mit C1 verschwunden war. Interne Adressen
            # (Docker-Namen) liegen auf derselben Box und gelten als erreichbar.
            Q=$(echo "$CH" | jq_ '.quorum_size'); VN=$(echo "$CH" | jq_ '.validator_urls | length')
            ERR=0
            for VU in $(echo "$CH" | jq_ '.validator_urls[]?'); do
              case "$VU" in
                https://*) [ "$(get "${VU%/}/health" | jq_ '.status // empty')" = ok ] && ERR=$((ERR+1)) || info "${PH[$K]}: Vergleichsdienst $VU antwortet nicht" ;;
                *) ERR=$((ERR+1)) ;;
              esac
            done
            [ "$ERR" -ge "${Q:-99}" ] 2>/dev/null && ok "${PH[$K]} Quorum $Q, erreichbar $ERR von $VN Vergleichsdiensten" || rot "${PH[$K]} Quorum $Q, aber nur $ERR von $VN Vergleichsdiensten erreichbar -- KEINE Registrierung moeglich"
            FR=$(echo "$CH" | jq_ '.widersprueche.fristen_tage.ohne_widerspruch // "fehlt"')
            [ "$FR" = 90 ] && ok "${PH[$K]} Widerspruchsfrist 90 Tage (Coordinator mit Loeschfrist laeuft)" || rot "${PH[$K]} widersprueche.fristen_tage fehlt ($FR) -- alter Coordinator?"
            WO=$(echo "$CH" | jq_ '.widersprueche.widersprueche_offen // 0')
            [ "$WO" = 0 ] && ok "${PH[$K]} keine offenen Widersprueche" || rot "${PH[$K]} $WO offene Widersprueche -- widersprueche-pruefen.yml"
            WN=$(echo "$CH" | jq_ '.warnungen | length')
            [ "$WN" = 0 ] && ok "${PH[$K]} keine Warnungen" || rot "${PH[$K]} Warnungen: $(echo "$CH" | jq_ '.warnungen | join(",")')"
            NC=$(get -X POST "$B/coordinator/challenge" | jq_ '.nonce // empty')
            [ -n "$NC" ] && ok "${PH[$K]} /challenge gibt einen Nonce (Einstieg der Registrierung)" || rot "${PH[$K]} /challenge ohne Nonce"
            WS=$(get -H 'Content-Type: application/json' -d '{"kennung":"W-0000000000000000","standpunkt":""}' "$B/coordinator/widerspruch" | jq_ '.status // empty')
            [ "$WS" = unbekannt ] && ok "${PH[$K]} /widerspruch antwortet (unbekannte Kennung -> unbekannt)" || rot "${PH[$K]} /widerspruch: '$WS'"
            MH=$(get "$B/matching/health" | jq_ '.status // empty')
            [ "$MH" = ok ] && ok "${PH[$K]} Vergleichsdienst ok" || rot "${PH[$K]} Vergleichsdienst '$MH'"
            PC=$(code "$B/health")
            [ "$PC" = 200 ] && ok "${PH[$K]} Proof-Server /health 200" || rot "${PH[$K]} Proof-Server HTTP $PC"
          done

          echo "===== APK: was ausgeliefert wird == neuestes Release ====="
          REL=$(gh api repos/hanoi96international-gif/Aequitas-App/releases/latest 2>/dev/null)
          TAG=$(echo "$REL" | jq_ '.tag_name'); SOLL=$(echo "$REL" | jq_ '.assets[] | select(.name=="app-release.apk") | .digest' | sed 's/^sha256://')
          echo "  neuestes Release: $TAG, sha256 ${SOLL:0:16}..."
          for Q in "https://aequitas.digital/download/app.apk" $(for K in $NAMEN; do echo "http://${IP[$K]}:8080/download/app.apk"; done); do
            IST=$( (curl -sL --max-time 300 "$Q" || true) | sha256sum | cut -d' ' -f1)
            [ -n "$SOLL" ] && [ "$IST" = "$SOLL" ] && ok "$Q == $TAG" || rot "$Q liefert ${IST:0:16}..., neuestes Release ($TAG) ist ${SOLL:0:16}..."
          done

          echo "===== Website und Rechtstexte ====="
          [ "$(code https://aequitas.digital/)" = 200 ] && ok "https://aequitas.digital/ 200" || rot "Startseite nicht 200"
          LS=$(get https://aequitas.digital/api/legal-status)
          FEHLT=$(echo "$LS" | jq_ '(.fehlende_angaben // []) | join(", ")')
          for P in impressum datenschutz; do
            C=$(code "https://aequitas.digital/$P")
            if [ "$C" = 200 ]; then ok "/$P 200"; else info "/$P HTTP $C -- offen, bis die Pflichtangaben gesetzt sind (rechtstexte-setzen.yml): ${FEHLT:-?}"; fi
          done

          echo "====="
          if [ "$ROT" = 1 ]; then echo "ROT"; exit 1; fi
          echo "ALLES GRUEN (INFO-Zeilen sind bekannte, offene Punkte)"
