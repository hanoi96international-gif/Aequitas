name: fdatasync-Latenz roh messen (Leerlauf oder unter Last)
on: {workflow_dispatch: {}}
jobs:
  m:
    strategy: {max-parallel: 2, matrix: {box: [{name: "C1", host: "173.249.37.118", secret: "C1"}, {name: "C2", host: "194.163.188.71", secret: "C2"}]}}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.box.host }}
          username: root
          key: ${{ matrix.box.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 300s
          command_timeout: 300s
          script: |
            set +e
            echo "##### ${{ matrix.box.name }} #####"
            A=$(curl -s --max-time 5 http://127.0.0.1:8080/api/health/combined | grep -oE '"aktuell":[0-9]+' | head -1 | cut -d: -f2)
            echo "inflight aktuell: ${A:-?}  (0 = Leerlauf)"
            # Dieselbe Form wie das Aequitas-WAL: vorbelegte Datei, kleine
            # Schreibvorgaenge an wachsendem Offset, fdatasync nach jedem.
            python3 - <<'PY'
            import os, time, ctypes, ctypes.util
            libc=ctypes.CDLL(ctypes.util.find_library('c'), use_errno=True)
            d='/root/aequitas-wal-data'
            def messen(name, vorbereiten, groesse=300):
                p=os.path.join(d,'.fsync-'+name.replace(' ','_'))
                fd=os.open(p, os.O_WRONLY|os.O_CREAT|os.O_TRUNC, 0o600)
                vorbereiten(fd)
                os.fsync(fd)
                lat=[]; off=0; t_end=time.time()+6
                block=b'x'*groesse
                while time.time()<t_end:
                    os.pwrite(fd, block, off); off+=groesse
                    t=time.perf_counter(); os.fdatasync(fd); lat.append((time.perf_counter()-t)*1e6)
                os.close(fd); os.unlink(p); lat.sort(); n=len(lat)
                print('  %-34s %5d/s | p50 %6.0f us | p90 %6.0f | p99 %6.0f | mittel %6.0f' % (name, n/6, lat[n//2], lat[int(n*.9)], lat[int(n*.99)], sum(lat)/n))
            SZ=64<<20
            # A: wie das WAL heute -- fallocate(0), unbeschriebene Extents
            messen('A fallocate(0), unbeschrieben', lambda fd: libc.fallocate(fd, 0, 0, SZ))
            # B: vorher mit Nullen BESCHRIEBEN -- Extents sind dann "written"
            def vornullen(fd):
                libc.fallocate(fd, 0, 0, SZ)
                z=bytes(1<<20)
                for i in range(64): os.pwrite(fd, z, i<<20)
            messen('B vorgenullt (Extents beschrieben)', vornullen)
            # C: nur ftruncate (duenn), wie die erste Sonde
            messen('C ftruncate, duenn', lambda fd: os.ftruncate(fd, SZ))
            # Wie das WAL wirklich schreibt: rund 14 KB je Batch (46 Datensaetze).
            messen('D fallocate(0), 16 KB je Sync', lambda fd: libc.fallocate(fd, 0, 0, SZ), 16384)
            messen('E vorgenullt, 16 KB je Sync', vornullen, 16384)
            PY
            echo "--- was die Platte gerade sonst tut (iostat 3 s) ---"
            iostat -dx 3 2 2>/dev/null | grep -E "^sda" | tail -1 | awk '{printf "  w/s=%s wkB/s=%s w_await=%sms f/s=%s f_await=%sms util=%s%%\n",$8,$9,$12,$21,$22,$23}'
