name: Speicher unter Ruhe pruefen
on: {workflow_dispatch: {}}
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  m:
    strategy: {matrix: {box: [{name: "C1", host: "alter-c1-abgeschaltet.invalid", secret: "C1"}, {name: "C2", host: "alter-c2-abgeschaltet.invalid", secret: "C2"}]}}
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ matrix.box.host }}
          username: root
          key: ${{ matrix.box.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          timeout: 200s
          command_timeout: 200s
          script: |
            set +e
            echo "##### ${{ matrix.box.name }} #####"
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(GOMEMLIMIT|GOGC|AEQUITAS_RPC_MAX_INFLIGHT)=' || echo "(keine)"
            free -m | head -2
            docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}}' | head -4
            echo "--- Kernel-OOM in dmesg? ---"
            dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill' | tail -4 || echo "(keine)"
            docker inspect aequitas-node --format 'Neustarts: {{.RestartCount}}  OOMKilled: {{.State.OOMKilled}}  ExitCode: {{.State.ExitCode}}'
