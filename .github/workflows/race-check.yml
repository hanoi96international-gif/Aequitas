name: Race detector on the WAL and keeper packages

# The dev machine has no gcc, so `go test -race` cannot run there -- the same
# limitation that once blocked measuring cgo signature verification locally.
# The runners do have it, so concurrency changes get checked here.
#
# Worth its own workflow rather than folding into the deploy's test job: -race
# makes tests several times slower, and a deploy should not pay that on every
# push. This runs when the WAL or the transfer path changes, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "x/humanity/wal/**"
      - "x/humanity/keeper/transfer_wal.go"
      - "x/humanity/keeper/transfer_batch_concurrent.go"
      - "x/humanity/keeper/sharded_accounts.go"
      - ".github/workflows/race-check.yml"
  workflow_dispatch: {}

# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -timeout 30m -count=1 ./x/humanity/wal/ ./x/humanity/keeper/
