name: CI

# FIX (Monster Audit 2026-07-12, P1): no CI ran at all before this — a red
# build could sit unnoticed on any branch until (or unless) it happened to
# also be the commit pushed to main/master. This runs the same checks on
# every push and PR, independent of deploy-contabo.yml's own gating job.
on:
  push:
    branches-ignore: [master, main]
  pull_request:

jobs:
  # A step that forwards a variable over SSH which nothing ever sets fails on
  # the live node, not here -- see scripts/lint_workflow_envs.py for the two
  # dispatches that motivated this. Its own job so it reports in seconds
  # rather than behind the Go and hardhat suites.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 scripts/lint_workflow_envs.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/aequitasd
      - run: go vet ./...
      # FIX (Audit 2026-08-18): CI checked vet but never gofmt, and twenty
      # files had drifted — including api.go, evm_engine.go, swap.go,
      # snapshot.go and slashing.go. Failing loudly with the diff is cheaper
      # than a reviewer noticing formatting noise inside a real change.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v node_modules || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "--- diff ---"
            gofmt -d $unformatted
            exit 1
          fi
          echo "✓ gofmt clean"
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test

  # FIX (Audit 2026-08-18): every one of the 740 Go tests built its state with
  # newTestState(), i.e. useDB:false. The entire Postgres-backed half — the
  # atomic outbox, optimistic locking, loadFromDB, rebuildStateAccumulators,
  # snapshot import, the WAL fast path — was exercised only by tests that
  # skip themselves unless an operator hands them a DATABASE_URL by hand, and
  # nothing in CI ever did. Coverage read 30.4% and the uncovered majority was
  # precisely the code that touches real money in production.
  #
  # This is not hypothetical. The parallel-replay attempt reverted in 41b1eee
  # shipped a Postgres wire-protocol desync to a live validator and cost two
  # consensus blocks. TestReplayTransactions_ParallelTransfers_RealDB — which
  # exists, in this repository — had already found it. Its result was
  # misread, because it was not part of any run anybody looked at.
  #
  # A Postgres service container costs seconds and makes those tests part of
  # every push. Scoped to the _RealDB set by name so the TPS/WAL benchmarks
  # that share the same opt-in flag stay out of the ordinary CI path.
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aequitas_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aequitas_ci?sslmode=disable"
      AEQUITAS_TPS_BENCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run the Postgres-backed tests
        run: |
          set -euo pipefail

          # Each group gets its OWN database. These tests share state through
          # the DB and clean up by TRUNCATE, so several of them pass alone and
          # fail when run together — TestTransferConcurrent_*RingConserveBalance
          # is the clearest pair. That is a test-isolation gap, not a code
          # defect (verified: green in isolation, on this commit and on main),
          # and giving each group a fresh database keeps this job honest until
          # the isolation itself is fixed.
          run_group() {
            local name="$1"; shift
            local db="aeq_ci_${name}"
            psql "$ADMIN_URL" -c "DROP DATABASE IF EXISTS ${db};" >/dev/null
            psql "$ADMIN_URL" -c "CREATE DATABASE ${db};" >/dev/null
            echo "::group::${name}"
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/${db}?sslmode=disable" \
              go test ./x/humanity/keeper/ -run "$1" -v -timeout 10m 2>&1 | tee "out_${name}.txt"
            echo "::endgroup::"
            # A group where everything skipped is a green tick that proves
            # nothing — the exact failure mode this job exists to end.
            if ! grep -qE '^--- PASS' "out_${name}.txt"; then
              echo "No test in group '${name}' actually executed — the gate or the filter is wrong."
              exit 1
            fi
          }

          run_group realdb   '_RealDB$|RealDB$'
          run_group transfer 'TestTransferConcurrent|TestTransferAtomic|TestProcessTransferBatchConcurrent'
          run_group wal      'TestWAL|TestTransferWAL'
          run_group plumbing 'TestPoolFlush|TestPendingTxs|TestEvmMirrorFlush'
          run_group mpcstore 'TestSharesSurvive|TestCandidatesAreScoped|TestDeletionIsHonoured|TestRewritingAnEnrolment'
        env:
          ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

  # The race detector, on its own job so it reports independently of the
  # ordinary suite (it roughly triples runtime, and a data race is a different
  # class of failure from a logic bug).
  #
  # SCALING_ARCHITECTURE.md's own test strategy calls `-race` non-negotiable
  # for the concurrency work, and the reverted parallel-replay attempt
  # (41b1eee) is what happens without it: workers sharing one *sql.Tx got
  # through review and only announced themselves in production, as a Postgres
  # wire-protocol desync that cost two consensus blocks. `-race` requires cgo,
  # which the Windows dev host does not have — so this runner is the only
  # place it can run at all.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./x/humanity/...

  # FIX (2026-07-26): nothing in CI ever built the Dockerfile. `go build` above
  # runs on ubuntu-latest with the runner's own toolchain — it says nothing
  # about whether the IMAGE builds. The image is only ever built by deploy.sh /
  # deploy_safe_c2.sh, i.e. ON A PRODUCTION NODE during a deploy, so a broken
  # Dockerfile is discovered there and takes the deploy (and possibly the node)
  # with it.
  #
  # This was not hypothetical: the cgo change that makes go-ethereum use
  # libsecp256k1 instead of its pure-Go fallback (269us -> 106us per signature
  # recovery, measured on Contabo1) had to sit unmerged precisely because there
  # was no safe way to prove the Alpine build still worked. Verifying it by
  # hand on a live validator — which is what I started to do — takes CPU from
  # the node whose latency is under investigation.
  #
  # Builds the real multi-stage Dockerfile and then asserts the property the
  # cgo change exists for: the binary must be DYNAMICALLY linked. A static
  # binary means cgo was disabled and go-ethereum silently fell back to the
  # slow signature path — exactly the regression this guards against, and one
  # no Go-level test can see.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image
        run: docker build -t aequitas-node:ci .
      - name: Assert the binary is cgo-linked (fast secp256k1 path)
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh aequitas-node:ci -c 'ldd /app/aequitasd' >/dev/null 2>&1; then
            echo "✓ aequitasd is dynamically linked — cgo is active, go-ethereum uses libsecp256k1"
          else
            echo "✗ aequitasd is statically linked: cgo was NOT enabled for this build."
            echo "  go-ethereum then falls back to crypto/signature_nocgo.go (pure-Go btcec),"
            echo "  which measured 269us per recovery on Contabo1 versus 106us with cgo —"
            echo "  13.5 cores instead of 5.3 at the 50k TPS target. See the Dockerfile comment."
            exit 1
          fi
