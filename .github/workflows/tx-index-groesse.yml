name: Wie gross ist chain_tx_block_index wirklich? (read-only)

# Die neue Begrenzung meldet 0 MB lebend, das Launch-Gate-Audit mass am
# 09.09.2026 aber 13 GB fuer dieselbe Tabelle. Eine der beiden Zahlen ist
# falsch -- und eine Begrenzung, die zu klein misst, greift nie.

on:
  workflow_dispatch: {}

jobs:
  messen:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script_stop: false
          timeout: 240s
          command_timeout: 240s
          script: |
            echo "===== physische Groesse ====="
            docker exec aequitas-postgres psql -U postgres -d aequitas -t -c "
              SELECT relname || ': ' || pg_size_pretty(pg_total_relation_size(relid)) || ' gesamt, '
                     || pg_size_pretty(pg_relation_size(relid)) || ' Daten'
              FROM pg_stat_user_tables WHERE relname='chain_tx_block_index';" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo "===== Zeilen ====="
            docker exec aequitas-postgres psql -U postgres -d aequitas -t -c "
              SELECT 'Zeilen: ' || count(*)::text FROM chain_tx_block_index;" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo "===== was meine Abfrage misst ====="
            docker exec aequitas-postgres psql -U postgres -d aequitas -t -c "
              SELECT 'Summe pg_column_size: ' || COALESCE(sum(pg_column_size(tx_hash) + pg_column_size(block_hash) + 16),0)::text || ' Bytes'
              FROM chain_tx_block_index;" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo "===== Spalten ====="
            docker exec aequitas-postgres psql -U postgres -d aequitas -t -c "
              SELECT string_agg(column_name || ' ' || data_type, ', ')
              FROM information_schema.columns WHERE table_name='chain_tx_block_index';" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo "===== die groessten Tabellen insgesamt ====="
            docker exec aequitas-postgres psql -U postgres -d aequitas -t -c "
              SELECT relname || ': ' || pg_size_pretty(pg_total_relation_size(relid))
              FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 8;" 2>&1 | sed 's/^ *//' | grep -v '^$'
