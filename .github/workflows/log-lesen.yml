name: Knoten-Log durchsuchen (C1)
# Liest `docker logs` eines Containers auf C1 und filtert nach einem Muster.
# Adressen (0x + 40 Hex) und lange Hex-Werte (Hashes) werden geschwaerzt:
# die Logs dieses Repos sind oeffentlich.
# Nur lesen. Gedacht fuer Fragen wie "was geschah bei der Registrierung um
# 13:50" -- ohne SSH von Hand.
on:
  workflow_dispatch:
    inputs:
      muster: {description: "grep -E Muster", required: true}
      seit: {description: "docker logs --since (z.B. 2h, 30m)", required: false, default: "2h"}
      zeilen: {description: "letzte N Treffer", required: false, default: "60"}
      container: {description: "aequitas-node | aequitas-matching | aequitas-coordinator", required: false, default: "aequitas-node"}
permissions:
  contents: read
jobs:
  l:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    env:
      C1: 188.172.229.121
    steps:
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); $_ = $d if $d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/; } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 $C1 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA' || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Lesen
        env:
          MUSTER: ${{ inputs.muster }}
          SEIT: ${{ inputs.seit }}
          ZEILEN: ${{ inputs.zeilen }}
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail
          case "$CONTAINER" in aequitas-node|aequitas-matching|aequitas-coordinator) ;; *) echo "::error::Container unzulaessig"; exit 1 ;; esac
          [[ "$SEIT" =~ ^[0-9]+[smh]$ ]] && [[ "$ZEILEN" =~ ^[0-9]{1,4}$ ]] || { echo "::error::Parameter unzulaessig"; exit 1; }
          # Muster per Base64, damit kein Zeichen darin die entfernte Shell erreicht.
          M64="$(printf '%s' "$MUSTER" | base64 -w0)"
          ssh -o BatchMode=yes root@$C1 "M=\$(printf '%s' '$M64' | base64 -d); echo \"##### C1 $CONTAINER: '\$M' seit $SEIT #####\"; docker logs --since '$SEIT' --timestamps '$CONTAINER' 2>&1 | grep -E -- \"\$M\" | tail -n '$ZEILEN' | cut -c1-500 | grep -viE 'private_key|secret|passw|token=' | sed -E 's/0x[0-9a-fA-F]{64}([^0-9a-fA-F]|$)/0x<geschwaerzt>\1/g; s/CAES[A-Za-z0-9+\/]{40,}=*/<geschwaerzt>/g; s/0x[0-9a-fA-F]{40}/0x<adresse>/g; s/[0-9a-fA-F]{32,}/<hash>/g' ; echo \"treffer gesamt: \$(docker logs --since '$SEIT' '$CONTAINER' 2>&1 | grep -cE -- \"\$M\")\""
          echo "Kette: $(curl -s -m 10 http://$C1:8080/api/status | jq -c '{height, total_humans, git_commit}')"
