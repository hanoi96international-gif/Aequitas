name: Generatorlog C2 (read-only)

# Der Bericht des Stabilitaetslaufs lief in einen 10-Minuten-Timeout, weil er
# nach dem Generatorlog noch "docker logs --since 15m" aufruft -- auf einem
# Container, der unter Last riesige Logs schreibt. Dieser Workflow holt NUR
# das Generatorlog und den Buildstand, ohne docker logs anzufassen.

on:
  workflow_dispatch:
    inputs:
      zeilen:
        default: "60"

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 180s
          command_timeout: 180s
          script: |
            # Jeder Befehl mit hartem Zeitlimit: am 06.09. hing ein blosses
            # "tail" 180 s und riss die gesamte Diagnose mit, obwohl die Box
            # im Leerlauf war und 24 GB frei hatte. Ein Aufruf darf die
            # anderen nicht mehr verschlucken.
            echo "===== Groesse des Generatorlogs ====="
            timeout 15 ls -la /tmp/stability.log 2>&1 || echo "(ls lief in sein Zeitlimit oder die Datei fehlt)"
            timeout 15 stat -c '%s Bytes, zuletzt geaendert %y' /tmp/stability.log 2>&1 || echo "(stat fehlgeschlagen)"
            echo
            echo "===== laeuft noch ein Generator? ====="
            timeout 15 docker ps --format '{{.Names}} {{.Image}} {{.Status}}' 2>&1 | head -8 || echo "(docker ps haengt)"
            echo
            echo "===== erste 40 Zeilen (head statt tail -- head muss nicht ans Dateiende springen) ====="
            timeout 30 head -40 /tmp/stability.log 2>&1 || echo "(head lief in sein Zeitlimit)"
            echo
            echo "===== die Zusammenfassungszeilen ====="
            timeout 45 grep -aE 'PHASE|elapsed|TPS|KETTEN|Bloecke ueber|Last verteilt|Mittel' /tmp/stability.log 2>&1 | head -25 || echo "(grep lief in sein Zeitlimit)"
            echo
            echo "===== hat der Generator die Mehrziel-Fassung? ====="
            timeout 15 grep -c "Last verteilt auf" /root/contabo-loadtest/main.go 2>&1 || echo "0 = alte Fassung"
            timeout 15 ls -la /root/contabo-loadtest/loadtest 2>&1 || echo "(keine Binary)"
            echo
            echo "===== erreicht C2 den RPC von C1? ====="
            timeout 20 curl -s -m 8 -o /dev/null -w "  C1 /api/status -> HTTP %{http_code} in %{time_total}s" http://173.249.37.118:8080/api/status || echo "  (C1 nicht erreichbar von C2)"
            echo
