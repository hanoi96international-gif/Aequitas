name: Sicherungsschluessel auf C1 einrichten

# Richtet auf C1 den beschraenkten Sicherungsschluessel ein und bringt die
# installierten Sicherungsskripte auf den Stand des Repos
# (deploy/sicherung/einrichten.sh). Danach laufen backup-ledger.yml und
# backup-biometrie-verschluesselt.yml in der Umgebung `sicherung` ohne
# Freigabe-Halt -- mit einem Schluessel, der auf C1 nur den erzwungenen Befehl
# deploy/sicherung/sicherung-befehl.sh ausfuehren darf.
#
# Erneut starten, sobald sich deploy/backup-ledger.sh,
# deploy/backup-biometrie.sh oder deploy/sicherung/* aendern; die
# Sicherungs-Workflows warnen, wenn C1 eine andere Fassung hat.
#
# bio_empfaenger: der OEFFENTLICHE age-Schluessel (age1...), an den die
# Biometrie-Sicherung auf C1 verschluesselt wird. Leer lassen, um einen schon
# hinterlegten zu behalten. Nie den privaten Schluessel (AGE-SECRET-KEY-...).

on:
  workflow_dispatch:
    inputs:
      bio_empfaenger:
        description: "Oeffentlicher age-Schluessel (age1..., 62 Zeichen) -- leer = unveraendert"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sicherung-einrichten
  cancel-in-progress: false

jobs:
  einrichten:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    env:
      C1: 188.172.229.121
    steps:
      - name: Eingabe pruefen
        env:
          R: ${{ inputs.bio_empfaenger }}
        run: |
          set -eu
          if [ -n "$R" ]; then
            REST="${R#age1}"
            if [ "$REST" = "$R" ] || [ "${#R}" -ne 62 ] || case "$REST" in *[!qpzry9x8gf2tvdw0s3jn54khce6mua7l]*) true ;; *) false ;; esac; then
              echo "::error::bio_empfaenger ist kein oeffentlicher age-Schluessel (age1..., 62 Zeichen). Nichts geaendert."
              exit 1
            fi
            echo "age-Empfaenger: gueltig"
          else
            echo "age-Empfaenger: unveraendert"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy/backup-ledger.sh
            deploy/backup-biometrie.sh
            deploy/sicherung
          sparse-checkout-cone-mode: false

      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          FP: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$C1" 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh_all
          [ "$(grep -c . ~/.ssh/kh_all)" = 1 ] || { echo "::error::Host-Schluessel von C1: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh_all | awk '{print $2}')" = "$FP" ] || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh_all ~/.ssh/known_hosts

      - name: Einrichten auf C1
        env:
          R: ${{ inputs.bio_empfaenger }}
        run: |
          set -euo pipefail
          ZIEL="/root/sicherung-neu.${{ github.run_id }}"
          ssh -o BatchMode=yes root@$C1 "rm -rf '$ZIEL' && mkdir -m 700 '$ZIEL'"
          scp -o BatchMode=yes deploy/backup-ledger.sh deploy/backup-biometrie.sh \
            deploy/sicherung/sicherung-befehl.sh deploy/sicherung/einrichten.sh \
            deploy/sicherung/sicherung_ed25519.pub "root@$C1:$ZIEL/"
          # Wert als export-Zeile ueber stdin, nicht auf die Befehlszeile der Box.
          {
            printf 'export BIO_EMPFAENGER=%q\n' "$R"
            printf 'trap %q EXIT\n' "rm -rf '$ZIEL'"
            printf 'bash %q %q\n' "$ZIEL/einrichten.sh" "$ZIEL"
          } | ssh -o BatchMode=yes root@$C1 'bash -s'

      - name: SSH-Schluessel vom Runner entfernen
        if: always()
        run: rm -f ~/.ssh/id_ed25519
