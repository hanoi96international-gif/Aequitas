name: C2 Startlog (read-only)

# C2 meldet nach einem Neustart minutenlang Hoehe 0 und schreibt dabei keine
# einzige Logzeile in ein --since-Fenster. Die Startmeldungen liegen dann
# ausserhalb davon: dieser Workflow holt den Anfang und das Ende des Logs
# ohne Zeitfilter.

on:
  workflow_dispatch: {}

# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: alter-c2-abgeschaltet.invalid
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          timeout: 240s
          command_timeout: 240s
          script: |
            echo "===== Containerzustand ====="
            timeout 20 docker inspect aequitas-node --format 'Status={{.State.Status}} Restarts={{.RestartCount}} Start={{.State.StartedAt}}'
            echo
            echo "===== die letzten 30 Logzeilen (ohne Zeitfilter) ====="
            timeout 60 docker logs --tail 30 aequitas-node 2>&1 | cut -c1-220
            echo
            echo "===== Datenbank erreichbar? ====="
            timeout 20 docker exec aequitas-postgres pg_isready -U postgres || echo "  DATENBANK ANTWORTET NICHT"
            echo
            echo "===== Platte ====="
            df -h / | tail -1
