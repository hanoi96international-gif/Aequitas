name: DB-Zeitgrenzen pruefen (read-only)

# C1 fror am 07.09.2026 zehn Minuten ein: keine Logzeile, keine Hoehe, kein
# Absturz. state.go beschreibt genau dieses Bild aus einem Vorfall vom
# 30.06.2026 -- eine haengende Abfrage unter dag.mu friert den ganzen Knoten
# ein, "with zero log output and no timeout to ever break the wait". Der Fix
# damals war statement_timeout=30000 in der Verbindungszeichenfolge.
#
# 30 Sekunden sind fuer einen Aufruf UNTER der exklusiven Sperre trotzdem
# lang, und der Wert wird nur angehaengt, wenn er nicht schon dasteht. Was
# der Prozess wirklich benutzt, steht nur in der Datenbank selbst.

on:
  workflow_dispatch:
    inputs:
      box:
        required: true
        default: contabo1
        type: choice
        options: [contabo1, contabo2]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.box == 'contabo1' && '173.249.37.118' || '194.163.188.71' }}
          username: root
          key: ${{ inputs.box == 'contabo1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 200s
          command_timeout: 200s
          script: |
            echo "===== was steht in der Verbindungszeichenfolge? ====="
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -iE "^(DATABASE_URL|POSTGRES|DB_)" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#' | cut -c1-200
            echo
            echo "===== was die laufenden Verbindungen wirklich benutzen ====="
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT DISTINCT 'statement_timeout=' || setting FROM pg_settings WHERE name='statement_timeout';" 2>&1 | sed 's/^ *//' | grep -v '^$'
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT 'aktive Verbindungen der App: ' || count(*)::text FROM pg_stat_activity WHERE application_name <> '' OR usename='postgres';" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo "  -- pro Verbindung, wie sie sie selbst gesetzt hat --"
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT pid || ': ' || COALESCE(state,'?') || '  ' || left(COALESCE(query,''), 60)
              FROM pg_stat_activity WHERE datname='aequitas' ORDER BY state_change LIMIT 8;" 2>&1 | sed 's/^ *//' | grep -v '^$'
            echo
            echo "===== haengen gerade Abfragen? ====="
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT 'laeuft seit ' || (now()-query_start)::text || ': ' || left(query,80)
              FROM pg_stat_activity
              WHERE state='active' AND now()-query_start > interval '5 seconds'
              ORDER BY query_start LIMIT 5;" 2>&1 | sed 's/^ *//' | grep -v '^$' || echo "  (keine)"
            echo
            echo "===== Sperren, die andere blockieren ====="
            docker exec aequitas-postgres psql -U postgres -t -c "
              SELECT 'pid ' || pid || ' wartet auf ' || COALESCE(pg_blocking_pids(pid)::text,'-')
              FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0 LIMIT 5;" 2>&1 | sed 's/^ *//' | grep -v '^$' || echo "  (keine)"
