name: Blockproduzenten festlegen -- AUTHORIZED_VALIDATORS (Blocker 18, Audit K-1)

# Setzt AUTHORIZED_VALIDATORS auf C1 auf GENAU die Signieradresse von C1
# (C2 ist seit dem 03.10.2026 abgeschaltet, seine IP neu vergeben; ein neuer
# zweiter Server kommt hier mit seiner Adresse dazu). Seit #228 ist die Liste abschliessend: ein selbst
# eingetragener oder von Peers gemeldeter Schluessel wird kein
# Blockproduzent mehr. Die Adressen kommen aus /api/status der Knoten selbst
# (Feld validator_address) -- oeffentlich, keine Geheimnisse. Nicht
# /api/signing-address: das verlangt SNAPSHOT_TOKEN und eine Wallet.
#
# Nach dem Setzen wird geprueft, dass C1 antwortet und die Hoehe steigt.
# Rueckweg: Zeile AUTHORIZED_VALIDATORS in der
# jeweiligen env-Datei loeschen (Sicherung .bak-* liegt daneben) und neu
# starten -- ohne Liste gilt das alte Verhalten.
on:
  workflow_dispatch:
    inputs:
      schreiben:
        description: "Setzen und neu starten (sonst nur anzeigen)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  adressen:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.a.outputs.liste }}
    steps:
      - id: a
        name: Signieradresse von C1
        run: |
          set -euo pipefail
          c1=$(curl -sf -m 25 http://188.172.229.121:8080/api/status | jq -r '.validator_address // empty' | tr 'A-F' 'a-f')
          echo "C1: $c1"
          [[ "$c1" =~ ^0x[0-9a-f]{40}$ ]] || { echo "::error::Signieradresse nicht lesbar: '$c1'"; exit 1; }
          echo "liste=$c1" >> "$GITHUB_OUTPUT"

  c1:
    needs: adressen
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA' || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: C1 setzen
        env:
          LISTE: ${{ needs.adressen.outputs.liste }}
          SCHREIBEN: ${{ inputs.schreiben }}
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@188.172.229.121 "LISTE='$LISTE' SCHREIBEN='$SCHREIBEN' bash -s" <<'SKRIPT'
          set -euo pipefail
          cd /root/Aequitas/deploy/validator
          ist=$(docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^AUTHORIZED_VALIDATORS=' | cut -d= -f2- || true)
          echo "C1 bisher: AUTHORIZED_VALIDATORS=${ist:-<leer>}"
          echo "C1 neu:    AUTHORIZED_VALIDATORS=$LISTE"
          [ "$SCHREIBEN" = "true" ] || { echo "nur angezeigt"; exit 0; }
          [ "$ist" = "$LISTE" ] && { echo "schon gesetzt"; exit 0; }
          grep -qx 'ANNAHME_ROLLE=annehmend' .env || { echo "ABBRUCH: ANNAHME_ROLLE=annehmend fehlt in .env"; exit 1; }
          cp -a .env ".env.bak-produzenten-$(date +%s)"
          if grep -q '^AUTHORIZED_VALIDATORS=' .env; then sed -i "s|^AUTHORIZED_VALIDATORS=.*|AUTHORIZED_VALIDATORS=$LISTE|" .env; else printf 'AUTHORIZED_VALIDATORS=%s\n' "$LISTE" >> .env; fi
          docker compose up -d --no-deps node
          neu=$(docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^AUTHORIZED_VALIDATORS=' | cut -d= -f2- || true)
          [ "$neu" = "$LISTE" ] || { echo "FEHLER: im Prozess steht '$neu'"; exit 1; }
          echo "C1 gesetzt"
          SKRIPT
      - name: C1 lebt und die Hoehe steigt
        if: ${{ inputs.schreiben }}
        run: bash deploy/pruefe-knoten.sh http://188.172.229.121:8080
      - name: C1 meldet produzenten_geschlossen
        if: ${{ inputs.schreiben }}
        run: |
          echo "C1: $(curl -s -m 10 http://188.172.229.121:8080/api/status | jq -c '{height, produzenten_geschlossen}')"
