name: Quick df -h check (manual, read-only)

# Fast parallel read-only disk usage check, safe to run alongside
# recover-contabo1.yml's own long-running cleanup+restart script (a plain
# `df -h` read does not conflict with concurrent docker operations).
on:
  workflow_dispatch: {}

# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  contabo1:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - name: df -h on Contabo1
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: alter-c1-abgeschaltet.invalid
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script_stop: true
          timeout: 30s
          command_timeout: 30s
          script: |
            df -h /
            echo "=== docker system df ==="
            docker system df
