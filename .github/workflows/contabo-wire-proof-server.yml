name: Wire node env (peers + proof server)

# Repairs the two things the Railway decommission left broken ON the boxes.
# Both are pure container-env problems; no code change can fix them, which is
# why this workflow exists.
#
# 1. PEERING. Both validators report {"peers":null} — they do not know each
#    other. Their PRIMARY_NODE_URL still points at https://aequitas.digital,
#    which Railway served and which now answers 404. The code-level default
#    seed list (defaultPublicSeeds, sync_blocks.go) cannot help here: it only
#    applies when PRIMARY_NODE_URL is UNSET, and on these boxes it is set — to
#    a dead host. Repointed at the other box by IP.
#
# 2. PROOF SERVER. The proof server already runs on BOTH boxes (container
#    "proof-server", 4 weeks uptime, 3000/tcp inside docker), but the node
#    carries no PROOF_SERVER_URLS and no CHAIN_SERVICE_TOKEN — so /api/prove*
#    answers 503 and registering a new human is impossible. Wired up here.
#
# SAFETY — the node's entire configuration exists only inside the running
# container, so this reads it back with `docker inspect` and re-applies it
# verbatim (the approach deploy_safe_c2.sh already uses), stripping only:
#   - docker-injected PATH/HOSTNAME/HOME
#   - RESYNC_FROM_SNAPSHOT, which combined with a BOOTSTRAP_SNAPSHOT_URL
#     pointing at the dead domain would attempt a reseed against a 404
#   - the keys being replaced
# No secret is ever echoed; only variable NAMES are logged. The previous
# container is renamed rather than deleted and is restored automatically if the
# new one fails to answer /api/status.

on:
  workflow_dispatch:
    inputs:
      box:
        description: Which box to wire
        required: true
        default: contabo1
        type: choice
        options: [contabo1, contabo2]

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Compute per-box settings
        id: cfg
        run: |
          if [ "${{ inputs.box }}" = "contabo1" ]; then
            echo "host=173.249.37.118"              >> $GITHUB_OUTPUT
            echo "peer=http://194.163.188.71:8080"  >> $GITHUB_OUTPUT
          else
            echo "host=194.163.188.71"              >> $GITHUB_OUTPUT
            echo "peer=http://173.249.37.118:8080"  >> $GITHUB_OUTPUT
          fi

      - name: Wire Contabo1
        if: ${{ inputs.box == 'contabo1' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script_stop: true
          timeout: 900s
          command_timeout: 900s
          # NOTE: no `envs: PEER_URL` here. It used to forward a runner
          # variable of that name that no `env:` block ever defined — so
          # ssh-action exported an empty PEER_URL which the next line
          # immediately overwrote anyway. Behaviourally a no-op, but it failed
          # scripts/lint_workflow_envs.py (the CI job that exists to catch
          # exactly this shape), leaving CI red on every PR. The value comes
          # from the expression substitution below, as it does in the Contabo2
          # step, which never had the stray line.
          script: |
            set -euo pipefail
            PEER_URL='${{ steps.cfg.outputs.peer }}'
            NODE=aequitas-node
            IMAGE=$(docker inspect "$NODE" --format '{{.Config.Image}}')
            echo "current: $(docker inspect "$NODE" --format '{{.State.Status}} image={{.Config.Image}}')"

            PROOF_NET=$(docker inspect proof-server --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
            NODE_NETS=$(docker inspect "$NODE" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}')
            echo "proof-server net: $PROOF_NET | node nets: $NODE_NETS"

            TOKEN=$(docker inspect proof-server --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^CHAIN_SERVICE_TOKEN=' | head -1 | cut -d= -f2- || true)
            if [ -z "$TOKEN" ]; then echo "ERROR: proof-server has no CHAIN_SERVICE_TOKEN"; exit 1; fi

            umask 077
            docker inspect "$NODE" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -vE '^(PATH|HOSTNAME|HOME|RESYNC_FROM_SNAPSHOT|PROOF_SERVER_URLS|PROOF_SERVER_URL|CHAIN_SERVICE_TOKEN|PRIMARY_NODE_URL|PRIMARY_NODE_URLS|BOOTSTRAP_SNAPSHOT_URL)=' \
              | grep -v '^$' > /root/.node-env-new

            {
              printf 'PRIMARY_NODE_URL=%s\n'       "$PEER_URL"
              printf 'PRIMARY_NODE_URLS=%s\n'      "$PEER_URL"
              printf 'BOOTSTRAP_SNAPSHOT_URL=%s\n' "$PEER_URL/api/snapshot"
              printf 'PROOF_SERVER_URLS=%s\n'      "http://proof-server:3000"
              printf 'CHAIN_SERVICE_TOKEN=%s\n'    "$TOKEN"
              # Contabo1 is the primary and holds the authoritative chain.
              # IS_PRIMARY_NODE is NOT a consensus role (pool distribution is
              # decentralised via TryLockDistribution's Postgres CAS), but it
              # does make resetDBStateForBootstrap refuse RESET_DB_STATE
              # outright - the single guard standing between this database and
              # a stray environment variable. On the one box that must never be
              # rebuilt, set it. Deliberately NOT set on Contabo2, which has to
              # stay resyncable.
              printf 'IS_PRIMARY_NODE=true\n'
            } >> /root/.node-env-new

            echo "=== variable NAMES to be applied (values never printed) ==="
            cut -d= -f1 /root/.node-env-new | sort
            echo "peer -> $PEER_URL"

            # Persist into the env file deploy.sh rebuilds the container from,
            # otherwise the next ordinary deploy silently reverts all of this.
            for ENVF in /root/.aequitas.env /root/aequitas.env; do
              [ -f "$ENVF" ] || continue
              cp -a "$ENVF" "$ENVF.bak-$(date +%s)"
              grep -vE '^(PRIMARY_NODE_URL|PRIMARY_NODE_URLS|BOOTSTRAP_SNAPSHOT_URL|PROOF_SERVER_URLS|PROOF_SERVER_URL|CHAIN_SERVICE_TOKEN|IS_PRIMARY_NODE)=' "$ENVF" > "$ENVF.tmp"
              {
                printf 'PRIMARY_NODE_URL=%s\n'       "$PEER_URL"
                printf 'PRIMARY_NODE_URLS=%s\n'      "$PEER_URL"
                printf 'BOOTSTRAP_SNAPSHOT_URL=%s\n' "$PEER_URL/api/snapshot"
                printf 'PROOF_SERVER_URLS=%s\n'      "http://proof-server:3000"
                printf 'CHAIN_SERVICE_TOKEN=%s\n'    "$TOKEN"
                printf 'IS_PRIMARY_NODE=true\n'
              } >> "$ENVF.tmp"
              mv "$ENVF.tmp" "$ENVF"
              echo "persisted into $ENVF (backup kept alongside)"
            done

            PREV="${NODE}-prev-$(date +%s)"
            docker rename "$NODE" "$PREV"
            docker stop "$PREV" >/dev/null 2>&1 || true

            NETARGS=""
            for n in $NODE_NETS; do NETARGS="$NETARGS --network $n"; done
            if [ -n "$PROOF_NET" ] && ! echo "$NODE_NETS" | grep -qw "$PROOF_NET"; then
              NETARGS="$NETARGS --network $PROOF_NET"
              echo "attaching node to $PROOF_NET so http://proof-server:3000 resolves"
            fi

            # shellcheck disable=SC2086
            docker run -d --name "$NODE" --restart unless-stopped \
              --env-file /root/.node-env-new $NETARGS \
              -p 8080:8080 -p 4001:4001 \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE"

            ok=0
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8080/api/status || true)
              if [ "$code" = "200" ]; then echo "node healthy after ${i}s"; ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != "1" ]; then
              echo "node did not come up — rolling back"
              docker logs --tail 40 "$NODE" || true
              docker rm -f "$NODE" || true
              docker rename "$PREV" "$NODE"
              docker start "$NODE"
              exit 1
            fi

            echo "=== result ==="
            curl -s -m 10 http://127.0.0.1:8080/api/status | head -c 200; echo
            curl -s -o /dev/null -w 'proof proxy /api/prove/get/probe -> %{http_code}  (503=unwired, 502=unreachable, 404/400=OK)\n' -m 20 http://127.0.0.1:8080/api/prove/get/probe || true
            echo "previous container kept as $PREV"

      - name: Wire Contabo2
        if: ${{ inputs.box == 'contabo2' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: true
          timeout: 900s
          command_timeout: 900s
          script: |
            set -euo pipefail
            PEER_URL='${{ steps.cfg.outputs.peer }}'
            NODE=aequitas-node
            IMAGE=$(docker inspect "$NODE" --format '{{.Config.Image}}')
            echo "current: $(docker inspect "$NODE" --format '{{.State.Status}} image={{.Config.Image}}')"

            PROOF_NET=$(docker inspect proof-server --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')
            NODE_NETS=$(docker inspect "$NODE" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}')
            echo "proof-server net: $PROOF_NET | node nets: $NODE_NETS"

            TOKEN=$(docker inspect proof-server --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^CHAIN_SERVICE_TOKEN=' | head -1 | cut -d= -f2- || true)
            if [ -z "$TOKEN" ]; then echo "ERROR: proof-server has no CHAIN_SERVICE_TOKEN"; exit 1; fi

            umask 077
            docker inspect "$NODE" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -vE '^(PATH|HOSTNAME|HOME|RESYNC_FROM_SNAPSHOT|PROOF_SERVER_URLS|PROOF_SERVER_URL|CHAIN_SERVICE_TOKEN|PRIMARY_NODE_URL|PRIMARY_NODE_URLS|BOOTSTRAP_SNAPSHOT_URL)=' \
              | grep -v '^$' > /root/.node-env-new

            {
              printf 'PRIMARY_NODE_URL=%s\n'       "$PEER_URL"
              printf 'PRIMARY_NODE_URLS=%s\n'      "$PEER_URL"
              printf 'BOOTSTRAP_SNAPSHOT_URL=%s\n' "$PEER_URL/api/snapshot"
              printf 'PROOF_SERVER_URLS=%s\n'      "http://proof-server:3000"
              printf 'CHAIN_SERVICE_TOKEN=%s\n'    "$TOKEN"
            } >> /root/.node-env-new

            echo "=== variable NAMES to be applied (values never printed) ==="
            cut -d= -f1 /root/.node-env-new | sort
            echo "peer -> $PEER_URL"

            # Persist into the env file deploy.sh rebuilds the container from,
            # otherwise the next ordinary deploy silently reverts all of this.
            for ENVF in /root/.aequitas.env /root/aequitas.env; do
              [ -f "$ENVF" ] || continue
              cp -a "$ENVF" "$ENVF.bak-$(date +%s)"
              grep -vE '^(PRIMARY_NODE_URL|PRIMARY_NODE_URLS|BOOTSTRAP_SNAPSHOT_URL|PROOF_SERVER_URLS|PROOF_SERVER_URL|CHAIN_SERVICE_TOKEN)=' "$ENVF" > "$ENVF.tmp"
              {
                printf 'PRIMARY_NODE_URL=%s\n'       "$PEER_URL"
                printf 'PRIMARY_NODE_URLS=%s\n'      "$PEER_URL"
                printf 'BOOTSTRAP_SNAPSHOT_URL=%s\n' "$PEER_URL/api/snapshot"
                printf 'PROOF_SERVER_URLS=%s\n'      "http://proof-server:3000"
                printf 'CHAIN_SERVICE_TOKEN=%s\n'    "$TOKEN"
              } >> "$ENVF.tmp"
              mv "$ENVF.tmp" "$ENVF"
              echo "persisted into $ENVF (backup kept alongside)"
            done

            PREV="${NODE}-prev-$(date +%s)"
            docker rename "$NODE" "$PREV"
            docker stop "$PREV" >/dev/null 2>&1 || true

            NETARGS=""
            for n in $NODE_NETS; do NETARGS="$NETARGS --network $n"; done
            if [ -n "$PROOF_NET" ] && ! echo "$NODE_NETS" | grep -qw "$PROOF_NET"; then
              NETARGS="$NETARGS --network $PROOF_NET"
              echo "attaching node to $PROOF_NET so http://proof-server:3000 resolves"
            fi

            # shellcheck disable=SC2086
            docker run -d --name "$NODE" --restart unless-stopped \
              --env-file /root/.node-env-new $NETARGS \
              -p 8080:8080 -p 4001:4001 \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE"

            ok=0
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8080/api/status || true)
              if [ "$code" = "200" ]; then echo "node healthy after ${i}s"; ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != "1" ]; then
              echo "node did not come up — rolling back"
              docker logs --tail 40 "$NODE" || true
              docker rm -f "$NODE" || true
              docker rename "$PREV" "$NODE"
              docker start "$NODE"
              exit 1
            fi

            echo "=== result ==="
            curl -s -m 10 http://127.0.0.1:8080/api/status | head -c 200; echo
            curl -s -o /dev/null -w 'proof proxy /api/prove/get/probe -> %{http_code}  (503=unwired, 502=unreachable, 404/400=OK)\n' -m 20 http://127.0.0.1:8080/api/prove/get/probe || true
            echo "previous container kept as $PREV"
