name: Warum keine Bloecke (read-only)

# Der Lasttest bricht ab, wenn die Blockhoehe 15 s stillsteht. Der Replay
# erklaert das nicht (schlimmster gemessener Halt: 937 ms), also muss die
# Produktion selbst aussetzen. Jeder Grund dafuer wird geloggt -- dieser
# Workflow zaehlt sie auf BEIDEN Boxen im gewaehlten Zeitfenster.
#
# Read-only: liest nur docker logs, startet nichts neu, schreibt nichts.

on:
  workflow_dispatch:
    inputs:
      minuten:
        description: Wie weit zurueck (Minuten)
        required: false
        default: "20"

jobs:
  c1:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script_stop: false
          timeout: 400s
          command_timeout: 400s
          script: |
            M=${{ inputs.minuten }}
            echo "########## C1 (PRIMARY) -- letzte ${M}m ##########"
            docker logs --since ${M}m aequitas-node > /tmp/nl.txt 2>&1
            echo "Logzeilen im Fenster: $(wc -l < /tmp/nl.txt)"
            echo "===== Produktions-Aussetzer, nach Grund gezaehlt ====="
            grep -oE '\[BLOCK\] (⏳|⏸|⚠)[^0-9]{0,70}' /tmp/nl.txt | sort | uniq -c | sort -rn | head -20
            echo "(keine Zeile oben = die Produktion hat nie ausgesetzt)"
            echo "===== die letzten 12 Aussetzer im Wortlaut ====="
            grep -E '\[BLOCK\] (⏳|⏸|⚠)' /tmp/nl.txt | tail -12 | cut -c1-230
            echo "===== wie lange dauert die Blockproduktion selbst? ====="
            grep -a "dbpair detail" /tmp/nl.txt | tail -8 | cut -c1-200
            echo "  Treffer insgesamt (ProduceBlock ueber 1,2 s fuer seine zwei DB-Abfragen):"
            grep -ac "dbpair detail" /tmp/nl.txt
            echo "===== wie lange dauert ProduceBlock insgesamt? ====="
            grep -a "ProduceBlock itself took" /tmp/nl.txt | tail -10 | cut -c1-140
            echo "  Treffer ueber 500 ms:"
            grep -ac "ProduceBlock itself took" /tmp/nl.txt
            echo "===== davon: den Block speichern (haelt dag.mu) ====="
            grep -a "SaveBlockWithPendingTxsAtomic took" /tmp/nl.txt | tail -8 | cut -c1-170
            echo "  Treffer ueber 500 ms:"
            grep -ac "SaveBlockWithPendingTxsAtomic took" /tmp/nl.txt
            echo "===== welche Seeds/Peers kennt dieser Knoten? (Startzeilen) ====="
            docker logs aequitas-node 2>&1 | grep -a "\[PEERS\]" | head -14 | cut -c1-180
            echo "  -- das Tor verlangt 3 saubere Zyklen mit JEDEM dieser Seeds --"
            echo "===== relevante Umgebung ====="
            docker inspect aequitas-node --format "{{range .Config.Env}}{{println .}}{{end}}" 2>/dev/null | grep -aE "PRIMARY_NODE|PEER_NODES|SELF_URL|SEED" | cut -c1-180
            echo "===== warum wurden Bloecke NICHT gemergt? (bricht den Streak) ====="
            grep -aoiE "rejected[^0-9]{0,90}|unauthorized[^0-9]{0,60}|bad signature|finality[^0-9]{0,60}|far.ahead[^0-9]{0,60}|equivocat[^0-9]{0,60}|invalid[^0-9]{0,60}" /tmp/nl.txt | sort | uniq -c | sort -rn | head -12
            echo "  (leer = kein Block wurde aus diesen Gruenden abgelehnt)"
            echo "===== HTTP-SYNC Zyklen im Wortlaut (letzte 8) ====="
            grep -a "HTTP-SYNC" /tmp/nl.txt | tail -8 | cut -c1-220
            echo "===== langsame Ticks, Rueckstand, Bremse ====="
            grep -aiE "slow tick|langsam|behind|bremse|throttl|lag" /tmp/nl.txt | tail -6 | cut -c1-200
            echo "===== Fehler/Panik ====="
            grep -ciE 'panic|fatal|out of memory|deadlock' /tmp/nl.txt
            grep -iE 'panic|fatal|out of memory|deadlock' /tmp/nl.txt | tail -5 | cut -c1-200
  c2:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 400s
          command_timeout: 400s
          script: |
            M=${{ inputs.minuten }}
            echo "########## C2 (Lastziel) -- letzte ${M}m ##########"
            docker logs --since ${M}m aequitas-node > /tmp/nl.txt 2>&1
            echo "Logzeilen im Fenster: $(wc -l < /tmp/nl.txt)"
            echo "===== Produktions-Aussetzer, nach Grund gezaehlt ====="
            grep -oE '\[BLOCK\] (⏳|⏸|⚠)[^0-9]{0,70}' /tmp/nl.txt | sort | uniq -c | sort -rn | head -20
            echo "(keine Zeile oben = die Produktion hat nie ausgesetzt)"
            echo "===== die letzten 12 Aussetzer im Wortlaut ====="
            grep -E '\[BLOCK\] (⏳|⏸|⚠)' /tmp/nl.txt | tail -12 | cut -c1-230
            echo "===== wie lange dauert die Blockproduktion selbst? ====="
            grep -a "dbpair detail" /tmp/nl.txt | tail -8 | cut -c1-200
            echo "  Treffer insgesamt (ProduceBlock ueber 1,2 s fuer seine zwei DB-Abfragen):"
            grep -ac "dbpair detail" /tmp/nl.txt
            echo "===== langsame Ticks, Rueckstand, Bremse ====="
            grep -aiE "slow tick|langsam|behind|bremse|throttl|lag" /tmp/nl.txt | tail -6 | cut -c1-200
            echo "===== Fehler/Panik ====="
            grep -ciE 'panic|fatal|out of memory|deadlock' /tmp/nl.txt
            grep -iE 'panic|fatal|out of memory|deadlock' /tmp/nl.txt | tail -5 | cut -c1-200
