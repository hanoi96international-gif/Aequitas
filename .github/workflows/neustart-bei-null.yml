name: Neustart bei null (V8) -- erkunden oder ausfuehren
# Startet die Kette bei null neu (docs/V8_ENTWURF.md "Beim Neustart zu tun",
# docs/LAUNCH_CHECKLISTE.md). Entschieden vom Betreiber am 30.09.2026: alle
# bisherigen Guthaben und Registrierungen duerfen weg.
#
# modus=erkunden (Vorgabe): NUR LESEN. Zeigt je Box, was ausfuehren anfassen
# wuerde -- Container, Mounts, Datenbanknamen, Zeilenzahlen, WAL, Genesis.
# Nur Namen, Pfade und Zahlen: das Repo und damit diese Logs sind oeffentlich.
#
# modus=ausfuehren loescht UNUMKEHRBAR (.github/neustart/leeren.sh):
#   - die Kettendatenbank des Knotens (DROP/CREATE; der Knoten legt sein
#     Schema beim Start selbst an -- darin auch EVM-Zustand und MPC-Anteile),
#   - die WAL-Dateien des Knotens,
#   - die Proof-Server-Tabellen (bio_hashes, proof_store, Sperren, Sicherungen),
#   - alle Zeilen der Matching-Datenbank -- sonst lehnt der Coordinator jeden,
#     der sich im neuen Netz wieder registriert, als Duplikat ab.
# Bleibt: Widerspruchsvorgaenge des Coordinators (eigene Fristen), MPC-Vorrat
# auf der Platte, Schluessel, .env, Caddy, APK.
#
# ausfuehren verlangt:
#   - bestaetigung genau "ALLE GUTHABEN WEG",
#   - neuestes App-Release mindestens app-v1.8.1 (V8-Unterschrift),
#   - den LAUFENDEN Knoten auf beiden Boxen schon mit V8-Genesis (Genesis-PR
#     gemergt und deployt),
# sichert vorher beide Boxen (deploy/backup-ledger.sh, Kopie bleibt auf der
# Box), leert dann beide und startet erst C1 (nimmt an), dann C2.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "erkunden (nur lesen) | ausfuehren"
        required: true
        default: erkunden
        type: choice
        options: [erkunden, ausfuehren]
      bestaetigung:
        description: "Nur fuer ausfuehren: genau ALLE GUTHABEN WEG"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: deploy-knoten
  cancel-in-progress: false
jobs:
  erkunden:
    if: inputs.modus == 'erkunden'
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
          - {box: C2, host: 194.163.188.71, fp: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto", key: CONTABO2_SSH_KEY}
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Erkunden (nur lesen)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: cat .github/neustart/gemeinsam.sh .github/neustart/erkunden.sh | ssh -i ~/.ssh/k -o BatchMode=yes "root@$HOST" "BOX=$BOX bash -s"

  pruefen:
    if: inputs.modus == 'ausfuehren'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestaetigung
        env:
          B: ${{ inputs.bestaetigung }}
        run: |
          [ "$B" = "ALLE GUTHABEN WEG" ] || { echo "::error::bestaetigung muss genau 'ALLE GUTHABEN WEG' lauten -- nichts passiert"; exit 1; }
      - name: App mit V8-Unterschrift ist veroeffentlicht
        run: |
          set -eu
          TAG=$(curl -fsS https://api.github.com/repos/hanoi96international-gif/Aequitas-App/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "neuestes Release: $TAG"
          python3 -c '
          import re, sys
          m = re.fullmatch(r"app-v(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not m or tuple(map(int, m.groups())) < (1, 8, 1):
              print("::error::neuestes App-Release ist aelter als app-v1.8.1 -- ohne V8-Unterschrift koennte sich niemand registrieren")
              sys.exit(1)
          ' "$TAG"

  sichern:
    needs: pruefen
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
          - {box: C2, host: 194.163.188.71, fp: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto", key: CONTABO2_SSH_KEY}
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Laufender Knoten hat die V8-Genesis
        env:
          HOST: ${{ matrix.host }}
        run: |
          G=$(ssh -i ~/.ssh/k -o BatchMode=yes "root@$HOST" "docker exec aequitas-node cat genesis.json")
          echo "$G"
          echo "$G" | python3 -c 'import json,sys; g=json.load(sys.stdin); v=(g.get("register_vertrag") or {}).get("version"); sys.exit(0 if v=="v8" else 1)' \
            || { echo "::error::Der laufende Knoten hat noch keine V8-Genesis. Erst den Genesis-PR mergen und den Deploy abwarten."; exit 1; }
      - name: Zustand sichern (bleibt auf der Box)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: ssh -i ~/.ssh/k -o BatchMode=yes "root@$HOST" "BOX=$BOX bash -s" < deploy/backup-ledger.sh

  leeren:
    needs: sichern
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
          - {box: C2, host: 194.163.188.71, fp: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto", key: CONTABO2_SSH_KEY}
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Leeren (unumkehrbar)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: cat .github/neustart/gemeinsam.sh .github/neustart/leeren.sh | ssh -i ~/.ssh/k -o BatchMode=yes "root@$HOST" "BOX=$BOX BESTAETIGT='ALLE GUTHABEN WEG' bash -s"

  starten-c1:
    needs: leeren
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: 188.172.229.121
          FP: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
        run: bash .github/neustart/ssh-einrichten.sh
      - name: C1 starten (nimmt an)
        run: cat .github/neustart/gemeinsam.sh .github/neustart/starten.sh | ssh -i ~/.ssh/k -o BatchMode=yes root@188.172.229.121 "BOX=C1 bash -s"

  starten-c2:
    needs: starten-c1
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO2_SSH_KEY }}
          HOST: 194.163.188.71
          FP: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
        run: bash .github/neustart/ssh-einrichten.sh
      - name: C2 starten (folgt C1)
        run: cat .github/neustart/gemeinsam.sh .github/neustart/starten.sh | ssh -i ~/.ssh/k -o BatchMode=yes root@194.163.188.71 "BOX=C2 bash -s"
