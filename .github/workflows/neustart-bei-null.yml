name: Neustart bei null (V8) -- erkunden oder ausfuehren
# Startet die Kette bei null neu (docs/V8_ENTWURF.md "Beim Neustart zu tun",
# docs/LAUNCH_CHECKLISTE.md). Entschieden vom Betreiber am 30.09.2026: alle
# bisherigen Guthaben und Registrierungen duerfen weg.
#
# modus=erkunden (Vorgabe): NUR LESEN. Zeigt je Box, was ausfuehren anfassen
# wuerde -- Container, Mounts, Datenbanknamen, Zeilenzahlen, WAL, Genesis.
# Nur Namen, Pfade und Zahlen: das Repo und damit diese Logs sind oeffentlich.
#
# modus=ausfuehren loescht UNUMKEHRBAR (.github/neustart/leeren.sh):
#   - die Kettendatenbank des Knotens (DROP/CREATE; der Knoten legt sein
#     Schema beim Start selbst an -- darin auch EVM-Zustand und MPC-Anteile),
#   - die WAL-Dateien des Knotens,
#   - die Proof-Server-Tabellen (bio_hashes, proof_store, Sperren, Sicherungen),
#   - alle Zeilen der Matching-Datenbank -- sonst lehnt der Coordinator jeden,
#     der sich im neuen Netz wieder registriert, als Duplikat ab.
# Bleibt: Widerspruchsvorgaenge des Coordinators (eigene Fristen), MPC-Vorrat
# auf der Platte, Schluessel, .env, Caddy, APK.
#
# ausfuehren verlangt:
#   - bestaetigung genau "ALLE GUTHABEN WEG",
#   - neuestes App-Release mindestens app-v1.8.1 (V8-Unterschrift),
#   - genesis.json auf main schon V8 mit neuer genesis_time (Genesis-PR
#     gemergt). Der normale Deploy haelt bei diesem Merge an
#     (.github/neustart/genesis-passt.sh): die Knoten laufen bis hierher
#     unveraendert auf der alten Kette weiter.
# 21.10.2026: C2 ist seit dem 03.10. abgeschaltet, seine IP meldet einen
# fremden Host-Schluessel -- C2 ist aus allen Schritten entfernt. Die
# neueren Releases heissen "vX.Y.Z" statt "app-vX.Y.Z"; beides gilt.
# Jeder Fernschritt laeuft ueber .github/neustart/fern.sh: gruen nur, wenn
# das Skript bis zur letzten Zeile kam. Beim ersten Lauf am 21.10. schluckte
# ein "docker exec -i" den Rest von leeren.sh -- gruen, geloescht war nichts.
# Ablauf (Betreiber, 30.09.2026: das neue Netz beginnt mit C1 allein):
#   1. beide Boxen sichern (deploy/backup-ledger.sh, Kopie bleibt auf der Box),
#   2. beide leeren (Knoten gestoppt),
#   3. C1 wird einziger Produzent (AUTHORIZED_VALIDATORS = seine eigene
#      Signieradresse, produzenten-c1.sh). C1 signiert schon mit einem eigenen
#      Schluessel, nicht mit der Wallet des Betreibers (Erkundung 30.09.); der
#      Schluessel und seine Bindung bleiben.
#   4. C1 mit deploy-c1.sh aus main bauen und starten (v8, null Menschen,
#      nimmt an),
#   5. (bis 21.10.: C2-Dienste neu starten -- C2 gibt es nicht mehr)
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "erkunden (nur lesen) | ausfuehren"
        required: true
        default: erkunden
        type: choice
        options: [erkunden, ausfuehren]
      bestaetigung:
        description: "Nur fuer ausfuehren: genau ALLE GUTHABEN WEG"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: deploy-knoten
  cancel-in-progress: false
jobs:
  erkunden:
    if: inputs.modus == 'erkunden'
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Erkunden (nur lesen)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: bash .github/neustart/fern.sh "$HOST" "BOX=$BOX" .github/neustart/gemeinsam.sh .github/neustart/erkunden.sh

  pruefen:
    if: inputs.modus == 'ausfuehren'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bestaetigung
        env:
          B: ${{ inputs.bestaetigung }}
        run: |
          [ "$B" = "ALLE GUTHABEN WEG" ] || { echo "::error::bestaetigung muss genau 'ALLE GUTHABEN WEG' lauten -- nichts passiert"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: main traegt die V8-Genesis (Genesis-PR gemergt)
        run: |
          jq . genesis.json
          [ "$(jq -r '.register_vertrag.version // "v7"' genesis.json)" = v8 ] \
            || { echo "::error::genesis.json auf main ist noch nicht V8 -- erst den Genesis-PR mergen. Der normale Deploy haelt dann an (genesis-passt.sh), die Knoten laufen unveraendert weiter."; exit 1; }
      - name: App mit V8-Unterschrift ist veroeffentlicht
        run: |
          set -eu
          TAG=$(curl -fsS https://api.github.com/repos/hanoi96international-gif/Aequitas-App/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "neuestes Release: $TAG"
          python3 -c '
          import re, sys
          m = re.fullmatch(r"(?:app-)?v(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not m or tuple(map(int, m.groups())) < (1, 8, 1):
              print("::error::neuestes App-Release ist aelter als app-v1.8.1 -- ohne V8-Unterschrift koennte sich niemand registrieren")
              sys.exit(1)
          ' "$TAG"

  sichern:
    needs: pruefen
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Zustand sichern (bleibt auf der Box)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: bash .github/neustart/fern.sh "$HOST" "BOX=$BOX" deploy/backup-ledger.sh

  leeren:
    needs: sichern
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {box: C1, host: 188.172.229.121, fp: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA", key: CONTABO_SSH_KEY}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ matrix.host }}
          FP: ${{ matrix.fp }}
        run: bash .github/neustart/ssh-einrichten.sh
      - name: Leeren (unumkehrbar)
        env:
          HOST: ${{ matrix.host }}
          BOX: ${{ matrix.box }}
        run: bash .github/neustart/fern.sh "$HOST" "BOX=$BOX BESTAETIGT='ALLE GUTHABEN WEG'" .github/neustart/gemeinsam.sh .github/neustart/leeren.sh

  produzenten-c1:
    needs: leeren
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: 188.172.229.121
          FP: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
        run: bash .github/neustart/ssh-einrichten.sh
      - name: C1 einziger Produzent (AUTHORIZED_VALIDATORS = eigene Signieradresse)
        run: bash .github/neustart/fern.sh 188.172.229.121 "BOX=C1 BESTAETIGT='ALLE GUTHABEN WEG'" .github/neustart/gemeinsam.sh .github/neustart/produzenten-c1.sh

  starten-c1:
    needs: produzenten-c1
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: 188.172.229.121
          FP: "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA"
        run: bash .github/neustart/ssh-einrichten.sh
      - name: C1 mit dem Stand von main bauen und starten (deploy-c1.sh)
        run: bash .github/neustart/fern.sh 188.172.229.121 "" deploy/deploy-c1.sh
      - name: C1 ist das neue Netz (v8, null Menschen, nimmt an)
        run: bash .github/neustart/fern.sh 188.172.229.121 "BOX=C1" .github/neustart/gemeinsam.sh .github/neustart/starten.sh

