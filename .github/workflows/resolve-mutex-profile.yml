name: Resolve the mutex profile's top stacks to function names

# The mutex profile answers WHERE the contention is, but debug=1 prints raw
# program counters when the binary carries no inline symbol table:
#
#   3783305471400 37400 @ 0x48fa45 0x12eacd2 0x12edf25 0x12eda94 ...
#
# At 2,794,798,156 cycles/second that first line alone is 1,354 SECONDS of
# blocked time -- more than every other stack combined, and the runner-up is
# 236s. Whatever it is, it is the answer to why acquiring cs.mu.RLock() costs
# 45.88ms of an 87.80ms transfer.
#
# net/http/pprof serves /debug/pprof/symbol precisely for this: POST a list of
# addresses, get function names back. No binary, no go tool pprof, no symbol
# upload.
#
# Read-only apart from needing contention profiling to still be ON -- run this
# straight after contention-profile-under-load.yml, before its restore step has
# had a chance to matter. The profile is cumulative since process start, so the
# data survives the load run ending.
on:
  workflow_dispatch:
    inputs:
      stacks:
        description: "How many of the heaviest stacks to resolve"
        required: false
        default: "4"

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve on Contabo2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 900s
          command_timeout: 900s
          envs: STACKS
          script: |
            set +e
            # pprof binds the container's own loopback; share its namespace.
            fetch() {
              docker run --rm --network "container:aequitas-node" curlimages/curl:latest -s --max-time 60 "$1"
            }
            post() {
              docker run --rm -i --network "container:aequitas-node" curlimages/curl:latest -s --max-time 60 --data-binary @- "$1"
            }

            fetch "http://127.0.0.1:6061/debug/pprof/mutex?debug=1" > /tmp/mutex.txt
            if ! grep -q "cycles/second" /tmp/mutex.txt; then
              echo "no mutex profile available — is AEQUITAS_CONTENTION_PROFILE still set?"
              head -5 /tmp/mutex.txt
              exit 1
            fi

            HZ=$(grep -o 'cycles/second=[0-9]*' /tmp/mutex.txt | cut -d= -f2)
            echo "cycles/second = $HZ"
            echo ""

            # Sample lines look like: "<cycles> <count> @ 0xA 0xB 0xC"
            grep '@' /tmp/mutex.txt | grep -E '^[0-9]+ [0-9]+ @' | sort -rn | head -n "$STACKS" > /tmp/top.txt

            n=0
            while read -r line; do
              n=$((n+1))
              CYC=$(echo "$line" | awk '{print $1}')
              CNT=$(echo "$line" | awk '{print $2}')
              SECS=$(awk -v c="$CYC" -v hz="$HZ" 'BEGIN{printf "%.1f", c/hz}')
              echo "=============================================================="
              echo "STACK $n: ${SECS}s of blocked time across $CNT samples"
              echo "=============================================================="
              ADDRS=$(echo "$line" | sed 's/^.*@ //')
              # /debug/pprof/symbol resolves one address per line.
              printf '%s' "$(echo "$ADDRS" | tr ' ' '\n')" > /tmp/addrs.txt
              post "http://127.0.0.1:6061/debug/pprof/symbol" < /tmp/addrs.txt
              echo ""
            done < /tmp/top.txt
        env:
          STACKS: ${{ inputs.stacks }}
