name: Sperren-Wachhund -- was hielt die DAG-Sperre laenger als 3 s
on: {workflow_dispatch: {}}
# Nur lesen (Beta-Pruefung 15.10.2026): dieser Workflow schreibt nichts
# ins Repo; die Voreinstellung des Tokens soll nicht mehr gelten.
permissions:
  contents: read

jobs:
  d:
    strategy: {max-parallel: 2, matrix: {box: [{name: "C1", host: "alter-c1-abgeschaltet.invalid", secret: "C1"}, {name: "C2", host: "alter-c2-abgeschaltet.invalid", secret: "C2"}]}}
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ matrix.box.host }}
          username: root
          key: ${{ matrix.box.secret == 'C1' && secrets.CONTABO_SSH_KEY || secrets.CONTABO2_SSH_KEY }}
          port: 22
          timeout: 200s
          command_timeout: 200s
          script: |
            set +e
            echo "##### ${{ matrix.box.name }} #####"
            echo "=== wie oft, wann ==="
            docker logs --since 24h aequitas-node 2>&1 | grep -F '[SPERRE]' | tail -8
            echo "=== der letzte Dump: wer HAELT (nicht wer wartet) ==="
            docker logs --since 24h aequitas-node 2>&1 | awk 'index($0,"[SPERRE]") && index($0,"wartet seit"){f=1} f' | grep -vE 'sync\.\(\*Mutex\)\.Lock|semacquire|chan receive|select|runtime\.gopark|^\s*$' | grep -E 'keeper\.|goroutine [0-9]+' | head -40
