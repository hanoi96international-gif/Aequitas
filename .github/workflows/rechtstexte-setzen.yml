name: Impressum und Datenschutz freischalten (C1)

# Die sieben Pflichtangaben (docs/RECHTSTEXTE_FREISCHALTEN.md) in die .env
# von C1 (netcup, 188.172.229.121) schreiben und nur den Knoten-Container neu
# starten. Danach antworten /impressum und /datenschutz mit 200.
#
# Bis zum 23.10.2026 zielte dieser Workflow auf den alten Contabo1 und auf
# Contabo2 -- beide abgeschaltet. Er lief nie; Blocker 3 hing an einem Weg,
# der keinen laufenden Server mehr erreichte.
#
# Die Werte stehen danach oeffentlich auf der Website; sie sind hier also
# keine Geheimnisse. Trotzdem: nur Betreiberangaben eintragen, die
# tatsaechlich stimmen -- die Sperre prueft, ob die Felder gesetzt sind, nicht,
# ob sie wahr sind.
#
# Leere optionale Felder verschwinden samt ihrer Zeile auf der Seite.
# Rueckweg: die Sicherung .env.bak-rechtstexte-<zeit> neben der .env und
# docker compose up -d --no-deps node.

on:
  workflow_dispatch:
    inputs:
      LEGAL_NAME:
        description: "Name oder Firma des Betreibers"
        required: true
      LEGAL_STRASSE:
        description: "Strasse und Hausnummer (ladungsfaehig, kein Postfach)"
        required: true
      LEGAL_ORT:
        description: "PLZ und Ort"
        required: true
      LEGAL_LAND:
        description: "Land"
        required: true
      LEGAL_EMAIL:
        description: "E-Mail fuer Impressum und Datenschutzanfragen"
        required: true
      LEGAL_VERANTWORTLICH:
        description: "Verantwortliche Person nach § 18 Abs. 2 MStV"
        required: true
      LEGAL_AUFSICHTSBEHOERDE:
        description: "Zustaendige Datenschutz-Aufsichtsbehoerde (nach Sitz)"
        required: true
      LEGAL_OPTIONAL:
        description: "optional, mit ; getrennt: LEGAL_TELEFON=...;LEGAL_VERTRETEN_DURCH=...;LEGAL_REGISTERGERICHT=...;LEGAL_REGISTERNUMMER=...;LEGAL_USTID=..."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: c1-knoten
  cancel-in-progress: false

jobs:
  c1:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel und Host-Pruefung
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null > ~/.ssh/kh1
          ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}' | grep -qx 'SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA' || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      # Die Angaben prueft deploy/rechtstexte-angaben.sh gegen eine Liste
      # erlaubter Zeichen und bricht sonst ab (Kopf des Skripts: docker
      # compose liest die .env mit eigenem Parser -- ' setzt weitere
      # Schluessel, ${VAR} setzt Geheimnisse ein). Zur Box gehen sie
      # base64-kodiert; dort wird keine Eingabe als Shell-Code gelesen.
      - name: Angaben pruefen
        id: angaben
        env:
          LEGAL_NAME: ${{ inputs.LEGAL_NAME }}
          LEGAL_STRASSE: ${{ inputs.LEGAL_STRASSE }}
          LEGAL_ORT: ${{ inputs.LEGAL_ORT }}
          LEGAL_LAND: ${{ inputs.LEGAL_LAND }}
          LEGAL_EMAIL: ${{ inputs.LEGAL_EMAIL }}
          LEGAL_VERANTWORTLICH: ${{ inputs.LEGAL_VERANTWORTLICH }}
          LEGAL_AUFSICHTSBEHOERDE: ${{ inputs.LEGAL_AUFSICHTSBEHOERDE }}
          LEGAL_OPTIONAL: ${{ inputs.LEGAL_OPTIONAL }}
        run: |
          set -euo pipefail
          bash deploy/rechtstexte-angaben.sh > legal.env
          echo "b64=$(base64 -w0 legal.env)" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < legal.env) LEGAL_-Zeilen"
      - name: C1 setzen und Knoten neu starten
        env:
          B64: ${{ steps.angaben.outputs.b64 }}
        run: |
          [[ "$B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "::error::Angaben leer oder nicht base64"; exit 1; }
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@188.172.229.121 "B64='$B64' bash -s" <<'SKRIPT'
          set -euo pipefail
          cd /root/Aequitas/deploy/validator
          grep -qx 'ANNAHME_ROLLE=annehmend' .env || { echo "ABBRUCH: ANNAHME_ROLLE=annehmend fehlt in .env"; exit 1; }
          BAK=".env.bak-rechtstexte-$(date +%s)"
          cp -a .env "$BAK"
          umask 077
          printf '%s' "$B64" | base64 -d > /tmp/legal.env
          grep -qvE '^LEGAL_[A-Z_]+=' /tmp/legal.env && { echo "ABBRUCH: unerwartete Zeile in den Angaben"; exit 1; }
          umg() { docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | sort; }
          umg | grep -vE '^LEGAL_' > /tmp/vorher.env || true
          { grep -vE '^LEGAL_[A-Z_]+=' .env; cat /tmp/legal.env; } > .env.tmp
          mv .env.tmp .env; chmod 600 .env
          echo "gesetzt: $(grep -cE '^LEGAL_[A-Z_]+=' .env) LEGAL_-Zeilen"
          docker compose up -d --no-deps node
          # Zweite Sperre: im laufenden Prozess darf sich ausser LEGAL_ nichts
          # geaendert haben, und jeder LEGAL_-Wert steht dort woertlich so,
          # wie er eingegeben wurde. Sonst: Sicherung zurueck, neu starten, rot.
          umg | grep -vE '^LEGAL_' > /tmp/nachher.env || true
          umg | grep -E '^LEGAL_' > /tmp/legal-ist.env || true
          if ! cmp -s /tmp/vorher.env /tmp/nachher.env || ! cmp -s <(sort /tmp/legal.env) /tmp/legal-ist.env; then
            echo "ABBRUCH: Umgebung des Knotens weicht ab -- Sicherung wird zurueckgespielt"
            diff <(cut -d= -f1 /tmp/vorher.env) <(cut -d= -f1 /tmp/nachher.env) || true
            cp -a "$BAK" .env
            docker compose up -d --no-deps node
            rm -f /tmp/legal.env /tmp/vorher.env /tmp/nachher.env /tmp/legal-ist.env
            exit 1
          fi
          rm -f /tmp/legal.env /tmp/vorher.env /tmp/nachher.env /tmp/legal-ist.env
          ok=0
          for i in $(seq 1 30); do
            if curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/status | grep -q 200; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "FEHLER: Knoten antwortet nach 5 Minuten nicht"; exit 1; }
          echo "legal-status: $(curl -s --max-time 10 http://127.0.0.1:8080/api/legal-status | tr -d '\n' | cut -c1-200)"
          for p in impressum datenschutz; do
            echo "  /$p -> HTTP $(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/$p)"
          done
          SKRIPT
      - name: C1 lebt und die Hoehe steigt
        run: bash deploy/pruefe-knoten.sh http://188.172.229.121:8080
