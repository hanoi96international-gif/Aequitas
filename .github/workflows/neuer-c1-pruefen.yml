name: Neuer C1 -- Server pruefen (nur lesend, vor dem Umzug)
# Vor dem Umzug (geplant 23.12.2026): taugt der neue Server? Liest Kerne,
# RAM, Platz, System, freie Ports, Steal-Zeit und eine grobe Signatur-
# Messung (deploy/neuer-server-lesen.sh) -- dieselbe Messung zum Vergleich
# auf dem jetzigen C1. Aendert nichts.
#
# HOST-SCHLUESSEL: den Fingerabdruck NICHT von hier uebernehmen, sondern aus
# der Konsole des Anbieters (beim ersten Start angezeigt, oder dort mit
# `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`). Dieser Lauf meldet
# sich nur an, wenn der Server genau diesen Schluessel zeigt -- sonst
# spraeche er mit dem Erstbesten auf dieser IP. Derselbe Wert geht danach in
# scripts/c1_ziel_wechseln.py.
on:
  workflow_dispatch:
    inputs:
      ip:
        description: IPv4-Adresse des neuen Servers
        required: true
      fingerabdruck:
        description: "ed25519-Host-Schluessel, Form SHA256:... (aus der Anbieter-Konsole)"
        required: true
permissions:
  contents: read
concurrency: neuer-c1-pruefen
jobs:
  neu:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Eingaben pruefen
        env:
          IP: ${{ inputs.ip }}
          FP: ${{ inputs.fingerabdruck }}
        run: |
          set -eu
          python3 - <<'PY'
          import ipaddress, os, re, sys
          ip, fp = os.environ["IP"].strip(), os.environ["FP"].strip()
          try:
              a = ipaddress.IPv4Address(ip)
          except ValueError:
              sys.exit("::error::ip: keine IPv4-Adresse")
          if not a.is_global:
              sys.exit("::error::ip: nicht oeffentlich")
          if not re.fullmatch(r"SHA256:[A-Za-z0-9+/]{43}", fp):
              sys.exit("::error::fingerabdruck: Form SHA256:<43 Zeichen>")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NEU={ip}\nNEU_FP={fp}\n")
          PY
      - name: Schluessel und Host-Schluessel des neuen Servers
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$NEU" 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh1
          [ "$(grep -c . ~/.ssh/kh1)" = 1 ] || { echo "::error::Neuer Server: nicht genau eine ed25519-Zeile (erreichbar? Port 22 offen?)"; exit 1; }
          GESEHEN="$(ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}')"
          if [ "$GESEHEN" != "$NEU_FP" ]; then
            echo "::error::Host-Schluessel passt NICHT zur Eingabe. Gesehen: $GESEHEN -- nicht anmelden. Wert in der Anbieter-Konsole pruefen."
            exit 1
          fi
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
          echo "Host-Schluessel stimmt mit der Eingabe ueberein."
      - name: Anmelden und lesen
        run: |
          set -eu
          if ! ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 root@$NEU true; then
            echo "::error::Anmeldung per Schluessel scheitert. Beim Anbieter den SSH-Schluessel 'Aequitas' hinterlegen (bzw. das Image damit neu installieren)."
            exit 1
          fi
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 root@$NEU 'bash -s' < deploy/neuer-server-lesen.sh
  vergleich-c1:
    runs-on: ubuntu-latest
    environment: produktion
    timeout-minutes: 10
    env:
      C1: 188.172.229.121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Schluessel
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY" | perl -0777 -pe 's/\r//g; s/(?:-|\xE2\x80[\x93\x94])+ *(BEGIN|END) OPENSSH PRIVATE KEY *(?:-|\xE2\x80[\x93\x94])+/-----$1 OPENSSH PRIVATE KEY-----/g; unless (/-----BEGIN OPENSSH PRIVATE KEY-----/) { (my $z = $_) =~ s/\s//g; if ($z =~ m|^[A-Za-z0-9+/]+=*$|) { require MIME::Base64; my $d = MIME::Base64::decode_base64($z); if ($d =~ /-----BEGIN OPENSSH PRIVATE KEY-----/) { $_ = $d; } elsif ($d =~ /\Aopenssh-key-v1\x00/) { $_ = qq{-----BEGIN OPENSSH PRIVATE KEY-----\n$z\n-----END OPENSSH PRIVATE KEY-----\n}; } } } s/\s*(-----BEGIN OPENSSH PRIVATE KEY-----)\s*(.*?)\s*(-----END OPENSSH PRIVATE KEY-----)\s*/my ($k, $b, $f) = ($1, $2, $3); $b =~ s|\s||g; $b =~ s|(.{70})|$1\n|g; $b =~ s|\n\z||; "$k\n$b\n$f\n"/se' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 188.172.229.121 2>/dev/null | { grep -v '^#' || true; } > ~/.ssh/kh1
          [ "$(grep -c . ~/.ssh/kh1)" = 1 ] || { echo "::error::Host-Schluessel von C1: nicht genau eine ed25519-Zeile"; exit 1; }
          [ "$(ssh-keygen -lf ~/.ssh/kh1 | awk '{print $2}')" = "SHA256:MAkOsPuhsFZUZViP8NPq+WxW1k6ykAF4mOy81wYNURA" ] || { echo "::error::Host-Schluessel von C1 passt nicht"; exit 1; }
          cp ~/.ssh/kh1 ~/.ssh/known_hosts
      - name: Dieselbe Messung auf C1 (Ports sind dort belegt -- erwartet)
        run: ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 root@$C1 'bash -s' < deploy/neuer-server-lesen.sh
