name: Zertifikate von aussen pruefen (nur lesen)
# Welches Zertifikat liefern die oeffentlichen Namen aus, und wohin zeigt DNS?
# Kein Secret, kein SSH -- nur das, was jeder Browser sieht.
on:
  push:
    branches: [claude/hier-weitermachen-xfsfqx]
    paths: [".github/workflows/zertifikat-pruefen.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in aequitas.digital www.aequitas.digital proof1.aequitas.digital proof2.aequitas.digital; do
            echo "##### $n"
            echo "DNS A: $(dig +short A $n | tr '\n' ' ')"
            echo | timeout 20 openssl s_client -connect "$n:443" -servername "$n" 2>/dev/null \
              | openssl x509 -noout -issuer -subject -dates -ext subjectAltName 2>/dev/null || echo "(kein Zertifikat)"
            echo "curl: $(curl -s -o /dev/null -w '%{http_code} %{ssl_verify_result}' --max-time 20 https://$n/ || echo fehler)"
          done
      - name: Coordinator und Vergleichsdienste (nur lesen)
        run: |
          for u in https://proof2.aequitas.digital/coordinator/health https://proof2.aequitas.digital/matching/health https://proof1.aequitas.digital/coordinator/health https://proof1.aequitas.digital/matching/health; do
            echo "##### $u"
            curl -sk --max-time 15 "$u" | python3 -c 'import sys,json
          try:
            d=json.load(sys.stdin)
          except Exception as e:
            print("keine Antwort/kein JSON"); sys.exit()
          for k in ("status","validator_urls","quorum_size","gallery_test","gallery_real","service_mode"):
            if k in d: print(k, "=", d[k])' || echo "fehler"
          done
          for v in http://173.249.37.118:8080/matching/health http://194.163.188.71:8080/matching/health; do
            echo "##### $v -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 $v || echo fehler)"
          done
