name: Node logs (read-only)

# Pulls the chain node's own startup/error output. Read-only: no restarts,
# no writes. Needed because a node can report height 0 with a full database
# behind it for several different reasons (DB unreachable, replay refusing to
# run, a resync flag, a load error) and only its log distinguishes them.

on:
  workflow_dispatch:
    inputs:
      box:
        required: true
        default: contabo2
        type: choice
        options: [contabo1, contabo2]
      lines:
        description: How many log lines
        required: false
        default: "120"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Logs Contabo1
        if: ${{ inputs.box == 'contabo1' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.37.118
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:noMtjHV8c+2iEFZu3TRUP6WRwGjkrvFke71KgU6Eyt4"
          script_stop: false
          timeout: 300s
          command_timeout: 300s
          script: |
            echo "===== docker logs (tail ${{ inputs.lines }}) ====="
            docker logs --tail ${{ inputs.lines }} aequitas-node 2>&1 | tail -${{ inputs.lines }}
            echo "===== DB reachable from the node? ====="
            docker exec aequitas-node sh -c 'wget -qO- --timeout=3 http://127.0.0.1:8080/api/health/combined 2>/dev/null | head -c 400' || echo "(health fetch failed)"

      - name: Logs Contabo2
        if: ${{ inputs.box == 'contabo2' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 300s
          command_timeout: 300s
          script: |
            echo "===== docker logs (tail ${{ inputs.lines }}) ====="
            docker logs --tail ${{ inputs.lines }} aequitas-node 2>&1 | tail -${{ inputs.lines }}
            echo "===== how much history does this box's Postgres actually hold? ====="
            PG=$(docker ps --format '{{.Names}}' | grep -E '^aequitas-postgres$' | head -1)
            if [ -n "$PG" ]; then
              docker exec "$PG" psql -U postgres -d postgres -tAc "select 'chain_blocks rows=' || count(*) || ' max_height=' || coalesce(max(height),-1) from chain_blocks" 2>/dev/null \
                || docker exec "$PG" psql -U aequitas -d aequitas -tAc "select 'chain_blocks rows=' || count(*) || ' max_height=' || coalesce(max(height),-1) from chain_blocks" 2>/dev/null \
                || echo "(psql query failed - unknown db/user)"
            else
              echo "(no aequitas-postgres container)"
            fi
