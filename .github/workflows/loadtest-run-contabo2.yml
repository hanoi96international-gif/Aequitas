name: Loadtest Contabo2 -- run timed load (manual, moves real AEQ)

# Second of the prepare -> run -> cleanup trio, see
# loadtest-prepare-contabo2.yml's header for the full rationale. Requires
# that workflow to have already been run AND its printed seed addresses
# to have already been funded with real AEQ by a human -- this workflow
# does not fund anything itself beyond what tools/contabo-loadtest/main.go's
# own "fund" phase does (seed accounts -> disposable test accounts, small
# amounts only).
#
# Re-copies the tool's source on every run (in case it changed since
# prepare) but never touches accounts.csv already on the server -- the
# scp step only overwrites the four named files, nothing else in
# /root/contabo-loadtest.
#
# Runs the built binary with --network host so its default
# http://localhost:8080/ reaches the real aequitas-node container's
# published port directly, exactly as tools/contabo-loadtest/main.go's own
# comment intends ("meant to run directly on a node"). Aborts automatically
# if block height stalls for 15s (main.go's own safety net) -- this
# workflow adds no extra guard on top of that, the tool's own is the guard.
#
# num_seeds MUST match whatever was passed to loadtest-prepare-contabo2.yml
# -- a mismatch means "fund" tries to spend from accounts that were never
# funded (fails loudly, aborts) or leaves funded seeds unused, neither of
# which corrupts anything but both waste a run.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Comma-separated phases to run (fund,warmup,run)"
        required: false
        default: "fund,warmup,run"
      num_seeds:
        description: "Must match the num_seeds used in loadtest-prepare-contabo2.yml"
        required: false
        default: "5"
      duration:
        description: "Timed run-phase duration (Go duration syntax, e.g. 20s, 1m)"
        required: false
        default: "20s"
      ramp:
        description: "Seconds to ramp concurrency up over before the timed window starts"
        required: false
        default: "5"
      fund_amount_wei:
        description: "Wei sent from each seed to each test account during the fund phase"
        required: false
        default: "1000000000000000"
      transfer_amount_wei:
        description: "Wei per load-test transfer during warmup/run"
        required: false
        default: "10000000000000"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy current loadtest tool source to Contabo2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          source: "tools/contabo-loadtest/main.go,tools/contabo-loadtest/gen_accounts.go,go.mod,go.sum"
          target: "/root/contabo-loadtest"
          overwrite: true

      - name: Build and run the phased load test against the live node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: true
          timeout: 900s
          command_timeout: 900s
          envs: PHASE,NUM_SEEDS,DURATION,RAMP,FUND_WEI,TRANSFER_WEI
          script: |
            set -euo pipefail
            cd /root/contabo-loadtest

            # FIX (2026-07-25): this used to be
            #   MAIN="$(find . -name main.go | head -1)"
            #   [ "$MAIN" = "./main.go" ] || mv -f "$MAIN" ./main.go
            # which is correct exactly once. scp lands the file at
            # ./tools/contabo-loadtest/main.go; on the FIRST run ./main.go does
            # not exist so it gets moved up, but on every run after that BOTH
            # paths exist and `find | head -1` returns whichever the filesystem
            # happens to yield first. When that is the stale ./main.go the mv is
            # skipped, the freshly copied file is ignored, and the build silently
            # uses the OLD source. Nondeterministic, so it sometimes worked --
            # worse than always failing.
            #
            # Confirmed live: a run reported 88,221 failures and printed no
            # failure causes at all, which the current tool cannot do (`failed`
            # is incremented on exactly one line, immediately followed by
            # recordErr). An older binary can.
            #
            # The original comment's premise was right -- scp-action's tar
            # transfer may or may not preserve the tools/contabo-loadtest/
            # prefix -- but `find | head -1` resolves that ambiguity by luck.
            # Resolve it by PRECEDENCE instead: a nested copy is always the one
            # scp just wrote, so it always wins; the root copy is used only when
            # no nested copy exists, which is exactly the flattened-transfer
            # case (and then scp has already overwritten it in place). Then
            # delete the tree, so a stale nested copy can never linger into the
            # next run. Missing in both layouts is a hard error, not a silent
            # fallback to whatever was there before.
            for f in main.go gen_accounts.go; do
              if [ -f "tools/contabo-loadtest/$f" ]; then
                mv -f "tools/contabo-loadtest/$f" "./$f"
              elif [ ! -f "./$f" ]; then
                echo "✗ $f landed in neither layout after scp — aborting rather than building something stale"
                exit 1
              fi
            done
            rm -rf ./tools

            # Build identity, so "which binary produced this number" is answered
            # by the log rather than reconstructed afterwards. Compare across
            # runs: an unchanged sum after a source change means the copy did
            # not land.
            echo "=== source being built ==="
            sha256sum main.go gen_accounts.go 2>/dev/null || true

            if [ ! -f accounts.csv ]; then
              echo "No accounts.csv found in /root/contabo-loadtest -- run loadtest-prepare-contabo2.yml first, fund its printed seed addresses, then retry."
              exit 1
            fi

            echo "=== /api/status before the run ==="
            STATUS_BEFORE="$(curl -s --max-time 10 http://localhost:8080/api/status || true)"
            echo "${STATUS_BEFORE:-(status endpoint unreachable)}"
            UPTIME_BEFORE="$(echo "$STATUS_BEFORE" | grep -oP '"uptime":\K[0-9]+' || echo 0)"
            echo ""

            echo "=== Building loadtest binary (dockerized go, module cache reused across runs) ==="
            mkdir -p /root/go-mod-cache
            docker run --rm \
              -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod \
              golang:1.24-alpine \
              go build -o loadtest main.go

            echo "=== Running phase(s) [$PHASE], seeds=$NUM_SEEDS, duration=$DURATION, ramp=${RAMP}s ==="
            docker run --rm --network host \
              -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod \
              golang:1.24-alpine \
              ./loadtest \
                -accounts accounts.csv \
                -rpc http://localhost:8080/rpc \
                -status http://localhost:8080/api/status \
                -phase "$PHASE" \
                -seeds "$NUM_SEEDS" \
                -duration "$DURATION" \
                -ramp "$RAMP" \
                -fund-amount-wei "$FUND_WEI" \
                -transfer-amount-wei "$TRANSFER_WEI"

            echo ""
            echo "=== /api/status after the run ==="
            STATUS_AFTER="$(curl -s --max-time 10 http://localhost:8080/api/status || true)"
            echo "${STATUS_AFTER:-(status endpoint unreachable)}"
            UPTIME_AFTER="$(echo "$STATUS_AFTER" | grep -oP '"uptime":\K[0-9]+' || echo 0)"

            # A node that restarted mid-run measures the restart, not the chain.
            # Confirmed live 2026-07-25: a merge to main three minutes before a
            # dispatch triggered deploy-contabo2.yml, whose CI finished at
            # 05:44:30 -- nine seconds into the timed window. uptime went 340s
            # -> 55s, the monitor logged "connection reset by peer", and the run
            # reported 9.3 TPS with 88,221 failures. The workflow called that
            # SUCCESS, which is the part worth fixing: a void measurement that
            # exits 0 is worse than one that fails, because the number gets
            # quoted.
            echo ""
            echo "=== run validity ==="
            echo "  node uptime before: ${UPTIME_BEFORE}s"
            echo "  node uptime after:  ${UPTIME_AFTER}s"
            if [ "${UPTIME_AFTER:-0}" -lt "${UPTIME_BEFORE:-0}" ]; then
              echo "✗ VOID: the node RESTARTED during this run (uptime went backwards)."
              echo "  Every number above measures a restarting node, not the chain."
              echo "  Most likely cause: a push to main redeployed this box mid-run"
              echo "  (deploy-contabo2.yml runs on every push). Let any in-flight"
              echo "  deploy finish, confirm uptime is climbing, then dispatch again."
              exit 1
            fi
            echo "✓ the node did not restart during the run — the measurement stands"
        env:
          PHASE: ${{ inputs.phase }}
          NUM_SEEDS: ${{ inputs.num_seeds }}
          DURATION: ${{ inputs.duration }}
          RAMP: ${{ inputs.ramp }}
          FUND_WEI: ${{ inputs.fund_amount_wei }}
          TRANSFER_WEI: ${{ inputs.transfer_amount_wei }}
