name: Diagnose the TPS ceiling on Contabo2 (load + goroutine dumps in one run)

# WHY THIS EXISTS AS ONE WORKFLOW.
#
# Measured on Contabo2 on 2026-07-26: 423 transfers/s, with the node confirmed
# not to have restarted. The disk was measured the same day at 133-169 fsyncs/s,
# and MaxBatchSize allows 500 records per fsync -- so the WAL path should carry
# 66,000-84,000 transfers/s. It carries 423.
#
# 423/s against 133-169 fsyncs/s means roughly ONE record per fsync. The group
# commit is not batching at all. It can only bundle Appends that are in flight
# at the same moment, so something is preventing that -- and exactly two causes
# produce this same number while needing opposite fixes:
#
#   1. Transfers are SERIALISED before reaching the WAL (the global cs.mu write
#      lock). Many goroutines would then sit in semacquire. Fix: roadmap step 5.
#   2. Transfers were never CONCURRENT to begin with -- the generator sends a
#      batch and waits, so few requests are ever in flight. Few goroutines
#      overall, none blocked. Then the node is not the bottleneck and the test
#      is measuring itself.
#
# A goroutine dump taken WHILE load runs separates them in one look. Two earlier
# attempts failed purely on timing: driving the load from one workflow and the
# dump from an interactive SSH session meant the dump landed before the load
# started, and a client-side wait loop hit its 10-minute limit. Doing both
# inside ONE server-side script removes that failure mode entirely -- the dump
# cannot be early, because the same script started the load.
#
# Read-only with respect to configuration: it starts the already-built loadtest
# binary from a previous prepare/run and reads /debug/pprof. It changes no env
# var and restarts nothing.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Load duration (Go duration syntax). Dumps are taken inside this window."
        required: false
        default: "90s"
      num_seeds:
        description: "Must match the value used in loadtest-prepare-contabo2.yml"
        required: false
        default: "5"
      phase:
        description: "Phases to run. 'run' alone needs already-funded accounts; the working runs use fund,warmup,run."
        required: false
        default: "fund,warmup,run"
      accounts_csv:
        description: "Account CSV to drive from. accounts-funded.csv holds only rows that still carry AEQ, so the fund phase can be skipped entirely."
        required: false
        default: "accounts.csv"
      deploy_node:
        description: "Rebuild aequitasd from THIS ref and hot-swap it into the running container before measuring. Restarts the node."
        required: false
        default: "false"
      contention_profile:
        description: "Value for AEQUITAS_CONTENTION_PROFILE on the node (empty = off). Only applied when deploy_node is true."
        required: false
        default: ""
      extra_env:
        description: "Comma-separated KEY=VALUE pairs to set on the node for this run, e.g. AEQUITAS_WAL_FLUSH_BATCH=500. Only applied when deploy_node is true."
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hot-swapping the node binary, rather than merging to main to deploy it.
      #
      # The Contabo deploy workflows only trigger on a push to master/main, and
      # merging also redeploys the Railway-hosted primary -- taking the primary
      # down for minutes, which is exactly what must not happen repeatedly just
      # to try a measurement. This path rebuilds aequitasd from whatever ref the
      # dispatch selected and swaps it into the EXISTING container, so nothing
      # on main moves and no other node is touched.
      #
      # No image is built on the box (a standing rule here): the build runs in a
      # throwaway golang container and the result is copied into the container
      # that already exists, which keeps its own image, mounts and network.
      - name: Package node source
        if: ${{ inputs.deploy_node == 'true' }}
        run: tar czf ../node-src.tgz --exclude=.git --exclude=node_modules . && mv ../node-src.tgz .

      - name: Ship node source to Contabo2
        if: ${{ inputs.deploy_node == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          source: "node-src.tgz"
          target: "/root/aequitas-src-inbox"

      - name: Build aequitasd and hot-swap it into the running container
        if: ${{ inputs.deploy_node == 'true' }}
        env:
          CONTENTION_PROFILE: ${{ inputs.contention_profile }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 900s
          command_timeout: 900s
          envs: CONTENTION_PROFILE,EXTRA_ENV
          script: |
            set -uo pipefail
            rm -rf /root/aequitas-src && mkdir -p /root/aequitas-src
            tar xzf /root/aequitas-src-inbox/node-src.tgz -C /root/aequitas-src || { echo "untar failed"; exit 1; }
            cd /root/aequitas-src
            mkdir -p /root/go-mod-cache
            echo "=== building aequitasd with cgo (same recipe as Dockerfile) ==="
            # CGO_ENABLED=1 deliberately: the Dockerfile documents 106.3us vs
            # 269.3us per secp256k1 recovery. Building without it here would
            # measure a node 2.5x slower than production on the one cost that
            # decides whether 50k TPS is reachable at all.
            docker run --rm -v "$(pwd)":/w -w /w -v /root/go-mod-cache:/go/pkg/mod -e CGO_ENABLED=1 golang:1.24-alpine sh -c 'apk add --no-cache gcc musl-dev >/dev/null 2>&1 && go build -o aequitasd-new ./cmd/aequitasd' || { echo "BUILD FAILED -- node untouched"; exit 1; }
            ls -l aequitasd-new || exit 1
            echo "=== capturing the running container's configuration ==="
            IMAGE=$(docker inspect aequitas-node --format '{{.Config.Image}}')
            docker inspect aequitas-node --format '{{range .Config.Env}}{{println .}}{{end}}' > /root/.aequitas_env_backup
            chmod 600 /root/.aequitas_env_backup
            MOUNT_ARGS=()
            while IFS= read -r m; do [ -n "$m" ] && MOUNT_ARGS+=(-v "$m"); done < <(docker inspect aequitas-node --format '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}}:{{.Destination}}{{println}}{{end}}{{end}}')
            ENV_ARGS=()
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                PATH=*|HOSTNAME=*|HOME=*|RESYNC_FROM_SNAPSHOT=*|AEQUITAS_CONTENTION_PROFILE=*) continue ;;
                # Tuning set by a PREVIOUS sweep run must not survive into this
                # one: an inherited value would silently make the next run
                # measure something other than what it asked for, which is the
                # exact failure mode that has already cost a day here.
                AEQUITAS_WAL_FLUSH_*|AEQUITAS_WAL_QUEUE_DEPTH=*) continue ;;
              esac
              ENV_ARGS+=(-e "$line")
            done < /root/.aequitas_env_backup
            if [ -n "${EXTRA_ENV:-}" ]; then
              OLDIFS=$IFS; IFS=','
              for kv in $EXTRA_ENV; do
                [ -z "$kv" ] && continue
                ENV_ARGS+=(-e "$kv"); echo "extra env: $kv"
              done
              IFS=$OLDIFS
            fi
            # Contention profiling costs throughput on the payment path, so it
            # is set ONLY when this run asked for it, and never persists into a
            # later deploy (the case above drops any inherited value).
            if [ -n "${CONTENTION_PROFILE:-}" ]; then ENV_ARGS+=(-e "AEQUITAS_CONTENTION_PROFILE=$CONTENTION_PROFILE"); echo "contention profiling requested: $CONTENTION_PROFILE"; fi
            echo "image=$IMAGE env_count=${#ENV_ARGS[@]} mount_count=${#MOUNT_ARGS[@]}"
            docker stop aequitas-node >/dev/null 2>&1 || true
            docker rm aequitas-node >/dev/null 2>&1 || true
            # create (not run) so the new binary is in place before PID 1 starts.
            CID=$(docker create --name aequitas-node --network aequitas-net --restart unless-stopped "${ENV_ARGS[@]}" "${MOUNT_ARGS[@]}" -p 8080:8080 -p 4001:4001 "$IMAGE")
            if [ -z "$CID" ]; then echo "docker create FAILED"; exit 1; fi
            docker cp ./aequitasd-new aequitas-node:/app/aequitasd || { echo "docker cp FAILED"; exit 1; }
            docker start aequitas-node >/dev/null || { echo "docker start FAILED"; exit 1; }
            echo "=== waiting for the node to answer ==="
            OK=0
            for i in $(seq 1 60); do
              if curl -fs --max-time 3 http://127.0.0.1:8080/api/status >/dev/null 2>&1; then OK=1; break; fi
              sleep 2
            done
            if [ "$OK" != "1" ]; then
              echo "NODE DID NOT COME UP -- restoring the image's own binary"
              docker stop aequitas-node >/dev/null 2>&1 || true
              docker rm aequitas-node >/dev/null 2>&1 || true
              docker run -d --name aequitas-node --network aequitas-net --restart unless-stopped "${ENV_ARGS[@]}" "${MOUNT_ARGS[@]}" -p 8080:8080 -p 4001:4001 "$IMAGE" >/dev/null
              echo "ROLLED BACK"; exit 1
            fi
            echo "NODE UP: $(curl -s --max-time 5 http://127.0.0.1:8080/api/status | head -c 200)"
            docker logs --since 60s aequitas-node 2>&1 | grep -E '\[PROF\]' | head -3

      # WITHOUT THIS THE DIAGNOSIS MEASURES STALE CODE.
      # The first version of this workflow ran the pre-built ./loadtest
      # already on the box. When the generator's connection pool was fixed
      # in main.go, the diagnosis kept running the OLD binary and reported
      # unchanged concurrency -- which looked like the fix had not worked.
      # loadtest-run-contabo2.yml ships and rebuilds the source every time;
      # this must do the same or its verdict cannot be trusted.
      - name: Ship current loadtest source to Contabo2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          source: "tools/contabo-loadtest/main.go,tools/contabo-loadtest/gen_accounts.go,go.mod,go.sum"
          target: "/root/contabo-loadtest"

      - name: Run load and dump goroutines while it is running
        # These MUST be set here: `envs:` only forwards variables that exist
        # in the step environment. Listing them without defining them left
        # them unset on the remote side, and `set -u` then aborted the
        # docker run line silently -- which is exactly why the first run
        # produced an empty generator log and no load.
        env:
          DURATION: ${{ inputs.duration }}
          NUM_SEEDS: ${{ inputs.num_seeds }}
          PHASE: ${{ inputs.phase }}
          ACCOUNTS_CSV: ${{ inputs.accounts_csv }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 600s
          command_timeout: 600s
          envs: DURATION,NUM_SEEDS,PHASE,ACCOUNTS_CSV
          script: |
            set -uo pipefail
            cd /root/contabo-loadtest || { echo "loadtest dir missing -- run loadtest-prepare-contabo2.yml first"; exit 1; }
            # scp lands the files under tools/contabo-loadtest/; the build
            # expects them beside go.mod, exactly as loadtest-run does.
            for f in main.go gen_accounts.go; do
              [ -f "tools/contabo-loadtest/$f" ] && mv -f "tools/contabo-loadtest/$f" "./$f"
            done
            echo "=== rebuilding the generator from the shipped source ==="
            mkdir -p /root/go-mod-cache
            # Single line on purpose: this file was committed with CRLF endings
            # and a backslash continuation followed by CR does not continue the
            # line, it escapes the CR. That mangled the command into "docker run
            # ... n" and the build died on a nonexistent image called "n".
            docker run --rm -v "$(pwd)":/w -w /w -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine go build -o loadtest main.go || { echo "build failed -- refusing to measure stale code"; exit 1; }
            echo "generator built: $(date -u -r ./loadtest 2>/dev/null || stat -c %y ./loadtest)"
            [ -f "$ACCOUNTS_CSV" ] || { echo "$ACCOUNTS_CSV missing -- run loadtest-prepare-contabo2.yml (and loadtest-find-funded.yml for accounts-funded.csv) first"; exit 1; }

            echo "=== baseline: what the node looks like with NO load ==="
            docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/goroutine?debug=2' > /tmp/gd_idle.txt 2>/dev/null
            echo "goroutines idle: $(grep -c '^goroutine ' /tmp/gd_idle.txt)  lock-blocked idle: $(grep -cE '^goroutine [0-9]+ \[(semacquire|sync\.(RW)?Mutex\.[RL]?[a-zA-Z]*)' /tmp/gd_idle.txt)"

            echo "=== starting load in the background ==="
            nohup docker run --rm --network host -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine \
              ./loadtest -accounts "$ACCOUNTS_CSV" \
                -rpc http://localhost:8080/rpc \
                -status http://localhost:8080/api/status \
                -phase "$PHASE" -seeds "$NUM_SEEDS" -duration "$DURATION" -ramp 5 \
                > /tmp/loadrun.log 2>&1 &

            # Wait for the NODE to report applied transfers. Waiting on the node's
            # own counter, not on a fixed sleep, is what makes the dump provably
            # concurrent with real load -- that is the whole point of this file.
            # WAIT FOR THE RUN PHASE, NOT MERELY FOR TRAFFIC.
            #
            # This previously waited for the node to report "transfers applied"
            # and fired on the FUND phase, which moves seed money to the test
            # accounts using just 5 seed senders. Every dump then showed 6-8
            # concurrent requests -- the 5 seeds -- and that got misread as
            # proof that the generator could not keep the node busy, when the
            # 72-pair run phase had not started yet. The fund phase even ends
            # with a deliberate 15s settle pause, so some dumps landed in dead
            # air.
            #
            # The generator announces its phases, so wait for the run phase in
            # ITS log, then confirm the node is actually applying transfers.
            echo "=== waiting for the generator to enter the run phase ==="
            SEEN=0
            for i in $(seq 1 90); do
              if grep -q '=== PHASE run' /tmp/loadrun.log 2>/dev/null; then
                echo "run phase started after ~$((i*2))s"
                # Ramp is 5s, but the first pairs can take longer to get
                # their first batch accepted, so checking once and giving up
                # turned a slow start into a hard failure. Keep looking for up
                # to 30s and only then conclude nothing is arriving.
                for j in $(seq 1 10); do
                  sleep 3
                  if docker logs --since 5s aequitas-node 2>&1 | grep -qE 'transfers applied|eth_sendRawTransaction|Transfer [0-9]'; then
                    SEEN=1; echo "node confirmed applying transfers ~$((j*3))s into the run phase"; break
                  fi
                done
                if [ "$SEEN" = "0" ]; then
                  echo "run phase started but the node applied nothing for 30s -- see generator log below"
                fi
                break
              fi
              sleep 2
            done
            echo "--- generator log so far (first 30 lines) ---"
            head -30 /tmp/loadrun.log 2>/dev/null || echo "(leer)"
            if [ "$SEEN" = "0" ]; then
              # Do NOT bail. This used to exit 1 here, which threw away the
              # whole run -- including the goroutine dumps, which are the only
              # reason this workflow exists. It fired on 2026-08-21 during a
              # run whose generator was demonstrably sending (its own monitor
              # lines were climbing), so the detector, not the load, was wrong.
              #
              # A dump taken during unconfirmed load is still evidence: the
              # wait-reason histogram says whether goroutines are blocked on a
              # lock or simply absent, and "simply absent" is itself the answer
              # to whether the generator is the limit. A discarded run says
              # nothing at all.
              echo "WARNING: could not confirm applied transfers from the node's log."
              echo "Dumps are still taken below and are labelled unconfirmed -- read the"
              echo "wait-reason histogram rather than the absolute counts."
              echo "--- generator log ---"; tail -40 /tmp/loadrun.log
            fi

            # A CPU PROFILE, because goroutine dumps only show who is WAITING.
            #
            # Every bottleneck found so far was found by looking at what blocks:
            # the nonce mutex, the RPC server mutex, the exclusive state lock.
            # Those are now measured and small — the exclusive lock holds just
            # 2.8% of wall time, 13 ms average. Yet throughput sits near 1,000/s
            # with no lock contention, no CPU saturation and no memory pressure,
            # which means nothing that has been looked at so far explains it.
            #
            # A goroutine dump cannot answer that. It shows where goroutines are
            # parked, not where the time is actually spent. This captures 30
            # seconds of CPU profile in the middle of the load window and emits
            # it base64 so it can be analysed with go tool pprof off-box — the
            # node has no Go toolchain, and installing one on a live validator
            # is not worth it for a read.
            echo "=== CPU profile, 30s under load ==="
            docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/profile?seconds=30' > /tmp/cpu.pprof 2>/dev/null
            if [ -s /tmp/cpu.pprof ]; then
              echo "profile bytes: $(wc -c < /tmp/cpu.pprof)"
              # Wrapped, not one line: base64 -w0 produces a single ~136 KB
              # line and the Actions log silently drops it — the first attempt
              # emitted nothing at all past the BEGIN marker.
              # Left on disk instead of printed. Emitting ~163 KB of base64 through
              # the Actions log truncated it silently twice: the decoded file came
              # back 90 bytes short and pprof rejected it with "gzip: invalid
              # checksum", which reads like a corrupt profile rather than a lost
              # log line - exactly the kind of failure that costs a whole run
              # before anyone suspects the transport. Fetch it with scp/pscp.
              # A HEAP profile too. Under 597 concurrent senders the node reached
              # 738 MB live heap and 1,282 MB of system memory. Contabo2 has
              # 12 GB so that is harmless there, but the primary runs on Railway
              # where a container limit around 1 GB is normal - and it sat on an
              # unexplained 666 MB plateau all morning. If something here grows
              # without bound, this shows which allocation it is.
              docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/heap' > /tmp/heap-latest.pprof 2>/dev/null
              echo "heap profile saved to /tmp/heap-latest.pprof ($(wc -c < /tmp/heap-latest.pprof) bytes)"
              # Contention profiles. These are EMPTY unless the node was started
              # with AEQUITAS_CONTENTION_PROFILE set -- both are governed by a
              # sampling rate that defaults to zero, which is why every earlier
              # attempt to locate the contention from CPU and goroutine data
              # alone kept pointing at the wrong lock. Taken while the load is
              # still running, since they are cumulative since process start.
              docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/mutex' > /tmp/mutex-latest.pprof 2>/dev/null
              docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/block' > /tmp/block-latest.pprof 2>/dev/null
              echo "mutex profile: $(wc -c < /tmp/mutex-latest.pprof) bytes   block profile: $(wc -c < /tmp/block-latest.pprof) bytes"
              # The two numbers that explain the flush contention, read while
              # the load is still on: how much of the address space one flush
              # freezes (addrs_per_flush) and for how long (hold_avg_ms).
              echo "--- wal_flush ---"
              curl -s --max-time 10 http://127.0.0.1:8080/api/health/combined | tr ',' '\n' | grep -A 0 -E 'wal_flush|addrs_per_flush|hold_avg_ms|hold_max_ms|items_per_flush|db_avg_ms|cfg_batch|cfg_concurrency|"flushes"' | head -12
              mv -f /tmp/cpu.pprof /tmp/cpu-latest.pprof
              echo "profile saved to /tmp/cpu-latest.pprof ($(wc -c < /tmp/cpu-latest.pprof) bytes)"

              # RENDER them. Capturing a profile and never reading it is how
              # this workflow kept producing a verdict from goroutine counts
              # alone -- which say who is WAITING, never who is HOLDING. The
              # mutex profile names the holder, and that is the only thing that
              # says which lock to fix.
              for prof in mutex block cpu; do
                f=/tmp/$prof-latest.pprof
                [ -s "$f" ] || { echo "--- $prof profile: empty, skipped ---"; continue; }
                echo "--- $prof profile, top 20 by cumulative ---"
                docker run --rm -v /tmp:/t golang:1.24-alpine                   go tool pprof -top -cum -nodecount=20 "/t/$prof-latest.pprof" 2>&1                   | grep -vE '^(Type|Time|Duration|Showing|Dropped|File|Build)' | head -24
              done
            else
              echo "(profile empty — is the pprof server reachable inside the container?)"
            fi

            # Three samples: one dump could catch an unlucky instant.
            for n in 1 2 3; do
              echo "=== dump $n (under load) ==="
              docker logs --since 3s aequitas-node 2>&1 | grep 'transfers applied' | tail -1
              docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/goroutine?debug=2' > "/tmp/gd_$n.txt" 2>/dev/null
              TOTAL=$(grep -c '^goroutine ' "/tmp/gd_$n.txt" || true)
              SEM=$(grep -cE "^goroutine [0-9]+ \[(semacquire|sync\.(RW)?Mutex\.[RL]?[a-zA-Z]*)" "/tmp/gd_$n.txt" || true)
              echo "goroutines: $TOTAL   blocked on a lock (semacquire): $SEM"
              echo "--- what the blocked ones are waiting in ---"
              grep -B2 -E "semacquire|SemacquireMutex|sync\.Mutex\.Lock" "/tmp/gd_$n.txt" | grep -oE 'keeper\.\(\*[A-Za-z]+\)\.[A-Za-z]+|wal\.\(\*[A-Za-z]+\)\.[A-Za-z]+' | sort | uniq -c | sort -rn | head -10
              echo "--- busiest keeper/wal frames overall ---"
              grep -oE 'keeper\.\(\*[A-Za-z]+\)\.[A-Za-z]+|wal\.\(\*[A-Za-z]+\)\.[A-Za-z]+' "/tmp/gd_$n.txt" | sort | uniq -c | sort -rn | head -12
              # THE FRAME THAT ACTUALLY ANSWERS THE QUESTION.
              #
              # Counting keeper/wal frames showed all 72 request goroutines
              # sitting in sendRawTransaction with none in wal.Append and none
              # on a mutex -- so the wait is neither the WAL nor a lock. But the
              # innermost frame, the one naming what they are blocked ON
              # (database/sql, pq, a channel, a syscall), is not a keeper or wal
              # symbol, so that filter cut away the only line that matters.
              #
              # Print one whole stack instead. Every one of the 72 is in the
              # same place, so a single representative trace is enough, and the
              # goroutine header carries the wait reason and how long it has
              # been blocked.
              echo "--- ONE FULL STACK of a request goroutine (what the wait is really on) ---"
              awk 'BEGIN{RS=""} /^goroutine [0-9]+ \[sync\.Mutex\.Lock/{print; exit}' "/tmp/gd_$n.txt" | head -32
              echo "--- and one RWMutex waiter for comparison ---"
              awk 'BEGIN{RS=""} /^goroutine [0-9]+ \[sync\.RWMutex/{print; exit}' "/tmp/gd_$n.txt" | head -20
              echo "--- wait reasons across all goroutines ---"
              grep -oE '^goroutine [0-9]+ \[[^]]+\]' "/tmp/gd_$n.txt" | sed -E 's/goroutine [0-9]+ //' | sort | uniq -c | sort -rn | head -10
              sleep 8
            done

            echo "=== VERDICT INPUT ==="
            echo "idle goroutines: $(grep -c '^goroutine ' /tmp/gd_idle.txt)"
            echo "Many goroutines in semacquire  -> serialised before the WAL (roadmap step 5 is the fix)."
            echo "Few goroutines, none blocked   -> the generator never had many requests in flight; the node is not the limit."
            rm -f /tmp/gd_idle.txt /tmp/gd_1.txt /tmp/gd_2.txt /tmp/gd_3.txt
