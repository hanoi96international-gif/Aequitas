name: Diagnose the TPS ceiling on Contabo2 (load + goroutine dumps in one run)

# WHY THIS EXISTS AS ONE WORKFLOW.
#
# Measured on Contabo2 on 2026-07-26: 423 transfers/s, with the node confirmed
# not to have restarted. The disk was measured the same day at 133-169 fsyncs/s,
# and MaxBatchSize allows 500 records per fsync -- so the WAL path should carry
# 66,000-84,000 transfers/s. It carries 423.
#
# 423/s against 133-169 fsyncs/s means roughly ONE record per fsync. The group
# commit is not batching at all. It can only bundle Appends that are in flight
# at the same moment, so something is preventing that -- and exactly two causes
# produce this same number while needing opposite fixes:
#
#   1. Transfers are SERIALISED before reaching the WAL (the global cs.mu write
#      lock). Many goroutines would then sit in semacquire. Fix: roadmap step 5.
#   2. Transfers were never CONCURRENT to begin with -- the generator sends a
#      batch and waits, so few requests are ever in flight. Few goroutines
#      overall, none blocked. Then the node is not the bottleneck and the test
#      is measuring itself.
#
# A goroutine dump taken WHILE load runs separates them in one look. Two earlier
# attempts failed purely on timing: driving the load from one workflow and the
# dump from an interactive SSH session meant the dump landed before the load
# started, and a client-side wait loop hit its 10-minute limit. Doing both
# inside ONE server-side script removes that failure mode entirely -- the dump
# cannot be early, because the same script started the load.
#
# Read-only with respect to configuration: it starts the already-built loadtest
# binary from a previous prepare/run and reads /debug/pprof. It changes no env
# var and restarts nothing.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Load duration (Go duration syntax). Dumps are taken inside this window."
        required: false
        default: "90s"
      num_seeds:
        description: "Must match the value used in loadtest-prepare-contabo2.yml"
        required: false
        default: "5"
      phase:
        description: "Phases to run. 'run' alone needs already-funded accounts; the working runs use fund,warmup,run."
        required: false
        default: "fund,warmup,run"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WITHOUT THIS THE DIAGNOSIS MEASURES STALE CODE.
      # The first version of this workflow ran the pre-built ./loadtest
      # already on the box. When the generator's connection pool was fixed
      # in main.go, the diagnosis kept running the OLD binary and reported
      # unchanged concurrency -- which looked like the fix had not worked.
      # loadtest-run-contabo2.yml ships and rebuilds the source every time;
      # this must do the same or its verdict cannot be trusted.
      - name: Ship current loadtest source to Contabo2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          source: "tools/contabo-loadtest/main.go,tools/contabo-loadtest/gen_accounts.go,go.mod,go.sum"
          target: "/root/contabo-loadtest"

      - name: Run load and dump goroutines while it is running
        # These MUST be set here: `envs:` only forwards variables that exist
        # in the step environment. Listing them without defining them left
        # them unset on the remote side, and `set -u` then aborted the
        # docker run line silently -- which is exactly why the first run
        # produced an empty generator log and no load.
        env:
          DURATION: ${{ inputs.duration }}
          NUM_SEEDS: ${{ inputs.num_seeds }}
          PHASE: ${{ inputs.phase }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.163.188.71
          username: root
          key: ${{ secrets.CONTABO2_SSH_KEY }}
          port: 22
          fingerprint: "SHA256:VIwj7Faxiga2n45HVHZEQFPxcbRKHgSgHoxAFsf2wto"
          script_stop: false
          timeout: 600s
          command_timeout: 600s
          envs: DURATION,NUM_SEEDS,PHASE
          script: |
            set -uo pipefail
            cd /root/contabo-loadtest || { echo "loadtest dir missing -- run loadtest-prepare-contabo2.yml first"; exit 1; }
            # scp lands the files under tools/contabo-loadtest/; the build
            # expects them beside go.mod, exactly as loadtest-run does.
            for f in main.go gen_accounts.go; do
              [ -f "tools/contabo-loadtest/$f" ] && mv -f "tools/contabo-loadtest/$f" "./$f"
            done
            echo "=== rebuilding the generator from the shipped source ==="
            mkdir -p /root/go-mod-cache
            # Single line on purpose: this file was committed with CRLF endings
            # and a backslash continuation followed by CR does not continue the
            # line, it escapes the CR. That mangled the command into "docker run
            # ... n" and the build died on a nonexistent image called "n".
            docker run --rm -v "$(pwd)":/w -w /w -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine go build -o loadtest main.go || { echo "build failed -- refusing to measure stale code"; exit 1; }
            echo "generator built: $(date -u -r ./loadtest 2>/dev/null || stat -c %y ./loadtest)"
            [ -f accounts.csv ] || { echo "accounts.csv missing -- run loadtest-prepare-contabo2.yml first"; exit 1; }

            echo "=== baseline: what the node looks like with NO load ==="
            docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/goroutine?debug=2' > /tmp/gd_idle.txt 2>/dev/null
            echo "goroutines idle: $(grep -c '^goroutine ' /tmp/gd_idle.txt)  semacquire idle: $(grep -c semacquire /tmp/gd_idle.txt)"

            echo "=== starting load in the background ==="
            nohup docker run --rm --network host -v "$(pwd)":/w -w /w \
              -v /root/go-mod-cache:/go/pkg/mod golang:1.24-alpine \
              ./loadtest -accounts accounts.csv \
                -rpc http://localhost:8080/rpc \
                -status http://localhost:8080/api/status \
                -phase "$PHASE" -seeds "$NUM_SEEDS" -duration "$DURATION" -ramp 5 \
                > /tmp/loadrun.log 2>&1 &

            # Wait for the NODE to report applied transfers. Waiting on the node's
            # own counter, not on a fixed sleep, is what makes the dump provably
            # concurrent with real load -- that is the whole point of this file.
            echo "=== waiting until the node reports applied transfers ==="
            SEEN=0
            for i in $(seq 1 60); do
              if docker logs --since 4s aequitas-node 2>&1 | grep -q 'transfers applied'; then
                SEEN=1; echo "load detected after ~${i}x2s"; break
              fi
              sleep 2
            done
            echo "--- generator log so far (first 30 lines) ---"
            head -30 /tmp/loadrun.log 2>/dev/null || echo "(leer)"
            if [ "$SEEN" = "0" ]; then
              echo "NO LOAD DETECTED -- the dumps below would be meaningless, so none were taken."
              echo "--- generator log ---"; tail -40 /tmp/loadrun.log
              exit 1
            fi

            # Three samples: one dump could catch an unlucky instant.
            for n in 1 2 3; do
              echo "=== dump $n (under load) ==="
              docker logs --since 3s aequitas-node 2>&1 | grep 'transfers applied' | tail -1
              docker exec aequitas-node wget -qO- 'http://127.0.0.1:6061/debug/pprof/goroutine?debug=2' > "/tmp/gd_$n.txt" 2>/dev/null
              TOTAL=$(grep -c '^goroutine ' "/tmp/gd_$n.txt")
              SEM=$(grep -c semacquire "/tmp/gd_$n.txt")
              echo "goroutines: $TOTAL   blocked on a lock (semacquire): $SEM"
              echo "--- what the blocked ones are waiting in ---"
              grep -B2 semacquire "/tmp/gd_$n.txt" | grep -oE 'keeper\.\(\*[A-Za-z]+\)\.[A-Za-z]+|wal\.\(\*[A-Za-z]+\)\.[A-Za-z]+' | sort | uniq -c | sort -rn | head -10
              echo "--- busiest keeper/wal frames overall ---"
              grep -oE 'keeper\.\(\*[A-Za-z]+\)\.[A-Za-z]+|wal\.\(\*[A-Za-z]+\)\.[A-Za-z]+' "/tmp/gd_$n.txt" | sort | uniq -c | sort -rn | head -12
              sleep 8
            done

            echo "=== VERDICT INPUT ==="
            echo "idle goroutines: $(grep -c '^goroutine ' /tmp/gd_idle.txt)"
            echo "Many goroutines in semacquire  -> serialised before the WAL (roadmap step 5 is the fix)."
            echo "Few goroutines, none blocked   -> the generator never had many requests in flight; the node is not the limit."
            rm -f /tmp/gd_idle.txt /tmp/gd_1.txt /tmp/gd_2.txt /tmp/gd_3.txt
