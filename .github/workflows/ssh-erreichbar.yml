name: SSH-Erreichbarkeit C1 (Diagnose, ohne Secrets)

# Liest nur: ob C1 auf Port 22 antwortet und welchen Host-Schluessel er
# zeigt -- von beiden Runner-Bildern aus. Seit `ubuntu-latest` auf 26.04
# zeigt, liefert ssh-keyscan dort keinen Schluessel mehr (24.10.2026), auf
# 24.04 lief derselbe Schritt kurz vorher durch. Kein Secret, keine Anmeldung.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/ssh-erreichbar.yml"]

permissions:
  contents: read

jobs:
  pruefen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: ssh-keyscan je dreimal ohne -T, mit -T 5 und -T 10
        run: |
          set -u
          ssh -V 2>&1
          for t in "" "-T 5" "-T 10"; do
            for i in 1 2 3; do
              start=$(date +%s.%N)
              # shellcheck disable=SC2086
              n=$(ssh-keyscan $t -t ed25519 188.172.229.121 2>/tmp/err | grep -c . || true)
              ende=$(date +%s.%N)
              echo "keyscan ${t:-ohne -T} #$i: $n Zeile(n), $(echo "$ende - $start" | bc) s, stderr: $(grep -v '^#' /tmp/err | head -2 | tr '\n' ' ')"
            done
          done
