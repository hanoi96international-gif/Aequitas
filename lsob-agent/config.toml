# LSOB trade agent — every strategy rule is a value in this file.
#
# The defaults are a reasonable starting point, not a tuned strategy. Change
# them one at a time and re-run the backtest; changing several at once tells
# you nothing about which one mattered.

[market]
exchange  = "binance"
symbol    = "BTC/USDT"
timeframe = "15m"

[data]
# Pfad zu eigenen Kerzen. Akzeptiert beschriftete CSVs *und* das
# headerlose Binance-Archivformat (auch als .zip, ohne Entpacken).
# Ganze Monate ohne API-Key holen:
#   python -m lsob fetch --months 2024-01:2024-12
csv           = ""
cache_dir     = "data"
history_bars  = 3000
# Echte Kursreihen enthalten Balken, die kein Markt gedruckt hat. Standardmäßig
# an, weil ein einziger kaputter Balken den ATR für `atr_period` Balken
# vergiftet — und die Strategie dann still gar keine Signale mehr liefert.
clean         = true
spike_ratio   = 10.0    # max. High/Low innerhalb eines Balkens
jump_ratio    = 10.0    # max. Close-zu-Close gegen den letzten guten Balken

[structure]
swing_left   = 3         # bars either side of a pivot; higher = fewer, more meaningful swings
swing_right  = 3         # also the delay before a pivot is knowable
atr_period   = 14
bos_use_close = true     # a break needs a close through the level, not just a wick

[liquidity]
equal_level_atr      = 0.15   # swing highs within this ATR distance are one pool, not two
min_penetration_atr  = 0.0    # how far past the level price must reach to count as a raid
max_penetration_atr  = 1.5    # beyond this it is a breakout, not a sweep
reclaim_bars         = 2      # bars allowed for price to close back inside (0 = same bar only)
pool_max_age_bars    = 500    # forget untouched levels this old (0 = never)
min_touches          = 1      # 2+ trades only equal highs/lows, where more stops rest

[orderblock]
displacement_atr        = 1.0   # the move away from the raid, in ATR
displacement_max_bars   = 8     # displacement must arrive within this many bars of the sweep
require_bos             = true  # and it must break the opposing swing
require_fvg             = false # optionally also demand a fair-value gap in the leg
ob_max_lookback         = 12    # how far back to hunt for the last opposing candle
ob_include_sweep_candle = true
zone_mode               = "body_to_extreme"  # body | full | body_to_extreme

[entry]
edge               = "proximal"      # proximal fills first and risks less; distal fills less often
# edge = "retracement": Einstieg auf einer Rücklaufebene des Displacement-Beins
# statt an der Blockkante. Tieferer Einstieg = engerer Stop = mehr R, dafür
# muss der Rücklauf fast das ganze Bein zurücklegen, um überhaupt zu füllen.
# 0.882 ist nur der Vorgabewert, keine belegte Regel — setz hier deine eigene.
retracement          = 0.882
retracement_in_block = true    # Rücklaufebene muss im Order Block liegen
# Die Leiter, die `lsob chart --fib` zeichnet. Das sind die fortgesetzten
# Quadratwurzeln des Goldenen Schnitts — 0.786 = √0.618, 0.882 = √0.786,
# 0.941 = √0.882 — weshalb sich die tiefen Ebenen zusammendrängen.
# Nur `retracement` wählt den Einstieg; der Rest ist Kontext.
# Acht der neun Sprossen sind gegen einen echten Chart nachgerechnet und
# stimmen auf die Nachkommastelle. Die Sprosse zwischen 0.5 und 0.786 war im
# Screenshot nicht sicher lesbar — 0.65 ist die beste Lesart, ändere sie hier.
fib_levels = [0.236, 0.382, 0.5, 0.65, 0.786, 0.882, 0.941]
valid_bars         = 20              # pull the resting order after this many bars
sl_anchor          = "sweep_extreme" # sweep_extreme | ob_extreme
sl_buffer_atr      = 0.25
tp_mode            = "rr"            # rr | liquidity | fib
# tp_mode = "fib": Ausstiege auf tieferen Sprossen derselben Leiter.
# Wer eine Sprosse snipert, sollte auf Sprossen aussteigen — R und Fib
# sind zwei Maßstäbe, und sie zu mischen verwischt beide.
# ACHTUNG zur Geometrie: Einstieg 0.882 mit Stop hinter 1.0 riskiert 0.118
# des Beins. Die Sprosse 0.786 liegt nur 0.096 entfernt — ein Scalp dorthin
# zahlt strukturell unter 1R und wird von min_rr verworfen, egal wie gut der
# Markt läuft. Die erste Sprosse, die 1R trägt, liegt bei rund 0.764.
tp_fib             = [0.786, 0.5]
tp_rr              = [1.5, 3.0]      # ascending R multiples
tp_weights         = [0.5, 0.5]      # must sum to 1.0
breakeven_after_tp = 1               # move the stop to entry after the 1st target (0 = off)
min_rr             = 1.5             # skip setups that cannot pay this

[filters]
# Kontextfilter: WO in der Range und WANN ein Setup zählt.
# Alle standardmäßig aus — jeder schneidet die Trade-Zahl stark, und ein
# Filter, der auf der Stichprobe validiert wurde, auf der er gewählt wurde,
# hat nichts bewiesen. Einzeln zuschalten und per walkforward prüfen.
premium_discount    = false   # Shorts nur im Premium, Longs nur im Discount
range_swings        = 5       # Swings je Seite, die die Dealing Range aufspannen
pd_threshold        = 0.5     # 0.5 = Equilibrium; höher verlangt tieferes Premium
require_unmitigated = false   # Blocks verwerfen, in die der Preis schon zurücklief
                              # (greift selten: ~2% der Setups bei ob_max_lookback=12)
require_inducement  = false   # Erst einsteigen, wenn der Preis das Zwischenhoch/-tief
                              # VOR dem Block abgeholt hat. Läuft er ohne diesen
                              # Abgriff direkt hinein, ist der Tap verfrüht.
inducement_swing    = 1       # Fraktalgröße für diese Zwischenswings
session_enabled     = false   # nur in den Kill Zones handeln
session_windows     = ["07:00-10:00", "12:00-15:00"]   # UTC
session_days        = [0, 1, 2, 3, 4]                  # Mo-Fr

[bias]
mode           = "off"   # off | ema | htf_structure
ema_period     = 200
htf_multiplier = 4       # htf_structure: 4 × 15m = 1h

[risk]
starting_equity  = 10000.0
risk_pct         = 0.5   # percent of equity risked per trade
max_concurrent   = 1
cooldown_bars    = 3
max_position_pct = 100.0
allow_long       = true
allow_short      = true

[costs]
maker_fee_bps = 2.0      # limit entries and take-profits
taker_fee_bps = 5.0      # stops
slippage_bps  = 1.0      # applied to stops only

[live]
enabled        = false   # must be true before `lsob run` will do anything
mode           = "paper" # paper | live
sandbox        = true    # live mode uses the exchange testnet unless this is false
poll_seconds   = 15
state_file     = "state/agent.json"
api_key_env    = "LSOB_API_KEY"
api_secret_env = "LSOB_API_SECRET"

[notify]
console            = true
telegram_token_env = "LSOB_TG_TOKEN"
telegram_chat_env  = "LSOB_TG_CHAT"

[walkforward]
# `lsob walkforward` optimises on train_bars, then scores the winner on the
# next test_bars — data it was never chosen on — and rolls forward.
train_bars = 2000
test_bars  = 1000
min_trades = 10
metric     = "expectancy_r"   # expectancy_r | total_r | profit_factor
selection  = "robust"         # robust prefers a broad plateau over a lone spike;
                              # "peak" takes the single best score and fits noise

[walkforward.grid]
# Dotted paths into any section above. Every combination is searched, so
# keep this small: 4 x 3 x 3 is already 36 sets per fold.
"orderblock.displacement_atr"   = [0.5, 1.0, 1.5, 2.0]
"liquidity.max_penetration_atr" = [1.0, 1.5, 2.5]
"entry.valid_bars"              = [10, 20, 40]
